        /* Same network/grid language as landing LandingCanvasBackground */
        const ContactCanvas = ({ theme }) => {
            const canvasRef = useRef(null);
            const frameRef = useRef(null);
            const stateRef = useRef({ nodes: [], w: 0, h: 0, linkDist: 130 });

            const isDark = useMemo(() => (
                theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
            ), [theme]);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return undefined;

                const ctx = canvas.getContext('2d');
                const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                const GRID_STEP = 48;

                const getNetworkParams = (w, h) => {
                    if (w < 768) return { nodeCount: 42, linkDist: 130 };
                    if (w < 1024) return { nodeCount: 48, linkDist: 140 };
                    const area = w * h;
                    const nodeCount = Math.max(52, Math.min(72, Math.round(area / 32000)));
                    const spacing = Math.sqrt(area / nodeCount);
                    const linkDist = Math.max(145, Math.min(190, Math.round(spacing * 1.35)));
                    return { nodeCount, linkDist };
                };

                const palette = () => (isDark ? {
                    fill: '#020617',
                    grid: 'rgba(148, 163, 184, 0.07)',
                    line: 'rgba(251, 191, 36, 0.42)',
                    node: 'rgba(245, 158, 11, 0.5)',
                    vignette: 'rgba(2, 6, 23, 0.4)',
                } : {
                    fill: '#ffffff',
                    grid: 'rgba(148, 163, 184, 0.08)',
                    line: 'rgba(217, 119, 6, 0.28)',
                    node: 'rgba(217, 119, 6, 0.32)',
                    vignette: 'rgba(255, 255, 255, 0.35)',
                });

                const seedNodes = (w, h, count) => Array.from({ length: count }, (_, i) => {
                    const isHub = i % 16 === 0;
                    return {
                        x: Math.random() * w,
                        y: Math.random() * h,
                        vx: (Math.random() - 0.5) * (isHub ? 0.07 : 0.12),
                        vy: (Math.random() - 0.5) * (isHub ? 0.07 : 0.12),
                        r: isHub ? 1.8 + Math.random() * 0.8 : 1 + Math.random() * 1.4,
                        hub: isHub,
                    };
                });

                const resize = () => {
                    const dpr = Math.min(window.devicePixelRatio || 1, 2);
                    const w = window.innerWidth;
                    const h = window.innerHeight;
                    const { nodeCount, linkDist } = getNetworkParams(w, h);
                    canvas.width = Math.floor(w * dpr);
                    canvas.height = Math.floor(h * dpr);
                    canvas.style.width = `${w}px`;
                    canvas.style.height = `${h}px`;
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                    const prev = stateRef.current;
                    const sizeChanged = Math.abs(prev.w - w) > 64 || Math.abs(prev.h - h) > 64;
                    const countChanged = prev.nodes.length !== nodeCount;
                    if (!prev.nodes.length || sizeChanged || countChanged) {
                        stateRef.current.nodes = seedNodes(w, h, nodeCount);
                    } else {
                        for (const node of prev.nodes) {
                            node.x = Math.max(0, Math.min(w, node.x));
                            node.y = Math.max(0, Math.min(h, node.y));
                        }
                    }
                    stateRef.current.w = w;
                    stateRef.current.h = h;
                    stateRef.current.linkDist = linkDist;
                };

                const draw = () => {
                    const { w, h, nodes, linkDist } = stateRef.current;
                    if (!w || !h) return;

                    const colors = palette();
                    ctx.clearRect(0, 0, w, h);
                    ctx.fillStyle = colors.fill;
                    ctx.fillRect(0, 0, w, h);

                    ctx.strokeStyle = colors.grid;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    for (let x = 0; x <= w; x += GRID_STEP) {
                        ctx.moveTo(x + 0.5, 0);
                        ctx.lineTo(x + 0.5, h);
                    }
                    for (let y = 0; y <= h; y += GRID_STEP) {
                        ctx.moveTo(0, y + 0.5);
                        ctx.lineTo(w, y + 0.5);
                    }
                    ctx.stroke();

                    const cx = w / 2;
                    const cy = h / 2;
                    const radius = Math.max(w, h) * 0.72;
                    const vignette = ctx.createRadialGradient(cx, cy, radius * 0.15, cx, cy, radius);
                    vignette.addColorStop(0, 'rgba(0,0,0,0)');
                    vignette.addColorStop(1, colors.vignette);
                    ctx.fillStyle = vignette;
                    ctx.fillRect(0, 0, w, h);

                    if (!prefersReducedMotion) {
                        for (const node of nodes) {
                            node.x += node.vx;
                            node.y += node.vy;
                            if (node.x <= 0 || node.x >= w) node.vx *= -1;
                            if (node.y <= 0 || node.y >= h) node.vy *= -1;
                            node.x = Math.max(0, Math.min(w, node.x));
                            node.y = Math.max(0, Math.min(h, node.y));
                        }
                    }

                    const maxLink = linkDist || 130;
                    const hubBonus = w >= 1024 ? maxLink * 0.12 : 0;
                    for (let i = 0; i < nodes.length; i++) {
                        for (let j = i + 1; j < nodes.length; j++) {
                            const dx = nodes[i].x - nodes[j].x;
                            const dy = nodes[i].y - nodes[j].y;
                            const dist = Math.hypot(dx, dy);
                            const reach = maxLink + ((nodes[i].hub || nodes[j].hub) ? hubBonus : 0);
                            if (dist < reach) {
                                const fade = 1 - dist / reach;
                                ctx.globalAlpha = 0.18 + fade * (isDark ? 0.38 : 0.32);
                                ctx.strokeStyle = colors.line;
                                ctx.lineWidth = 1;
                                ctx.beginPath();
                                ctx.moveTo(nodes[i].x, nodes[i].y);
                                ctx.lineTo(nodes[j].x, nodes[j].y);
                                ctx.stroke();
                            }
                        }
                    }
                    ctx.globalAlpha = 1;

                    for (const node of nodes) {
                        ctx.beginPath();
                        ctx.arc(node.x, node.y, node.r, 0, Math.PI * 2);
                        ctx.fillStyle = colors.node;
                        ctx.fill();
                    }
                };

                const tick = () => {
                    draw();
                    frameRef.current = requestAnimationFrame(tick);
                };

                resize();
                draw();
                window.addEventListener('resize', resize);
                frameRef.current = requestAnimationFrame(tick);
                return () => {
                    window.removeEventListener('resize', resize);
                    if (frameRef.current) cancelAnimationFrame(frameRef.current);
                };
            }, [isDark]);

            return <canvas ref={canvasRef} className="contact-canvas-bg" aria-hidden="true" />;
        };

            useEffect(() => () => clearMenuCloseTimer(), [clearMenuCloseTimer]);

            const isTabActive = useCallback((item) => {

            const updateIndicator = useCallback(() => {
                if (handoffPendingRef.current) return;

                const target = tabRefs.current[indicatorTargetId];
                if (!track || !target) {
                    setIndicator(prev => (prev.ready ? { ...prev, ready: false } : prev));

                }
                const trackRect = track.getBoundingClientRect();
                const targetRect = target.getBoundingClientRect();
                setIndicator({
                    // the highlight is positioned inside the bar's 1px border, so measure from there
                    left: targetRect.left - trackRect.left - track.clientLeft,
                    top: targetRect.top - trackRect.top - track.clientTop,

                    height: targetRect.height,

                };
            }, [indicatorTargetId, items, navFits, updateIndicator]);

                measure();
                const ro = new ResizeObserver(measure);
                if (slotRef.current) ro.observe(slotRef.current);
                if (rulerRef.current) ro.observe(rulerRef.current);
                window.addEventListener('resize', measure);
                return () => {
                    ro.disconnect();
                    window.removeEventListener('resize', measure);
                };
            }, [items, onCollapseChange]);

            useEffect(() => {
                if (!navFits) setOpenMenuId(null);
            }, [navFits]);

            const updateMenuRect = useCallback(() => {
                if (!openMenuId) return;
                const el = triggerRefs.current[openMenuId];
                if (!el) return;
                const r = el.getBoundingClientRect();
                setMenuRect({
                    top: r.bottom + 8,
                    left: r.left,
                    minWidth: Math.max(r.width, 192),
                });
            }, [openMenuId]);

            useEffect(() => {
                if (!openMenuId) {
                    setMenuRect(null);
                    return undefined;
                }
                updateMenuRect();
                const onLayout = () => updateMenuRect();
                window.addEventListener('resize', onLayout);
                window.addEventListener('scroll', onLayout, true);
                return () => {
                    window.removeEventListener('resize', onLayout);
                    window.removeEventListener('scroll', onLayout, true);
                };
            }, [openMenuId, updateMenuRect]);

            useEffect(() => {
                if (!openMenuId) {
                    setOpenNestedId(null);
                    return undefined;
                }
                const onKeyDown = (e) => {
                    if (e.key !== 'Escape') return;
                    if (openNestedId) {
                        setOpenNestedId(null);
                        return;
                    }
                    closeMenu();
                };
                window.addEventListener('keydown', onKeyDown);
                return () => window.removeEventListener('keydown', onKeyDown);
            }, [openMenuId, openNestedId, closeMenu]);

            useLayoutEffect(() => {
                if (!openNestedId) {
                    setNestedPlacement('right');
                    return undefined;
                }
                const el = nestedTriggerRefs.current[openNestedId];
                if (!el) return undefined;
                const updatePlacement = () => {
                    const r = el.getBoundingClientRect();
                    const spaceRight = window.innerWidth - r.right;
                    setNestedPlacement(spaceRight < 200 ? 'left' : 'right');
                };
                updatePlacement();
                window.addEventListener('resize', updatePlacement);
                return () => window.removeEventListener('resize', updatePlacement);
            }, [openNestedId, menuRect]);

            useEffect(() => {
                if (!navFits) return undefined;
                const el = scrollRef.current;
                if (!el) return;
                const onWheel = (e) => {
                    if (el.scrollWidth <= el.clientWidth) return;
                    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
                    if (e.deltaY === 0) return;
                    e.preventDefault();
                    el.scrollLeft += e.deltaY;
                };
                el.addEventListener('wheel', onWheel, { passive: false });
                return () => el.removeEventListener('wheel', onWheel);
            }, [items, navFits]);

            const tabClass = (isActive) => `header-nav-tab ${isActive ? 'header-nav-tab-active' : ''}`;

            const toggleMenu = useCallback((id) => {
                setOpenNestedId(null);
                setOpenMenuId(prev => (prev === id ? null : id));
            }, []);

            const closeMenuAndNav = useCallback((id) => {
                onNav(id);
                closeMenu();
            }, [onNav, closeMenu]);

            const toggleNestedMenu = useCallback((id) => {
                setOpenNestedId(prev => (prev === id ? null : id));
            }, []);

            const onDropdownTriggerEnter = useCallback((id) => {
                if (!prefersHoverMenus()) return;
                openMenu(id);
            }, [openMenu, prefersHoverMenus]);

            const onDropdownTriggerLeave = useCallback(() => {
                if (!prefersHoverMenus()) return;
                scheduleCloseMenu();
            }, [prefersHoverMenus, scheduleCloseMenu]);

            const onDropdownMenuEnter = useCallback(() => {
                if (!prefersHoverMenus()) return;
                clearMenuCloseTimer();
            }, [clearMenuCloseTimer, prefersHoverMenus]);

            const onDropdownMenuLeave = useCallback(() => {
                if (!prefersHoverMenus()) return;
                scheduleCloseMenu();
            }, [prefersHoverMenus, scheduleCloseMenu]);

            const onPlainTabEnter = useCallback(() => {
                if (!prefersHoverMenus()) return;
                if (openMenuId) scheduleCloseMenu();
            }, [openMenuId, prefersHoverMenus, scheduleCloseMenu]);

            const renderMenuEntries = (entries) => {
                const nodes = [];
                entries.forEach((entry) => {
                    if (entry.children?.length) {
                        const isNestedOpen = openNestedId === entry.id;
                        const nestedActive = navItemContainsId(entry, activeId);
                        nodes.push(
                            <div
                                key={entry.id}
                                className="header-nav-aps-nested-wrap"
                                onMouseEnter={() => {
                                    if (prefersHoverMenus()) setOpenNestedId(entry.id);

                                <button
                                    ref={(el) => {

                                        else delete nestedTriggerRefs.current[entry.id];

                                    role="menuitem"
                                    aria-expanded={isNestedOpen}
                                    aria-haspopup="menu"
                                    onClick={() => toggleNestedMenu(entry.id)}
                                    className={`${tabClass(nestedActive)} header-nav-child header-nav-aps-nested-trigger`}
                                >
                                    <span>{entry.label}</span>
                                    <ChevronDownIcon className={`header-nav-chevron header-nav-chevron-nested${isNestedOpen ? ' header-nav-chevron-nested-open' : ''}`} />
                                </button>
                                {isNestedOpen && (
                                    <div
                                        className={`header-nav-aps-nested-menu${nestedPlacement === 'left' ? ' header-nav-aps-nested-menu-left' : ''}`}

                                                key={child.id}
                                                type="button"
                                                role="menuitem"
                                                onClick={() => closeMenuAndNav(child.id)}
                                                className={`${tabClass(activeId === child.id)} header-nav-child`}
                                            >
                                                {child.label}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>

                        return;
                    }
                    nodes.push(
                        <button
                            key={entry.id}
                            type="button"
                            role="menuitem"
                            onClick={() => closeMenuAndNav(entry.id)}
                            onMouseEnter={() => {
                                if (prefersHoverMenus()) setOpenNestedId(null);
                            }}
                            className={`${tabClass(activeId === entry.id)} header-nav-child`}

                            {entry.label}
                        </button>

                return nodes;
            };

            const renderRulerTabs = () => items.map(item => {
                if (item.children?.length) {

                        <span key={item.id} className={`${tabClass(false)} inline-flex items-center`} aria-hidden="true">

                            <div className="grid gap-2">
                                {renderNavTree(items)}

                                    ))}
                                </ul>
                            </div>

                            <div>
                                <h3 className="text-sm font-semibold text-slate-900 dark:text-white mb-4">{ui.footer_legal}</h3>
                                <ul className="space-y-2.5">
                                    {legalLinks.map((link) => (
                                        <li key={link.label}>
                                            <a href={link.href} className={footerLinkClass}>{link.label}</a>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        </div>

                        <div className="opus-site-footer-divider mt-8 md:mt-10 pt-5 md:pt-6 border-t">
                            <p className="text-xs text-slate-400 dark:text-slate-500 text-center">
                                © {year} Operartis Analytics. All rights reserved.
                            </p>
                        </div>
                    </div>
                </footer>
            );
        };

        // Render policy text; [[...]] becomes a highlighted placeholder
        const policyText = (text) => String(text).split(/(\[\[.*?\]\])/g).filter(Boolean).map((part, i) => (
            part.startsWith('[[') && part.endsWith(']]')
                ? <mark key={i} className="policy-todo">[{part.slice(2, -2)}]</mark>
                : <React.Fragment key={i}>{part}</React.Fragment>
        ));

        const PolicyBlock = ({ block }) => {
            if (block.t === 'img') {
                return (
                    <figure className="post-figure">
                        <img src={block.src} alt={block.alt} width={block.w || 800} height={block.h} loading="lazy" decoding="async" />
                        <figcaption>{block.cap}</figcaption>
                    </figure>
                );
            }
            if (block.t === 'stats') {
                return (
                    <dl className="post-stats">
                        {block.v.map((item, i) => (
                            <div key={i} className="post-stat">
                                <dt className="text-3xl font-black tracking-tight tabular-nums text-brand-dark dark:text-brand-gold">{item.k}</dt>
                                <dd className="mt-1 text-xs font-semibold leading-snug text-slate-600 dark:text-slate-400">{item.v}</dd>
                            </div>
                        ))}
                    </dl>
                );
            }
            if (block.t === 'note') {
                return <p className="post-note text-slate-700 dark:text-slate-300">{block.v}</p>;
            }
            if (block.t === 'h3') {
                return <h3 className="text-xs font-bold uppercase tracking-wider text-slate-800 dark:text-slate-100 mt-6 mb-2">{policyText(block.v)}</h3>;
            }
            if (block.t === 'ul') {
                return (
                    <ul className="policy-list space-y-2.5 mb-4 last:mb-0">
                        {block.v.map((item, i) => <li key={i}>{policyText(item)}</li>)}
                    </ul>
                );
            }
            return <p className="mb-4 last:mb-0">{policyText(block.v)}</p>;
        };

        const App = () => {
            const [lang, setLang] = useState(() => window.getOperartisLang());
            const [theme, setThemeState] = useState(() => window.getOperartisTheme());
            const [navCollapsed, setNavCollapsed] = useState(false);
            const [mobileNavOpen, setMobileNavOpen] = useState(false);
            const [authUser, setAuthUser] = useState(() => window.OperartisAuth?.getUser?.() || null);
            const [accountMenuOpen, setAccountMenuOpen] = useState(false);
            const headerNavRef = useRef(null);
            const accountMenuRef = useRef(null);
            const copy = CONTACT_COPY[lang] || CONTACT_COPY.en;
            const pageNavItems = useMemo(() => buildPageNavItems(copy, lang), [copy, lang]);
            const policy = POST_COPY[lang] || POST_COPY.en;
            const activeNavId = null;
            // Scroll spy: which section is being read, and how far through it
            const mainRef = useRef(null);
            const tocRef = useRef(null);
            const [activeSection, setActiveSection] = useState(0);

            useEffect(() => {
                const main = mainRef.current;
                const toc = tocRef.current;
                if (!main || !toc) return undefined;
                let frame = 0;
                const measure = () => {
                    frame = 0;
                    const sections = Array.from(main.querySelectorAll('.policy-section'));
                    const items = toc.querySelectorAll('li');
                    if (!sections.length) return;
                    const mainTop = main.getBoundingClientRect().top;
                    // A section counts as "being read" once its title passes 30% of the viewport
                    const probe = main.clientHeight * 0.3;
                    const tops = sections.map(el => el.getBoundingClientRect().top - mainTop);
                    let idx = 0;
                    tops.forEach((top, i) => { if (top <= probe) idx = i; });
                    const start = tops[idx];
                    const end = idx + 1 < tops.length ? tops[idx + 1] : start + sections[idx].offsetHeight;
                    const frac = Math.min(1, Math.max(0, (probe - start) / Math.max(1, end - start)));
                    const item = items[idx];
                    if (item) toc.style.setProperty('--toc-fill', `${(item.offsetTop + frac * item.offsetHeight).toFixed(1)}px`);
                    const articleEnd = tops[tops.length - 1] + sections[sections.length - 1].offsetHeight;
                    const read = Math.min(1, Math.max(0, (probe - tops[0]) / Math.max(1, articleEnd - tops[0])));
                    main.style.setProperty('--post-read', read.toFixed(4));
                    setActiveSection(prev => (prev === idx ? prev : idx));
                };
                const onScroll = () => { if (!frame) frame = requestAnimationFrame(measure); };
                measure();
                main.addEventListener('scroll', onScroll, { passive: true });
                window.addEventListener('resize', onScroll);
                return () => {
                    main.removeEventListener('scroll', onScroll);
                    window.removeEventListener('resize', onScroll);
                    if (frame) cancelAnimationFrame(frame);
                };
            }, [lang]);

            const scrollToSection = (event, id) => {
                event.preventDefault();
                const el = document.getElementById(`policy-${id}`);
                if (!el) return;
                const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
            };

            useEffect(() => {
                const onLang = (event) => setLang((event.detail && event.detail.lang) || window.getOperartisLang());
                const onTheme = (event) => setThemeState((event.detail && event.detail.theme) || window.getOperartisTheme());
                window.addEventListener('operartis:lang-change', onLang);
                window.addEventListener('operartis:theme-change', onTheme);
                return () => {
                    window.removeEventListener('operartis:lang-change', onLang);
                    window.removeEventListener('operartis:theme-change', onTheme);
                };
            }, []);

            useEffect(() => {
                document.title = `Operartis | ${policy.page_title}`;
                document.documentElement.lang = lang;
            }, [policy.page_title, lang]);

            useEffect(() => {
                if (!navCollapsed) setMobileNavOpen(false);
            }, [navCollapsed]);

            useEffect(() => {
                const handleAuthState = (event) => {
                    const user = event.detail?.user || window.OperartisAuth?.getUser?.() || null;
                    setAuthUser(user);
                    if (user) setAccountMenuOpen(false);
                };
                const handleLoggedOut = () => {
                    setAuthUser(null);
                    setAccountMenuOpen(false);
                };
                window.addEventListener('operartis:authenticated', handleAuthState);
                window.addEventListener('operartis:auth-state', handleAuthState);
                window.addEventListener('operartis:logged-out', handleLoggedOut);
                window.OperartisAuth?.refresh?.().catch(() => setAuthUser(null));
                return () => {
                    window.removeEventListener('operartis:authenticated', handleAuthState);
                    window.removeEventListener('operartis:auth-state', handleAuthState);
                    window.removeEventListener('operartis:logged-out', handleLoggedOut);
                };
            }, []);

            useEffect(() => {
                if (!accountMenuOpen) return undefined;
                const handleOutsideClick = (event) => {
                    if (!accountMenuRef.current || accountMenuRef.current.contains(event.target)) return;
                    setAccountMenuOpen(false);
                };
                const handleEscape = (event) => {
                    if (event.key === 'Escape') setAccountMenuOpen(false);
                };
                document.addEventListener('mousedown', handleOutsideClick);
                document.addEventListener('touchstart', handleOutsideClick, { passive: true });
                document.addEventListener('keydown', handleEscape);
                return () => {
                    document.removeEventListener('mousedown', handleOutsideClick);
                    document.removeEventListener('touchstart', handleOutsideClick);
                    document.removeEventListener('keydown', handleEscape);
                };
            }, [accountMenuOpen]);

            const cycleTheme = () => {
                const next = theme === 'system' ? 'light' : theme === 'light' ? 'dark' : 'system';
                window.setOperartisTheme(next);
                setThemeState(next);
            };

            const cycleLang = () => {
                // German kept in CONTACT_COPY; UI toggle is EN ↔ VI only.
                const order = ['en', 'vi'];
                const idx = order.indexOf(lang);
                const next = order[idx === -1 ? 0 : (idx + 1) % order.length];
                window.setOperartisLang(next);
                setLang(next);
            };

            const handleNavCollapse = useCallback((collapsed) => {
                setNavCollapsed(collapsed);
            }, []);

            const onNav = useCallback((id) => {
                navigateToNavId(id);
            }, []);

            const closeMobileNav = useCallback(() => setMobileNavOpen(false), []);

            const handleAuthButtonClick = useCallback(() => {
                setAccountMenuOpen((prev) => !prev);
            }, []);

            const handleDashboardOpen = useCallback(() => {
                setAccountMenuOpen(false);
                const canUseAdminDashboard = authUser?.role === 'owner' || authUser?.role === 'admin';
                window.location.href = canUseAdminDashboard ? './dashboard.html#admin-overview' : './dashboard.html';
            }, [authUser]);

            const handleLoginOpen = useCallback(() => {
                setAccountMenuOpen(false);
                window.OperartisAuth?.showLogin?.();
            }, []);

            const handleLogout = useCallback(async () => {
                setAccountMenuOpen(false);
                await window.OperartisAuth?.logout?.();
                setAuthUser(null);
            }, []);

            const trustItems = [copy.trust_4, copy.trust_5, copy.trust_6, copy.trust_3];
            const assuranceItems = [copy.assurance_1, copy.assurance_2, copy.assurance_3];

            return (
                <div className="contact-shell h-full bg-white dark:bg-[#020617] transition-colors duration-500">
                    <ContactCanvas theme={theme} />

                    <nav className="header-bar relative z-30 shrink-0 overflow-visible border-b border-slate-200/50 dark:border-slate-800/50">
                        <div className="max-w-7xl mx-auto w-full h-16 px-3 sm:px-6 md:px-10 flex items-center gap-2 md:gap-4 overflow-visible">
                            <div className="header-glass-pill header-glass-pill--wide header-glass-pill--brand">
                                <a href="./" className="header-brand inline-flex items-center gap-2 sm:gap-3">
                                    <OperartisLogoMark className="h-8 w-8 md:h-10 md:w-10" />
                                    <span className="font-bold text-sm sm:text-base md:text-lg tracking-tight text-slate-900 dark:text-white leading-none">OPERARTIS</span>
                                </a>
                            </div>

                            <HeaderNav
                                navRef={headerNavRef}
                                items={pageNavItems}
                                activeId={activeNavId}
                                onNav={onNav}
                                onCollapseChange={handleNavCollapse}
                            />

                            {navCollapsed && (
                                <div className="ml-auto shrink-0 header-glass-pill">
                                    <button
                                        type="button"
                                        onClick={() => setMobileNavOpen(true)}
                                        aria-expanded={mobileNavOpen}
                                        aria-label="Open navigation"
                                        className="header-util-btn h-8 w-8 p-0"
                                    >
                                        <span className="header-util-icon" aria-hidden="true"><MenuIcon /></span>
                                    </button>
                                </div>
                            )}

                            <div className="flex items-center gap-1.5 md:gap-6 shrink-0">
                                <div className="hidden md:flex header-glass-pill header-glass-pill--wide items-center">
                                    <button
                                        type="button"
                                        onClick={cycleTheme}
                                        className="header-util-btn"
                                        title={theme === 'light' ? 'Light mode — click for dark' : theme === 'dark' ? 'Dark mode — click for system' : 'System theme — follows OS — click for light'}
                                    >
                                        <span className="header-util-icon" aria-hidden="true">
                                            {theme === 'light' ? <SunIcon /> : theme === 'dark' ? <MoonIcon /> : <SystemIcon />}
                                        </span>
                                    </button>
                                    <span className="w-px h-4 shrink-0 self-center bg-slate-200 dark:bg-slate-700/50" aria-hidden="true" />
                                    <button type="button" onClick={cycleLang} className="header-util-btn gap-1 font-mono text-xs font-bold px-2">
                                        <span className="header-util-icon" aria-hidden="true"><GlobeIcon /></span>
                                        <span>{lang.toUpperCase()}</span>
                                    </button>
                                </div>

                                <div className="flex md:hidden items-center gap-1.5">
                                    <div className="header-glass-pill max-[359px]:hidden">
                                        <button
                                            type="button"
                                            onClick={cycleTheme}
                                            className="header-util-btn h-8 w-8 p-0"
                                            title={theme === 'light' ? 'Light mode — click for dark' : theme === 'dark' ? 'Dark mode — click for system' : 'System theme — follows OS — click for light'}
                                        >
                                            <span className="header-util-icon" aria-hidden="true">
                                                {theme === 'light' ? <SunIcon /> : theme === 'dark' ? <MoonIcon /> : <SystemIcon />}
                                            </span>
                                        </button>
                                    </div>
                                    <div className="header-glass-pill">
                                        <button type="button" onClick={cycleLang} className="header-util-btn h-8 w-8 p-0" aria-label={`Language: ${lang.toUpperCase()}`}>
                                            <span className="header-util-icon" aria-hidden="true"><GlobeIcon /></span>
                                        </button>
                                    </div>
                                </div>

                                <div ref={accountMenuRef} className="relative shrink-0">
                                    <button
                                        type="button"
                                        onClick={handleAuthButtonClick}
                                        aria-expanded={accountMenuOpen}
                                        aria-haspopup="menu"
                                        aria-label={authUser ? `Account: ${accountDisplayName(authUser)}` : copy.nav_login}
                                        title={authUser ? accountDisplayName(authUser) : copy.nav_login}
                                        className="relative header-auth-btn header-auth-btn--gold h-9 w-9 rounded-full bg-gradient-to-tr from-brand-gold to-brand-dark flex items-center justify-center text-white shrink-0"
                                    >
                                        <AccountAvatar user={authUser} />
                                        <span className={`absolute -right-0.5 -top-0.5 h-3 w-3 rounded-full border-2 border-[#020617] ${authUser ? 'bg-emerald-400 shadow-[0_0_0_2px_rgba(52,211,153,0.28),0_0_12px_rgba(52,211,153,0.9)]' : 'bg-white shadow-[0_0_0_1px_rgba(255,255,255,0.45)]'}`} aria-hidden="true" />
                                    </button>

                                    {accountMenuOpen && (
                                        <div role="menu" aria-label="Account menu" className="index-account-menu">
                                            {authUser && (
                                                <div className="index-account-menu-head">
                                                    <p className="index-account-menu-email">{accountDisplayName(authUser)}</p>
                                                    <p className="index-account-menu-role">{authUser.role}</p>
                                                </div>
                                            )}
                                            <div className="index-account-menu-body">
                                                <button type="button" role="menuitem" onClick={handleDashboardOpen} className="index-account-menu-item">
                                                    <span className="index-account-menu-item-icon" aria-hidden="true"><AccountDashboardIcon /></span>
                                                    <span>{copy.nav_dashboard}</span>
                                                </button>
                                                <div className="index-account-menu-divider" role="separator" aria-hidden="true" />
                                                {authUser ? (
                                                    <button type="button" role="menuitem" onClick={handleLogout} className="index-account-menu-item index-account-menu-item--danger">
                                                        <span className="index-account-menu-item-icon" aria-hidden="true"><AccountLogoutIcon /></span>
                                                        <span>{copy.nav_logout}</span>
                                                    </button>
                                                ) : (
                                                    <button type="button" role="menuitem" onClick={handleLoginOpen} className="index-account-menu-item">
                                                        <span className="index-account-menu-item-icon" aria-hidden="true"><AccountLoginIcon /></span>
                                                        <span>{copy.nav_login}</span>
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </nav>

                    <MobileNavDrawer
                        items={pageNavItems}
                        activeId={activeNavId}
                        onNav={onNav}
                        open={mobileNavOpen}
                        onClose={closeMobileNav}
                    />

                    <main ref={mainRef} className="relative z-10 flex-1 overflow-y-auto min-h-0">
                        <div className="post-read-bar" aria-hidden="true"><span></span></div>
                        <div className="max-w-6xl mx-auto px-4 sm:px-6 md:px-8 py-8 md:py-12 pb-16">
                            <section className="contact-hero contact-hero--photo rounded-3xl border border-amber-700/40 dark:border-white/[0.06] ring-0 dark:ring-1 dark:ring-white/[0.04] px-6 py-12 md:px-12 md:py-16 lg:py-20 mb-10 md:mb-12">
                                <div className="relative z-10 max-w-3xl">
                                    <p className="text-[10px] font-bold uppercase contact-eyebrow text-brand-gold mb-3">{policy.eyebrow}</p>
                                    <h1 className="text-2xl sm:text-3xl md:text-[2.5rem] font-black tracking-tight text-white leading-[1.12] mb-4">
                                        {policy.headline}
                                    </h1>
                                    <p className="font-mono text-xs text-slate-300 mb-4">{policyText(policy.updated)}</p>
                                    <p className="text-base md:text-lg leading-relaxed text-slate-200">{policy.lead}</p>
                                </div>
                            </section>

                            <div className="grid lg:grid-cols-12 gap-6 md:gap-8 items-start">
                                <Reveal className="lg:col-span-4 policy-toc-sticky" delay={40}>
                                    <nav aria-label={policy.toc} className="contact-panel border dark:border-white/[0.06] ring-0 dark:ring-1 dark:ring-white/[0.04] p-6 md:p-8">
                                        <h2 className="text-xs font-bold uppercase contact-eyebrow text-brand-gold mb-4">{policy.toc}</h2>
                                        <div ref={tocRef} className="post-toc">
                                            <span className="post-toc-fill" aria-hidden="true"></span>
                                            <ol className="space-y-1">
                                                {policy.sections.map((section, i) => {
                                                    const isActive = i === activeSection;
                                                    const isRead = i < activeSection;
                                                    return (
                                                        <li key={section.id}>
                                                            <a
                                                                href={`#policy-${section.id}`}
                                                                onClick={(event) => scrollToSection(event, section.id)}
                                                                aria-current={isActive ? 'location' : undefined}
                                                                className={`group flex gap-3 py-1.5 text-sm leading-snug transition-colors duration-300 hover:text-brand-gold dark:hover:text-brand-gold ${isActive ? 'font-semibold text-slate-900 dark:text-white' : isRead ? 'text-slate-500 dark:text-slate-400' : 'text-slate-600 dark:text-slate-400'}`}
                                                            >
                                                                <span className={`font-mono text-[11px] font-bold tabular-nums pt-px transition-colors duration-300 ${isActive || isRead ? 'text-brand-gold' : 'text-slate-400 dark:text-slate-500'}`}>{String(i + 1).padStart(2, '0')}</span>
                                                                <span>{section.title}</span>
                                                            </a>
                                                        </li>
                                                    );
                                                })}
                                            </ol>
                                        </div>
                                    </nav>
                                </Reveal>

                                {/* Not wrapped in Reveal: the article is far taller than the viewport, so a 16% intersection threshold would never fire */}
                                <div className="lg:col-span-8">
                                    <article className="contact-panel border dark:border-white/[0.06] ring-0 dark:ring-1 dark:ring-white/[0.04] p-6 md:p-10 text-[15px] md:text-base leading-relaxed text-slate-600 dark:text-slate-300">
                                        {policy.sections.map((section, i) => (
                                            <section key={section.id} id={`policy-${section.id}`} className="policy-section">
                                                <h2 className="flex items-baseline gap-3 text-xl md:text-2xl font-bold tracking-tight text-slate-900 dark:text-white mb-4">
                                                    <span className={`shrink-0 -ml-1.5 rounded-md px-1.5 py-0.5 font-mono text-xs font-bold tabular-nums transition-colors duration-300 ${i === activeSection ? 'bg-brand-gold text-white' : 'text-brand-gold'}`}>{String(i + 1).padStart(2, '0')}</span>
                                                    <span>{section.title}</span>
                                                </h2>
                                                {section.blocks.map((block, j) => <PolicyBlock key={j} block={block} />)}
                                            </section>
                                        ))}
                                    </article>

                                    <section className="contact-hero contact-hero--photo rounded-3xl border border-amber-700/40 dark:border-white/[0.06] px-6 py-10 md:px-10 md:py-12 mt-6 md:mt-8">
                                        <div className="relative z-10 max-w-2xl">
                                            <h2 className="text-2xl md:text-3xl font-black tracking-tight text-white leading-tight mb-3">{policy.cta_title}</h2>
                                            <p className="text-sm md:text-base leading-relaxed text-slate-200 mb-6">{policy.cta_text}</p>
                                            <div className="flex flex-wrap gap-3">
                                                <a href="./contact" className="inline-flex items-center px-6 py-3 rounded-xl bg-brand-gold text-white text-sm font-bold shadow-lg shadow-brand-gold/20 hover:bg-amber-600 transition-colors">{policy.cta_primary}</a>
                                                <a href="./#platform" className="inline-flex items-center px-6 py-3 rounded-xl border border-white/25 text-white text-sm font-bold hover:bg-white/10 transition-colors">{policy.cta_secondary}</a>
                                            </div>
                                        </div>
                                    </section>
                                </div>
                            </div>
                        </div>

                        <SiteFooter ui={copy} />
                    </main>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>

</html>
