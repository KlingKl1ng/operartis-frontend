    <script>
        // Sections that moved to their own pages: keep old in-page links (/#about, /#analytics, /#horizon-tactical ...) working.
        // This file also serves why-aps.html and platform.html (see build-landing-pages.mjs), hence the data-page check.
        (function () {
            var page = document.documentElement.getAttribute('data-page') || 'home';
            var pages = { home: './', 'why-aps': './why-aps', platform: './platform' };
            function targetFor(hash) {
                var id = String(hash || '').replace(/^#/, '');
                if (id === 'about') return './about';
                if (id === 'about-why') return './about#about-why';
                var dest = null;
                if (id === 'proof-foundation' || id === 'industry-40' || id === 'analytics') dest = 'why-aps';
                else if (id === 'platform' || id === 'matrix-fit' || id.indexOf('horizon-') === 0) dest = 'platform';
                else if (id === 'supply-chain' || id === 'or-process' || id === 'platform-overview') dest = 'home';
                if (!dest || dest === page) return null;
                return pages[dest] + '#' + id;
            }
            function redirectMovedHash() {
                var target = targetFor(window.location.hash);
                if (target) window.location.replace(target);
            }
            redirectMovedHash();
            window.addEventListener('hashchange', redirectMovedHash);
        })();
    </script>

        /* Theme tokens for pack animations — keep animation-name stable across light/dark
           so toggling theme does not restart running sequences. */
        :root {

            --proof-chip-heartbeat-0:

            --proof-chip-heartbeat-50:

            --proof-chip-icon-color-from: #64748b;
            --proof-chip-icon-color-to: #d97706;
            --proof-chip-icon-bg-from: rgba(100, 116, 139, 0.14);
            --proof-chip-icon-bg-to: rgba(245, 158, 11, 0.15);
            --proof-chip-icon-border-from: rgba(148, 163, 184, 0.28);
            --proof-chip-icon-border-to: rgba(245, 158, 11, 0.28);
            --proof-chip-tag-from: #64748b;
            --proof-chip-tag-to: #d97706;

        .dark {

            --proof-formula-glow-mid:

            --proof-formula-glow-end:
                0 0 0 1px rgba(245, 158, 11, 0.1),

            --proof-chip-border-from: rgba(100, 116, 139, 0.45);

            --proof-chip-shadow-to:
                0 0 0 1px rgba(245, 158, 11, 0.18),

                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 0 0 0 rgba(245, 158, 11, 0.28);
            --proof-chip-heartbeat-0:
                0 0 0 1px rgba(245, 158, 11, 0.18),
                0 8px 22px rgba(245, 158, 11, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 0 0 0 rgba(245, 158, 11, 0.28);
            --proof-chip-heartbeat-50:
                0 0 0 1px rgba(245, 158, 11, 0.22),
                0 10px 28px rgba(245, 158, 11, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 0 0 12px rgba(245, 158, 11, 0);

            --proof-chip-icon-color-from: #94a3b8;
            --proof-chip-icon-color-to: #fbbf24;
            --proof-chip-icon-bg-from: rgba(71, 85, 105, 0.35);
            --proof-chip-icon-bg-to: rgba(245, 158, 11, 0.18);
            --proof-chip-icon-border-from: rgba(100, 116, 139, 0.4);
            --proof-chip-icon-border-to: rgba(245, 158, 11, 0.35);
            --proof-chip-tag-from: #94a3b8;
            --proof-chip-tag-to: #fbbf24;
            --proof-chip-title-from: #cbd5e1;
            --proof-chip-title-to: #f8fafc;

        @keyframes proof-pack-formula-glow {
            0% {
                border-color: var(--proof-formula-border-0);
                box-shadow: 0 0 0 0 transparent;
            }
            28%, 72% {
                border-color: var(--proof-formula-border-mid);
                box-shadow: var(--proof-formula-glow-mid);
            }
            100% {
                border-color: var(--proof-formula-border-end);
                box-shadow: var(--proof-formula-glow-end);
            }
        }

        .proof-pack-scan {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(
                105deg,
                transparent 0%,
                rgba(245, 158, 11, 0.04) 38%,
                rgba(245, 158, 11, 0.18) 50%,
                rgba(245, 158, 11, 0.04) 62%,
                transparent 100%
            );
            transform: translateX(-130%);
            opacity: 0;
        }

        /* Scan + line light keep looping through merge end (~3.65s) */
        .proof-pack-formula.is-running .proof-pack-scan {
            /* 3 passes ≈ through merge end (2.2s + 1.45s) */
            animation: proof-pack-scan 1.15s cubic-bezier(0.4, 0, 0.2, 1) 0.1s 3 both;
        }

        @keyframes proof-pack-scan {
            0% { transform: translateX(-130%); opacity: 0; }
            18% { opacity: 0.95; }
            82% { opacity: 0.55; }
            100% { transform: translateX(130%); opacity: 0; }
        }

        .proof-pack-formula.is-running.is-merging {
            /* Larger at source; merge lands on the same sink scale as before */
            transform: scale(1.14) translateY(0);
            animation:
                proof-pack-formula-glow 3.65s cubic-bezier(0.45, 0.05, 0.25, 1) 0.05s both,
                proof-pack-merge 1.45s cubic-bezier(0.33, 1, 0.68, 1) 2.2s forwards;
        }

        @keyframes proof-pack-merge {
            0% {
                opacity: 1;
                filter: blur(0);
                transform: scale(1.14) translateY(0);
            }
            100% {
                opacity: 0.72;
                filter: blur(0.2px);
                transform: scale(0.84) translateY(0.15rem);
            }
        }

        /* Mobile: formula is already near full panel width — scale(1.14) overflows the outer block */
        @media (max-width: 639px) {
            .proof-pack-formula {
                max-width: 100%;
            }

            .proof-pack-formula.is-running.is-merging {
                transform: scale(1) translateY(0);
                animation:
                    proof-pack-formula-glow 3.65s cubic-bezier(0.45, 0.05, 0.25, 1) 0.05s both,
                    proof-pack-merge-mobile 1.45s cubic-bezier(0.33, 1, 0.68, 1) 2.2s forwards;
            }
        }

        @keyframes proof-pack-merge-mobile {
            0% {
                opacity: 1;
                filter: blur(0);
                transform: scale(1) translateY(0);
            }
            100% {
                opacity: 0.72;
                filter: blur(0.2px);
                transform: scale(0.88) translateY(0.15rem);
            }
        }

        .proof-pack-formula .proof-formula-line {
            opacity: 1;
            transform: none;
        }

        /* Top→bottom text light: repeats through merge shrink */
        .proof-pack-formula.is-running .proof-formula-line {
            animation: proof-pack-line-pulse 1.2s cubic-bezier(0.45, 0, 0.55, 1) 3 both;
        }

        .proof-pack-formula.is-running .proof-formula-line:nth-child(1) { animation-delay: 0.06s; }
        .proof-pack-formula.is-running .proof-formula-line:nth-child(2) { animation-delay: 0.16s; }
        .proof-pack-formula.is-running .proof-formula-line:nth-child(3) { animation-delay: 0.26s; }
        .proof-pack-formula.is-running .proof-formula-line:nth-child(4) { animation-delay: 0.36s; }
        .proof-pack-formula.is-running .proof-formula-line:nth-child(5) { animation-delay: 0.46s; }
        .proof-pack-formula.is-running .proof-formula-line:nth-child(6) { animation-delay: 0.56s; }
        .proof-pack-formula.is-running .proof-formula-line:nth-child(7) { animation-delay: 0.66s; }

        @keyframes proof-pack-line-pulse {
            0%, 100% {
                opacity: 0.5;
                filter: brightness(0.92);
            }
            32% {
                opacity: 1;
                filter: brightness(1.28);
            }
            55% {
                opacity: 0.88;
                filter: brightness(1.06);
            }
        }

        .proof-pack-funnel {
            height: 2.75rem;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
        }

        .proof-pack-funnel.is-active {
            animation: proof-pack-funnel-in 0.55s cubic-bezier(0.33, 1, 0.68, 1) 2.05s forwards;
        }

        .proof-pack-funnel-line {
            width: 2px;
            height: 100%;
            border-radius: 9999px;
            background: linear-gradient(180deg, rgba(245, 158, 11, 0.08), rgba(245, 158, 11, 0.85) 70%, rgba(245, 158, 11, 0.35));
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.25);
            transform: scaleY(0);
            transform-origin: top center;
            will-change: transform;
        }

        .proof-pack-funnel.is-active .proof-pack-funnel-line {

        }

        @keyframes proof-pack-funnel-in {

        @keyframes proof-pack-funnel-draw {

        /* Pack module chip: monotone → stage-tab active fill + gold border */
        .proof-pack-chip {
            position: relative;
            isolation: isolate;
            transform: scale(0.72) translateY(14px);
            opacity: 0.65;
            border: 1px solid rgba(148, 163, 184, 0.38);
            background: rgba(255, 255, 255, 0.35);
            box-shadow:
                0 4px 14px rgba(15, 23, 42, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.35);
            filter: grayscale(1);
            will-change: transform, opacity, filter, border-color, box-shadow;
            transform-origin: 50% 0%;
        }

        .proof-pack-chip::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            /* Match .proof-build-stage-btn.is-active fill */
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(180, 83, 9, 0.04));
            opacity: 0;
            z-index: 0;
            pointer-events: none;

        .dark .proof-pack-chip {
            border-color: rgba(100, 116, 139, 0.45);

                0 4px 14px rgba(0, 0, 0, 0.28),

        .proof-pack-chip-icon {

        @keyframes proof-pack-chip-in {
            0% {
                transform: scale(0.72) translateY(14px);
                opacity: 0.65;
                filter: grayscale(1);
                border-color: var(--proof-chip-border-from);
                box-shadow: var(--proof-chip-shadow-from);
            }
            100% {
                transform: scale(1.05) translateY(0);

            from { opacity: 0; }

        .proof-pack-chip.is-assembling {
            animation:
                proof-pack-chip-in 1.35s cubic-bezier(0.33, 1, 0.68, 1) 2.85s forwards,
                proof-pack-chip-heartbeat 3s cubic-bezier(0.45, 0, 0.55, 1) 4.35s infinite;
        }

        @keyframes proof-pack-chip-heartbeat {

        .proof-pack-chip.is-assembling .proof-pack-chip-icon {
            animation: proof-pack-chip-icon-in 1.2s cubic-bezier(0.33, 1, 0.68, 1) 3.05s forwards;

        .proof-pack-chip.is-assembling .proof-pack-chip-tag {
            animation: proof-pack-chip-tag-in 1.15s cubic-bezier(0.33, 1, 0.68, 1) 3.15s forwards;
        }

        .proof-pack-chip.is-assembling .proof-pack-chip-title {
            animation: proof-pack-chip-title-in 1.15s cubic-bezier(0.33, 1, 0.68, 1) 3.22s forwards;
        }

        @keyframes proof-pack-chip-icon-in {
            from {
                color: var(--proof-chip-icon-color-from);
                background: var(--proof-chip-icon-bg-from);
                border-color: var(--proof-chip-icon-border-from);
                transform: scale(1);
            }
            to {
                color: var(--proof-chip-icon-color-to);

        @keyframes proof-pack-chip-tag-in {
            from { color: var(--proof-chip-tag-from); letter-spacing: 0.06em; }

        .proof-pack-chip-pulse {
            position: absolute;
            inset: -3px;
            border-radius: inherit;
            border: 1px solid transparent;
            opacity: 0;
            pointer-events: none;
            z-index: 0;
        }

        .proof-pack-chip.is-assembling .proof-pack-chip-pulse {
            border-color: rgba(245, 158, 11, 0.32);
            background: radial-gradient(ellipse at center, rgba(245, 158, 11, 0.14), transparent 72%);
            animation:
                proof-pack-chip-pulse-in 1.15s cubic-bezier(0.33, 1, 0.68, 1) 3.35s 2 forwards,
                proof-pack-chip-pulse-loop 3s cubic-bezier(0.45, 0, 0.55, 1) 4.35s infinite;

            0% { transform: scale(1); opacity: 0.35; }
            100% { transform: scale(1.1); opacity: 0; }

        }

        @keyframes proof-pack-desc-in {

                opacity: 1;
                transform: translateY(0);

        }

        @media (prefers-reduced-motion: reduce) {
            .proof-pack-formula.is-running,
            .proof-pack-formula.is-merging,
            .proof-pack-formula.is-running .proof-pack-scan,
            .proof-pack-formula.is-running .proof-formula-line,
            .proof-pack-funnel.is-active,
            .proof-pack-funnel.is-active .proof-pack-funnel-line,
            .proof-pack-chip.is-assembling,
            .proof-pack-chip.is-assembling::before,
            .proof-pack-chip.is-assembling .proof-pack-chip-pulse,
            .proof-pack-chip.is-assembling .proof-pack-chip-icon,
            .proof-pack-chip.is-assembling .proof-pack-chip-tag,
            .proof-pack-chip.is-assembling .proof-pack-chip-title,
            .proof-pack-desc.is-ready,
            .proof-pack-matrix-col {
                animation: none !important;
            }

            .proof-pack-formula.is-merging {
                opacity: 0.72;
                transform: scale(0.84);
                border-color: rgba(245, 158, 11, 0.28);

            .proof-pack-chip.is-assembling {
                opacity: 1;

        .opus-metrics-glass {
            position: relative;

            border: 1px solid rgba(100, 116, 139, 0.38);
            backdrop-filter: blur(16px) saturate(1.06);
            -webkit-backdrop-filter: blur(16px) saturate(1.06);
            box-shadow:
                0 0 0 1px rgba(148, 163, 184, 0.22),
                0 14px 34px rgba(15, 23, 42, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.45),
                inset 0 -1px 0 rgba(255, 255, 255, 0.07);
        }

        .opus-metrics-glass::before {
            content: '';
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            background:
                radial-gradient(ellipse 72% 55% at 50% 0%, rgba(255, 255, 255, 0.16), transparent 62%),
                linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02) 54%, rgba(245, 158, 11, 0.02));
            pointer-events: none;
        }

        .opus-metrics-glass::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.58), rgba(245, 158, 11, 0.24) 42%, rgba(148, 163, 184, 0.16) 100%);
            -webkit-mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Safari: mask-composite exclude is unreliable in light mode */
        @supports (-webkit-touch-callout: none) {
            html:not(.dark) .opus-metrics-glass {
                border-color: rgba(100, 116, 139, 0.45);
                box-shadow:
                    0 0 0 1px rgba(148, 163, 184, 0.3),
                    0 14px 34px rgba(15, 23, 42, 0.06),
                    inset 0 1px 0 rgba(255, 255, 255, 0.45),
                    inset 0 -1px 0 rgba(255, 255, 255, 0.07);
            }

            html:not(.dark) .opus-metrics-glass::after {
                padding: 0;
                background: transparent;
                -webkit-mask: none;
                mask: none;
                box-shadow: inset 0 0 0 1px rgba(100, 116, 139, 0.4);
            }
        }

        .dark .opus-metrics-glass {
            background: transparent;
            border-color: rgba(245, 158, 11, 0.2);

        /* Phones and touch screens: the stage icons sit over the animated network canvas, inside a
           panel that is already blurred. A second blur on every icon has to be redrawn each frame,
           and the scale-up on the active icon makes the 20px strokes re-rasterise, which shows as
           shimmering, wobbling icons on iPhones. Use solid glass and keep the icons still there. */
        @media (max-width: 767px), (hover: none) and (pointer: coarse) {
            .sc-node-glass {

        /* ERP · APS · MES integration loop */
        @keyframes i4l-gap-pulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 1; }
        }

        @keyframes i4l-aps-enter {
            0% { opacity: 0; transform: scale(0.82); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes i4l-loop-glow {
            0%, 100% { opacity: 0.55; }
            50% { opacity: 1; }
        }

        @keyframes i4l-flow-dash {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: -10; }
        }

        @keyframes i4l-orbit {
            0% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: -48; }
        }

        .i4l-gap-line {
            stroke-dasharray: 10 7;
            animation: i4l-gap-pulse 1.6s ease-in-out infinite;
        }

        .i4l-flow-arrow {
            stroke-dasharray: 6 4;
            animation: i4l-flow-dash 0.95s linear infinite;
        }

        .i4l-flow-arrow-2 { animation-delay: 0.32s; }
        .i4l-flow-arrow-3 { animation-delay: 0.64s; }

        .i4l-loop-bracket {
            stroke-dasharray: 6 4;
            animation: i4l-orbit 2.4s linear infinite;
        }

        @keyframes i4l-node-pop {
            0% { opacity: 0; transform: scale(0.88); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes i4l-tag-rise {
            0% { opacity: 0; transform: translate(-50%, calc(-50% + 6px)); }
            100% { opacity: 1; transform: translate(-50%, -50%); }
        }

        @keyframes i4l-break-blink {
            0%, 100% { opacity: 0.85; }
            50% { opacity: 0.35; }
        }

            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .i4l-phase-fade {
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .i4l-phase-hidden {
            opacity: 0;
            pointer-events: none;

            animation-play-state: paused;

                background: #0b1224;
                color: #94a3b8;
            }

            .lp3-rail-node.is-lit,
            .dark .lp3-rail-node.is-lit {
                border-color: #f59e0b;
                background: #f59e0b;
                color: #ffffff;
                box-shadow: 0 0 0 6px rgba(245, 158, 11, 0.16), 0 0 24px rgba(245, 158, 11, 0.5);
            }
        }

        /* Module chips, live and roadmap badges */
        .lp3-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.2rem 0.55rem;
            border-radius: 9999px;
            border: 1px solid rgba(148, 163, 184, 0.45);
            background: rgba(255, 255, 255, 0.65);
            color: #475569;
            font-size: 11px;
            font-weight: 600;
            line-height: 1.35;
        }

        .dark .lp3-chip {
            border-color: rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.55);
            color: #94a3b8;
        }

        .lp3-chip--live {
            border-color: rgba(217, 119, 6, 0.55);
            background: rgba(245, 158, 11, 0.16);
            color: #92400e;
        }

        .dark .lp3-chip--live {
            border-color: rgba(245, 158, 11, 0.5);
            background: rgba(245, 158, 11, 0.14);
            color: #fcd34d;
        }

        .lp3-live-badge,
        .lp3-roadmap-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .lp3-live-badge {
            background: #059669;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.35);
        }

        .lp3-roadmap-badge {
            border: 1px dashed rgba(100, 116, 139, 0.6);
            color: #64748b;
        }

        .dark .lp3-roadmap-badge {
            border-color: rgba(148, 163, 184, 0.4);
            color: #94a3b8;
        }

        @keyframes lp3-live-pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            70%, 100% { box-shadow: 0 0 0 6px rgba(255, 255, 255, 0); }
        }

        .lp3-live-badge i,
        .lp3-chip--live i {
            width: 6px;
            height: 6px;
            flex: none;
            border-radius: 9999px;
        }

        .lp3-live-badge i {
            background: #ffffff;
            animation: lp3-live-pulse 1.8s ease-out infinite;
        }

        .lp3-chip--live i { background: #10b981; }

        /* Product screenshot inside a live block */
        .lp3-block-shot {
            position: relative;
            min-height: 9.5rem;
            overflow: hidden;
            border-radius: 0.875rem;
            border: 1px solid rgba(217, 119, 6, 0.4);
            background: #f8fafc;
            box-shadow: 0 14px 34px rgba(15, 23, 42, 0.18);
        }

        .dark .lp3-block-shot {
            border-color: rgba(245, 158, 11, 0.35);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        }

        .lp3-block-shot > span {
            position: absolute;
            inset: 0;
            background-repeat: no-repeat;
            background-size: 185%;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .group:hover .lp3-block-shot > span { transform: scale(1.05); }

        @media (min-width: 640px) {
            .lp3-block-shot { min-height: 11.5rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            .lp3-live-badge i { animation: none; }
            .lp3-block-shot > span,
            .lp3-matrix-rail::after { transition: none; }
            .group:hover .lp3-block-shot > span { transform: none; }
        }

        /* Animated forecasting preview inside the demand block: history -> model -> forecast */
        .lp3-block-shot--anim {
            background: #ffffff;
        }

        .dark .lp3-block-shot--anim {
            background: #0b1222;
        }

        .fcp {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(ellipse 80% 60% at 85% 100%, rgba(245, 158, 11, 0.1), transparent 70%),
                linear-gradient(180deg, #ffffff, #f8fafc);
        }

        .dark .fcp {
            background:
                radial-gradient(ellipse 80% 60% at 85% 100%, rgba(245, 158, 11, 0.12), transparent 70%),
                linear-gradient(180deg, #0f172a, #0b1222);
        }

        .fcp-steps {
            display: flex;
            gap: 6px;
            padding: 11px 12px 0;
        }

        .fcp-step {
            position: relative;
            display: flex;
            flex: 1 1 auto;
            min-width: 0;
            align-items: baseline;
            gap: 4px;
            padding-bottom: 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            white-space: nowrap;
            color: #94a3b8;
            transition: color 0.3s ease;
        }

        .dark .fcp-step { color: #64748b; }

        .fcp-step span {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fcp-step::after,
        .fcp-step::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 2px;
            border-radius: 2px;
        }

        .fcp-step::after { background: rgba(148, 163, 184, 0.28); }
        .dark .fcp-step::after { background: rgba(148, 163, 184, 0.16); }

        .fcp-step::before {
            z-index: 1;
            background: linear-gradient(90deg, #b45309, #f59e0b);
            transform: scaleX(0);
            transform-origin: left center;
        }

        .fcp-step.is-done::before { transform: scaleX(1); }

        .fcp-step.is-active::before {
            transform: scaleX(1);
            transition: transform var(--fcp-dur, 2s) linear;
        }

        .fcp-step.is-active,
        .fcp-step.is-done { color: #b45309; }

        .dark .fcp-step.is-active,
        .dark .fcp-step.is-done { color: #fbbf24; }

        .fcp-chart {
            position: relative;
            flex: 1;
            min-height: 0;
        }

        .fcp-chart svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .fcp-scene { transition: opacity 0.4s ease; }

        .fcp[data-phase="out"] .fcp-scene,
        .fcp[data-phase="reset"] .fcp-scene { opacity: 0; }

        .fcp[data-phase="reset"] *,
        .fcp[data-phase="reset"] *::before,
        .fcp[data-phase="reset"] *::after { transition: none !important; }

        .fcp-axis { stroke: rgba(148, 163, 184, 0.45); stroke-width: 1; }
        .dark .fcp-axis { stroke: rgba(148, 163, 184, 0.22); }

        .fcp-bar {
            fill: #94a3b8;
            transform-box: fill-box;
            transform-origin: 50% 100%;
            transform: scaleY(0);
            transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1), fill 0.6s ease;
        }

        .dark .fcp-bar { fill: #64748b; }

        .fcp:not([data-phase="reset"]) .fcp-bar { transform: scaleY(1); }

        .fcp[data-phase="model"] .fcp-bar,
        .fcp[data-phase="forecast"] .fcp-bar,
        .fcp[data-phase="out"] .fcp-bar { fill: #cbd5e1; }

        .dark .fcp[data-phase="model"] .fcp-bar,
        .dark .fcp[data-phase="forecast"] .fcp-bar,
        .dark .fcp[data-phase="out"] .fcp-bar { fill: #334155; }

        .fcp-fit,
        .fcp-line {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 1 1;
            stroke-dashoffset: 1;
            /* hidden until drawn: an undrawn round-capped dash still paints a dot at the path's end */
            opacity: 0;
        }

        .fcp-fit {
            stroke: #334155;
            stroke-width: 2;
            transition: stroke-dashoffset 1.6s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.15s linear;
        }

        .dark .fcp-fit { stroke: #e2e8f0; }

        .fcp-line {
            stroke: #d97706;
            stroke-width: 2.4;
            transition: stroke-dashoffset 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.35s, opacity 0.15s linear 0.35s;
        }

        .dark .fcp-line { stroke: #f59e0b; }

        .fcp[data-phase="model"] .fcp-fit,
        .fcp[data-phase="forecast"] .fcp-fit,
        .fcp[data-phase="out"] .fcp-fit,
        .fcp[data-phase="forecast"] .fcp-line,
        .fcp[data-phase="out"] .fcp-line { stroke-dashoffset: 0; opacity: 1; }

        .fcp-band {
            fill: rgba(245, 158, 11, 0.2);
            transform-box: fill-box;
            transform-origin: 0% 50%;
            transform: scaleX(0);
            transition: transform 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.35s;
        }

        .dark .fcp-band { fill: rgba(245, 158, 11, 0.18); }

        .fcp-future,
        .fcp-today,
        .fcp-tip {
            opacity: 0;
            transition: opacity 0.45s ease;
        }

        .fcp-future { fill: rgba(245, 158, 11, 0.07); }
        .fcp-today line { stroke: #d97706; stroke-width: 1; stroke-dasharray: 3 3; }
        .dark .fcp-today line { stroke: #f59e0b; }

        .fcp-today text {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            fill: #b45309;
        }

        .dark .fcp-today text { fill: #fbbf24; }

        .fcp-tip circle { fill: #d97706; }
        .dark .fcp-tip circle { fill: #f59e0b; }
        .fcp-tip .fcp-ring { fill: none; stroke: #f59e0b; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; }

        .fcp[data-phase="forecast"] .fcp-band,
        .fcp[data-phase="out"] .fcp-band { transform: scaleX(1); }

        .fcp[data-phase="forecast"] .fcp-future,
        .fcp[data-phase="forecast"] .fcp-today,
        .fcp[data-phase="out"] .fcp-future,
        .fcp[data-phase="out"] .fcp-today { opacity: 1; }

        .fcp[data-phase="forecast"] .fcp-tip,
        .fcp[data-phase="out"] .fcp-tip {
            opacity: 1;
            transition-delay: 1.5s;
        }

        /* Inventory preview: demand, then the (s, S) policy, then the simulated stock level */
        .ivp-dbar {
            fill: #94a3b8;
            transform-box: fill-box;
            transform-origin: 50% 100%;
            transform: scaleY(0);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dark .ivp-dbar { fill: #64748b; }
        .fcp:not([data-phase="reset"]) .ivp-dbar { transform: scaleY(1); }

        .ivp-rule {
            transform-box: fill-box;
            transform-origin: 0% 50%;
            transform: scaleX(0);
            transition: transform 0.9s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .ivp-rule line { stroke-width: 1.4; stroke-dasharray: 4 3; }
        .ivp-rule--s line { stroke: #d97706; }
        .ivp-rule--S line { stroke: #6366f1; }
        .dark .ivp-rule--s line { stroke: #f59e0b; }
        .dark .ivp-rule--S line { stroke: #818cf8; }
        .ivp-rule--S { transition-delay: 0.25s; }

        .ivp-rule text {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 10px;
            font-weight: 800;
        }

        .ivp-rule--s text { fill: #b45309; }
        .ivp-rule--S text { fill: #4f46e5; }
        .dark .ivp-rule--s text { fill: #fbbf24; }
        .dark .ivp-rule--S text { fill: #a5b4fc; }

        .fcp[data-phase="model"] .ivp-rule,
        .fcp[data-phase="forecast"] .ivp-rule,
        .fcp[data-phase="out"] .ivp-rule { transform: scaleX(1); }

        .ivp-level {
            fill: none;
            stroke: #b45309;
            stroke-width: 2;
            stroke-linejoin: round;
            stroke-linecap: round;
            stroke-dasharray: 1 1;
            stroke-dashoffset: 1;
            opacity: 0;
            transition: stroke-dashoffset var(--ivp-draw, 3s) linear, opacity 0.15s linear;
        }

        .dark .ivp-level { stroke: #fbbf24; }

        .ivp-area {
            fill: rgba(245, 158, 11, 0.14);
            opacity: 0;
            transition: opacity 0.6s ease var(--ivp-draw, 3s);
        }

        .ivp-order {
            fill: #d97706;
            stroke: #ffffff;
            stroke-width: 1.5;
            transform-box: fill-box;
            transform-origin: center;
            transform: scale(0);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .dark .ivp-order { fill: #f59e0b; stroke: #0f172a; }

        .ivp-arrive {
            fill: #10b981;
            transform-box: fill-box;
            transform-origin: 50% 100%;
            transform: scaleY(0);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dark .ivp-arrive { fill: #34d399; }

        .fcp[data-phase="forecast"] .ivp-level,
        .fcp[data-phase="out"] .ivp-level { stroke-dashoffset: 0; opacity: 1; }

        .fcp[data-phase="forecast"] .ivp-area,
        .fcp[data-phase="out"] .ivp-area { opacity: 1; }

        .fcp[data-phase="forecast"] .ivp-order,
        .fcp[data-phase="out"] .ivp-order { transform: scale(1); }

        .fcp[data-phase="forecast"] .ivp-arrive,
        .fcp[data-phase="out"] .ivp-arrive { transform: scaleY(1); }

        /* Routing preview: stops around a depot, then each stop assigned to a vehicle, then the routes */
        .vrp-k0 { --vrp-c: #d97706; }
        .vrp-k1 { --vrp-c: #6366f1; }
        .vrp-k2 { --vrp-c: #10b981; }
        .dark .vrp-k0 { --vrp-c: #f59e0b; }
        .dark .vrp-k1 { --vrp-c: #818cf8; }
        .dark .vrp-k2 { --vrp-c: #34d399; }

        .vrp-road {
            fill: none;
            stroke: rgba(148, 163, 184, 0.2);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .dark .vrp-road { stroke: rgba(148, 163, 184, 0.1); }

        .vrp-pop {
            transform-box: fill-box;
            transform-origin: center;
            transform: scale(0);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) var(--vrp-pop, 0ms);
        }

        .fcp:not([data-phase="reset"]) .vrp-pop { transform: scale(1); }

        .vrp-stop {
            fill: #94a3b8;
            stroke: #ffffff;
            stroke-width: 1.5;
            transition: fill 0.45s ease var(--vrp-fill, 0ms);
        }

        .dark .vrp-stop { fill: #64748b; stroke: #0f172a; }

        .vrp-halo {
            fill: var(--vrp-c);
            opacity: 0;
            transition: opacity 0.45s ease var(--vrp-fill, 0ms);
        }

        .fcp[data-phase="model"] .vrp-stop,
        .fcp[data-phase="forecast"] .vrp-stop,
        .fcp[data-phase="out"] .vrp-stop { fill: var(--vrp-c); }

        .fcp[data-phase="model"] .vrp-halo,
        .fcp[data-phase="forecast"] .vrp-halo,
        .fcp[data-phase="out"] .vrp-halo { opacity: 0.18; }

        .vrp-route {
            fill: none;
            stroke: var(--vrp-c);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 1 1;
            stroke-dashoffset: 1;
            /* hidden until drawn, like the forecast line */
            opacity: 0;
            transition: stroke-dashoffset 1.5s cubic-bezier(0.65, 0, 0.35, 1) var(--vrp-route, 0ms), opacity 0.15s linear var(--vrp-route, 0ms);
        }

        .fcp[data-phase="forecast"] .vrp-route,
        .fcp[data-phase="out"] .vrp-route { stroke-dashoffset: 0; opacity: 1; }

        .vrp-depot {
            fill: #1e293b;
            stroke: #ffffff;
            stroke-width: 1.5;
        }

        .dark .vrp-depot { fill: #e2e8f0; stroke: #0f172a; }

        .vrp-ring {
            fill: none;
            stroke: #f59e0b;
            stroke-width: 1.5;
            opacity: 0;
            transform-box: fill-box;
            transform-origin: center;
        }

        @keyframes fcp-ring {
            0% { transform: scale(0.6); opacity: 0.9; }
            100% { transform: scale(2.4); opacity: 0; }
        }

        .fcp[data-phase="forecast"] .fcp-ring { animation: fcp-ring 1.4s ease-out 1.6s infinite; }

        @media (prefers-reduced-motion: reduce) {
            .fcp *,
            .fcp *::before,
            .fcp *::after { transition: none !important; animation: none !important; }
        }

        /* Intro video pop-up */
        @keyframes lp3-video-fade { from { opacity: 0; } to { opacity: 1; } }
        @keyframes lp3-video-rise { from { opacity: 0; transform: translateY(18px) scale(0.98); } to { opacity: 1; transform: none; } }
        .lp3-video-overlay { animation: lp3-video-fade 0.25s ease both; }
        .lp3-video-frame { animation: lp3-video-rise 0.35s cubic-bezier(0.16, 1, 0.3, 1) both; }

        @media (prefers-reduced-motion: reduce) {
            .lp3-video-overlay,
            .lp3-video-frame {
                animation: none;
            }
        }

        /* Pagination dots — the visual stays 6px, the hit area grows for touch */
        .lp3-dot {
            position: relative;
        }

        .lp3-dot::after {
            content: '';
            position: absolute;
            inset: -1rem -0.375rem;
        }

        /* Stats row — hairline dividers instead of a boxed band */
        .lp3-stat {
            position: relative;
            padding: 0.25rem 1rem;
        }

        @media (min-width: 1024px) {
            .lp3-stat:not(:first-child)::before {
                content: '';
                position: absolute;
                left: 0;
                top: 10%;
                bottom: 10%;
                width: 1px;
                background: linear-gradient(180deg, transparent, rgba(148, 163, 184, 0.45), transparent);
            }

            .dark .lp3-stat:not(:first-child)::before {
                background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.14), transparent);
            }
        }

        /* Decision cards — question first, module that answers it second */
        .lp3-decision-card {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            border: 1px solid rgba(203, 213, 225, 0.8);
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.55));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px rgba(15, 23, 42, 0.06), inset 0 1px 0 0 rgba(255, 255, 255, 0.7);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease, box-shadow 0.4s ease;
        }

        .dark .lp3-decision-card {
            border-color: rgba(255, 255, 255, 0.08);
            background: linear-gradient(160deg, rgba(30, 41, 59, 0.5), rgba(15, 23, 42, 0.35));
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
        }

        .lp3-decision-card::before {
            content: '';
            position: absolute;
            z-index: -1;
            right: -30%;
            top: -35%;
            width: 80%;
            aspect-ratio: 1;
            border-radius: 9999px;
            background: radial-gradient(closest-side, rgba(245, 158, 11, 0.16), transparent);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .lp3-decision-card:hover,
        .lp3-decision-card:focus-visible {
            transform: translateY(-4px);
            border-color: rgba(245, 158, 11, 0.55);
            box-shadow: 0 18px 48px rgba(180, 83, 9, 0.14), inset 0 1px 0 0 rgba(255, 255, 255, 0.7);
            outline: none;
        }

        .dark .lp3-decision-card:hover,
        .dark .lp3-decision-card:focus-visible {
            border-color: rgba(245, 158, 11, 0.5);
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
        }

        .lp3-decision-card:hover::before,
        .lp3-decision-card:focus-visible::before {
            opacity: 1;
        }

        .lp3-decision-arrow {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        .lp3-decision-card:hover .lp3-decision-arrow,
        .lp3-decision-card:focus-visible .lp3-decision-arrow {
            transform: translateX(3px);
            background-color: #f59e0b;
            border-color: #f59e0b;
            color: #fff;
        }

        /* Photo cards — always dark, photo under a navy scrim */
        .lp3-decision-card.lp3-decision-card--photo,
        .dark .lp3-decision-card.lp3-decision-card--photo {
            border-color: rgba(255, 255, 255, 0.1);
            background: #020617;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            box-shadow: 0 12px 36px rgba(2, 6, 23, 0.35), inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
        }

        .lp3-decision-photo {
            position: absolute;
            inset: 0;
            z-index: -2;
            background-size: cover;
            background-position: center;
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lp3-decision-card--photo::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: -1;
            background: linear-gradient(180deg, rgba(2, 6, 23, 0.6) 0%, rgba(2, 6, 23, 0.3) 32%, rgba(2, 6, 23, 0.94) 80%);
            pointer-events: none;
        }

        .lp3-decision-card--photo:hover .lp3-decision-photo,
        .lp3-decision-card--photo:focus-visible .lp3-decision-photo {
            transform: scale(1.06);
        }

        .lp3-decision-card.lp3-decision-card--photo:hover,
        .lp3-decision-card.lp3-decision-card--photo:focus-visible {
            border-color: rgba(245, 158, 11, 0.6);
            box-shadow: 0 22px 56px rgba(2, 6, 23, 0.55), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
        }

        /* Photo bands — always-dark full-width panels */

        /* ---- Origin band: made in Germany, now available in Vietnam. Follows the page theme ---- */
        .lp3-origin {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            border-color: rgba(217, 119, 6, 0.38);
            background:
                radial-gradient(42% 46% at 15% 38%, rgba(245, 158, 11, 0.16), transparent 64%),
                radial-gradient(40% 46% at 77% 62%, rgba(245, 158, 11, 0.14), transparent 62%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(255, 251, 235, 0.92));
            box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.1), 0 50px 120px -60px rgba(180, 83, 9, 0.5);
        }

        .dark .lp3-origin {
            border-color: rgba(255, 255, 255, 0.1);
            background:
                radial-gradient(42% 46% at 15% 38%, rgba(245, 158, 11, 0.16), transparent 64%),
                radial-gradient(40% 46% at 77% 62%, rgba(245, 158, 11, 0.14), transparent 62%),
                #020617;
            box-shadow: 0 30px 80px -40px rgba(2, 6, 23, 0.9), inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
        }

        /* The map is one path of zero-length segments; round caps turn each into a dot */
        .lp3-origin-dots {
            fill: none;
            stroke: rgba(100, 116, 139, 0.34);
            stroke-width: 5;
            stroke-linecap: round;
        }

        .dark .lp3-origin-dots { stroke: rgba(148, 163, 184, 0.3); }

        /* The network: every connection, faint */
        .lp3-origin-edge {
            fill: none;
            stroke: rgba(100, 116, 139, 0.4);
            stroke-width: 1.5;
            stroke-linecap: round;
        }

        .dark .lp3-origin-edge { stroke: rgba(148, 163, 184, 0.3); }

        /* The search: a wave leaves Germany and runs along the connections at constant speed.
           Delay and duration per connection come from Dijkstra's distances (inline styles). */
        .lp3-origin-scan {
            fill: none;
            stroke: rgba(217, 119, 6, 0.6);
            stroke-width: 2.25;
            stroke-linecap: round;
            stroke-dasharray: 1;
            stroke-dashoffset: 1;
        }

        .dark .lp3-origin-scan { stroke: rgba(251, 191, 36, 0.55); }

        /* The result: the shortest path, drawn connection by connection */
        .lp3-origin-path {
            fill: none;
            stroke: url(#lp3-origin-arc-grad);
            stroke-width: 4.5;
            stroke-linecap: round;
            stroke-dasharray: 1;
            stroke-dashoffset: 1;
            filter: drop-shadow(0 0 5px rgba(217, 119, 6, 0.35));
        }

        .dark .lp3-origin-path { filter: drop-shadow(0 0 7px rgba(245, 158, 11, 0.6)); }

        .lp3-origin.is-visible .lp3-origin-scan,
        .lp3-origin.is-visible .lp3-origin-path {
            animation-name: lp3-origin-draw;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }

        @keyframes lp3-origin-draw { to { stroke-dashoffset: 0; } }

        /* Once the shortest path stands, everything else in the network fades away */
        .lp3-origin.is-visible .lp3-origin-network {
            animation: lp3-origin-leave 1.1s ease forwards;
        }

        @keyframes lp3-origin-leave { to { opacity: 0; } }

        /* Loop: each run fades in, and fades out before the next run restarts the search */
        .lp3-origin-run { transition: opacity 0.7s ease; }
        .lp3-origin.is-visible .lp3-origin-run { animation: lp3-origin-run-in 0.5s ease backwards; }
        .lp3-origin.is-resetting .lp3-origin-run { opacity: 0; }

        @keyframes lp3-origin-run-in { from { opacity: 0; } }

        .lp3-origin-stop-edge { stop-color: #d97706; }
        .lp3-origin-stop-mid { stop-color: #f59e0b; }
        .dark .lp3-origin-stop-edge { stop-color: #f59e0b; }
        .dark .lp3-origin-stop-mid { stop-color: #fde68a; }

        /* Hubs: grey until the search reaches them, amber once visited, gold on the shortest path */
        .lp3-origin-node {
            fill: #ffffff;
            stroke: rgba(100, 116, 139, 0.75);
            stroke-width: 2;
        }

        .dark .lp3-origin-node { fill: #020617; stroke: rgba(148, 163, 184, 0.6); }

        .lp3-origin.is-visible .lp3-origin-node--visited {
            animation: lp3-origin-node-visit 0.35s ease forwards;
        }

        .lp3-origin.is-visible .lp3-origin-node--path {
            animation: lp3-origin-node-visit 0.35s ease forwards, lp3-origin-node-path 0.4s ease forwards;
        }

        @keyframes lp3-origin-node-visit { to { stroke: #d97706; } }
        @keyframes lp3-origin-node-path { to { fill: #f59e0b; stroke: #f59e0b; } }

        .lp3-origin-marker {
            offset-distance: 0%;
            opacity: 0;
            fill: #b45309;
            filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.85));
        }

        .dark .lp3-origin-marker {
            fill: #fef3c7;
            filter: drop-shadow(0 0 8px rgba(253, 230, 138, 0.95));
        }

        .lp3-origin.is-visible .lp3-origin-marker {
            animation: lp3-origin-travel 4.2s linear infinite;   /* MARKER_TRIP_S in OriginSection */
        }

        @keyframes lp3-origin-travel {
            0% { offset-distance: 0%; opacity: 0; }
            6% { opacity: 1; }
            90% { opacity: 1; }
            100% { offset-distance: 100%; opacity: 0; }
        }

        /* Each country: a solid dot inside a thin ring, with a soft pulse leaving the ring */
        .lp3-origin-ring { fill: rgba(255, 255, 255, 0.94); stroke: #d97706; stroke-width: 2; }
        .dark .lp3-origin-ring { fill: rgba(2, 6, 23, 0.88); stroke: #fbbf24; }

        .lp3-origin-point { fill: #f59e0b; filter: drop-shadow(0 0 5px rgba(245, 158, 11, 0.55)); }
        .dark .lp3-origin-point { fill: #fbbf24; filter: drop-shadow(0 0 7px rgba(245, 158, 11, 0.8)); }

        .lp3-origin-pulse {
            fill: none;

            stroke-width: 1.5;
            transform-box: fill-box;

        .lp3-origin-place { fill: #b45309; }

        .lp3-origin-km {

        .lp3-origin-hub-name {

        .lp3-origin.is-visible .lp3-origin-hub-name { animation: lp3-origin-km-in 0.45s ease forwards; }

        @keyframes lp3-origin-km-in { to { opacity: 1; } }

        .lp3-origin-card {

                        { q: "Chúng tôi có cần chuyên gia dữ liệu hoặc chuyên gia tối ưu riêng không?", a: "Không. Các mô-đun được thiết kế cho người lập kế hoạch: bạn làm việc với dự báo, kế hoạch và kịch bản, còn các mô hình toán học chạy ở phía sau. Trong các dự án thiết kế riêng, đội ngũ vận trù học của chúng tôi xây dựng và kiểm chứng mô hình cùng đội ngũ của bạn." },
                        { q: "Chúng tôi có thể xem demo trước khi quyết định không?", a: "Có. Bạn có thể đăng ký demo hoặc đặt lịch tư vấn bằng tiếng Việt, tiếng Anh hoặc tiếng Đức. Với dự án thiết kế riêng, giai đoạn bản mẫu cho phép bạn thử nghiệm giải pháp trên dữ liệu của chính mình trước khi triển khai toàn bộ.", link: 'contact' },

                        { q: "Mit welchen Systemen kann sich Operartis verbinden?", a: "Mit ERP-Systemen wie SAP, Microsoft Dynamics 365, Oracle und Odoo sowie mit Excel-Dateien, E-Mails und PDF- oder XML-Dokumenten. Ist Ihr System nicht aufgeführt, bestätigen wir die Anbindung während der Evaluierung.", link: 'integrations' },
                        { q: "Welche Daten brauchen wir für den Start?", a: "Meist Daten, die Sie bereits haben: Absatzhistorie für die Bedarfsprognose, Bestände und Wiederbeschaffungszeiten für die Bestandsoptimierung, Kundenstandorte und Fahrzeuge für die Tourenplanung. Sie können mit einem Excel-Export in unserem Vorlagenformat starten, noch vor jeder Systemanbindung." },

            { id: 'strategic', color: 'bg-gradient-to-r from-[#b45309] via-[#f59e0b] to-[#fde68a] text-transparent bg-clip-text', subModules: [['median_prob', 'cover_prob', 'facility_loc', 'center_prob', 'warehouse_loc', 'hub_loc']] },
            { id: 'tactical', color: 'bg-gradient-to-r from-[#b45309] via-[#f59e0b] to-[#fde68a] text-transparent bg-clip-text', subModules: [['forecaster', 'advanced_forecaster'], ['aggregated_planning'], ['abc', 'inventory']] },
            { id: 'operational', color: 'bg-gradient-to-r from-[#b45309] via-[#f59e0b] to-[#fde68a] text-transparent bg-clip-text', subModules: [['clsp', 'cap_main_planning', 'scheduling_prob'], ['logistics', 'vrp', 'shortest_path']] },
            { id: 'cross', color: 'bg-gradient-to-r from-[#b45309] via-[#f59e0b] to-[#fde68a] text-transparent bg-clip-text', subModules: [['queuing_sim'], ['atp']] }
        ];

        // --- COMPONENTS ---

        // Reveal Animation Component
        const Reveal = ({ children, className = "", delay = 0, threshold = 0.1 }) => {
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setIsVisible(true);
                        observer.disconnect();
                    }
                }, { threshold, rootMargin: "0px 0px -50px 0px" });

                if (ref.current) observer.observe(ref.current);
                return () => {
                    if (ref.current) observer.unobserve(ref.current);
                };
            }, [threshold]);

            return (
                <div
                    ref={ref}
                    className={`reveal-base ${isVisible ? 'reveal-visible' : 'reveal-hidden'} ${className}`}
                    style={{ transitionDelay: `${delay}ms` }}
                >
                    {children}
                </div>
            );
        };

        // ModulaBlock — glass app tile with Quick View overlay
        // Animated previews inside live blocks (a product screenshot still works: { file, pos })
        const BLOCK_SHOTS = {
            forecaster: { animated: 'forecast' },
            inventory: { animated: 'inventory' },
            vrp: { animated: 'vrp' },
        };
        const blockHasLive = (block) => (Array.isArray(block && block.subModules) ? block.subModules : [])
            .some(id => (MODULE_STATIC_DATA[id] || {}).status === 'live');

        // Animated preview for the demand block: demand history -> a model learns the pattern -> forecast with an uncertainty band
        const FCP_DATA = (() => {
            const noise = [2.1, -3.4, 1.2, 4.0, -1.8, -2.6, 3.1, 0.4, -3.9, 2.7, -0.8, 1.9, -2.2, 3.6, -1.1, -3.0, 2.4, 0.9, -2.7, 1.5, 3.3, -1.6, -0.5, 2.2];
            const level = (t) => 24 + 1.05 * t + 8.5 * Math.sin((2 * Math.PI * (t - 2)) / 12);
            return {
                history: noise.map((e, t) => level(t) + e),
                fit: noise.map((_, t) => level(t)),
                future: Array.from({ length: 9 }, (_, k) => ({ mid: level(24 + k), half: 2.5 + 1.25 * (k + 1) })),
            };
        })();
        // Shared by the animated block previews: a phase loop (reset -> data -> model -> forecast -> out)
        // that runs only while the preview is on screen, plus the preview's measured pixel size.
        const PREVIEW_ORDER = ['reset', 'data', 'model', 'forecast', 'out'];
        const FCP_MS = { reset: 120, data: 2300, model: 2100, forecast: 3900, out: 450 };

        const usePreviewLoop = (ms) => {
            const rootRef = useRef(null);
            const chartRef = useRef(null);
            const [size, setSize] = useState(null);
            const [phase, setPhase] = useState('reset');
            const [running, setRunning] = useState(false);
            const reduced = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            useLayoutEffect(() => {
                const el = chartRef.current;
                if (!el) return undefined;
                const measure = () => {
                    const r = el.getBoundingClientRect();
                    if (r.width && r.height) setSize(prev => (prev && Math.abs(prev.w - r.width) < 0.5 && Math.abs(prev.h - r.height) < 0.5 ? prev : { w: r.width, h: r.height }));
                };
                measure();
                if (typeof ResizeObserver === 'undefined') {
                    window.addEventListener('resize', measure);
                    return () => window.removeEventListener('resize', measure);
                }
                const ro = new ResizeObserver(measure);
                ro.observe(el);
                return () => ro.disconnect();
            }, []);

            // Play only while the block is on screen
            useEffect(() => {
                if (reduced) { setPhase('forecast'); return undefined; }
                const el = rootRef.current;
                if (!el || typeof IntersectionObserver === 'undefined') { setRunning(true); return undefined; }
                const io = new IntersectionObserver(([entry]) => setRunning(entry.isIntersecting), { threshold: 0.25 });
                io.observe(el);
                return () => io.disconnect();
            }, [reduced]);

            useEffect(() => {
                if (reduced || !running) return undefined;
                const timer = setTimeout(() => {
                    setPhase(prev => PREVIEW_ORDER[(PREVIEW_ORDER.indexOf(prev) + 1) % PREVIEW_ORDER.length]);
                }, ms[phase]);
                return () => clearTimeout(timer);
            }, [phase, running, reduced, ms]);

            return { rootRef, chartRef, size, phase };
        };

        // Step tabs above a preview; labels follow the three working phases
        const PreviewSteps = ({ labels, phase, ms }) => {
            const keys = ['data', 'model', 'forecast'];
            const current = phase === 'out' ? 3 : keys.indexOf(phase);
            return (
                <div className="fcp-steps">
                    {keys.map((key, i) => (
                        <span
                            key={key}
                            className={`fcp-step${i === current ? ' is-active' : ''}${i < current ? ' is-done' : ''}`}
                            style={{ '--fcp-dur': `${ms[key]}ms` }}
                        >
                            <b>{i + 1}</b><span>{labels[i]}</span>
                        </span>
                    ))}
                </div>
            );
        };

        // Smooth curve through points (Catmull-Rom as cubic Béziers)
        const fcpSmooth = (pts) => pts.map((p, i) => {
            if (i === 0) return `M${p[0].toFixed(1)},${p[1].toFixed(1)}`;
            const p0 = pts[i - 2] || pts[i - 1];
            const p1 = pts[i - 1];
            const p3 = pts[i + 1] || p;
            const c1 = [p1[0] + (p[0] - p0[0]) / 6, p1[1] + (p[1] - p0[1]) / 6];
            const c2 = [p[0] - (p3[0] - p1[0]) / 6, p[1] - (p3[1] - p1[1]) / 6];
            return `C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p[0].toFixed(1)},${p[1].toFixed(1)}`;
        }).join(' ');

        const ForecastPreview = ({ ui }) => {
            const { rootRef, chartRef, size, phase } = usePreviewLoop(FCP_MS);

            let scene = null;
            if (size) {
                const { w, h } = size;
                const { history, fit, future } = FCP_DATA;
                const padL = 12, padR = 14, padT = 24, padB = 12;
                const slots = history.length + future.length;
                const slotW = (w - padL - padR) / slots;
                const yMax = Math.max(...future.map(f => f.mid + f.half), ...history) * 1.06;
                const baseY = h - padB;
                const x = (t) => padL + slotW * (t + 0.5);
                const y = (v) => padT + (1 - v / yMax) * (baseY - padT);
                const barW = Math.max(2, slotW * 0.62);
                const last = history.length - 1;
                const todayX = (x(last) + x(last + 1)) / 2;
                const fitPts = fit.map((v, t) => [x(t), y(v)]);
                const linePts = [[x(last), y(fit[last])], ...future.map((f, k) => [x(last + 1 + k), y(f.mid)])];
                const upper = [[x(last), y(fit[last])], ...future.map((f, k) => [x(last + 1 + k), y(f.mid + f.half)])];
                const lower = [[x(last), y(fit[last])], ...future.map((f, k) => [x(last + 1 + k), y(f.mid - f.half)])];
                const bandPath = `${fcpSmooth(upper)} L${lower[lower.length - 1][0].toFixed(1)},${lower[lower.length - 1][1].toFixed(1)} ${fcpSmooth(lower.slice().reverse()).replace(/^M[^C]*/, '')} Z`;
                const tip = linePts[linePts.length - 1];

                scene = (
                    <svg viewBox={`0 0 ${w} ${h}`} width={w} height={h} aria-hidden="true">
                        <g className="fcp-scene">
                            <rect className="fcp-future" x={todayX} y={padT - 6} width={Math.max(0, w - padR + 6 - todayX)} height={baseY - padT + 6} rx="4" />
                            <line className="fcp-axis" x1={padL - 4} y1={baseY} x2={w - padR + 4} y2={baseY} />
                            {history.map((v, t) => (
                                <rect
                                    key={t}
                                    className="fcp-bar"
                                    x={x(t) - barW / 2}
                                    y={y(v)}
                                    width={barW}
                                    height={Math.max(0, baseY - y(v))}
                                    rx={Math.min(1.5, barW / 3)}
                                    style={{ transitionDelay: `${t * 45}ms` }}
                                />
                            ))}
                            <path className="fcp-band" d={bandPath} />
                            <path className="fcp-fit" d={fcpSmooth(fitPts)} pathLength="1" />
                            <path className="fcp-line" d={fcpSmooth(linePts)} pathLength="1" />
                            <g className="fcp-today">
                                <line x1={todayX} y1={padT - 6} x2={todayX} y2={baseY} />
                                <text x={todayX} y={padT - 11} textAnchor="middle">{ui.fcp_today}</text>
                            </g>
                            <g className="fcp-tip">
                                <circle className="fcp-ring" cx={tip[0]} cy={tip[1]} r="4" />
                                <circle cx={tip[0]} cy={tip[1]} r="3" />
                            </g>
                        </g>
                    </svg>
                );
            }

            return (
                <div className="fcp" data-phase={phase} ref={rootRef}>
                    <PreviewSteps labels={[ui.fcp_data, ui.fcp_model, ui.fcp_forecast]} phase={phase} ms={FCP_MS} />
                    <div className="fcp-chart" ref={chartRef}>{scene}</div>
                </div>
            );
        };

        // Animated preview for the inventory block: daily demand -> an (s, S) reorder rule -> the simulated stock level,
        // with orders placed when stock reaches s and deliveries arriving after the lead time
        const IVP_MS = { reset: 120, data: 1900, model: 1700, forecast: 4600, out: 450 };
        const IVP_DATA = (() => {
            const demand = [6, 5, 8, 7, 4, 6, 9, 5, 7, 6, 8, 4, 5, 7, 9, 6, 5, 8, 6, 7, 4, 6, 8, 5, 7, 9, 5, 6, 7, 8, 4, 6, 5, 7, 8, 6];
            const s = 38, S = 100, lead = 3;
            let onHand = 92;
            let pipeline = [];
            const steps = [];
            demand.forEach((d, t) => {
                const received = pipeline.filter(o => o.arrive === t).reduce((sum, o) => sum + o.qty, 0);
                pipeline = pipeline.filter(o => o.arrive !== t);
                const start = onHand;
                onHand += received;
                const top = onHand;
                onHand = Math.max(0, onHand - d);
                const position = onHand + pipeline.reduce((sum, o) => sum + o.qty, 0);
                const order = position <= s;
                if (order) pipeline.push({ arrive: t + lead, qty: S - position });
                steps.push({ start, top, end: onHand, received, order });
            });
            return { demand, steps, s, S };
        })();

        const InventoryPreview = ({ ui }) => {
            const { rootRef, chartRef, size, phase } = usePreviewLoop(IVP_MS);
            const draw = 3200;

            let scene = null;
            if (size) {
                const { w, h } = size;
                const { demand, steps, s, S } = IVP_DATA;
                const padL = 22, padR = 12, padT = 14, padB = 8;
                const n = demand.length;
                const slotW = (w - padL - padR) / n;
                const stripH = Math.max(18, h * 0.17);
                const stripBase = h - padB;
                const zeroY = stripBase - stripH - 9;
                const yMax = S * 1.1;
                const x = (t) => padL + slotW * t;
                const y = (v) => padT + (1 - v / yMax) * (zeroY - padT);
                const dMax = Math.max(...demand);

                // Stock level as a sawtooth: jump up on delivery, fall with demand across the period
                const pts = [[x(0), y(steps[0].start)]];
                const marks = [];
                steps.forEach((st, t) => {
                    if (st.received) {
                        marks.push({ kind: 'arrive', idx: pts.length - 1, t, from: st.start, to: st.top });
                        pts.push([x(t), y(st.top)]);
                    }
                    pts.push([x(t + 1), y(st.end)]);
                    if (st.order) marks.push({ kind: 'order', idx: pts.length - 1, t, level: st.end });
                });
                const cum = [0];
                for (let i = 1; i < pts.length; i++) {
                    cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
                }
                const total = cum[cum.length - 1] || 1;
                const at = (idx) => Math.round((cum[idx] / total) * draw);
                const linePath = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
                const areaPath = `${linePath} L${pts[pts.length - 1][0].toFixed(1)},${zeroY} L${pts[0][0].toFixed(1)},${zeroY} Z`;
                const barW = Math.max(1.5, slotW * 0.56);
                const ruleEnd = w - padR;

                scene = (
                    <svg viewBox={`0 0 ${w} ${h}`} width={w} height={h} aria-hidden="true" style={{ '--ivp-draw': `${draw}ms` }}>
                        <g className="fcp-scene">
                            <line className="fcp-axis" x1={padL - 4} y1={zeroY} x2={ruleEnd + 4} y2={zeroY} />
                            <line className="fcp-axis" x1={padL - 4} y1={stripBase} x2={ruleEnd + 4} y2={stripBase} />
                            {demand.map((d, t) => (
                                <rect
                                    key={t}
                                    className="ivp-dbar"
                                    x={x(t) + (slotW - barW) / 2}
                                    y={stripBase - (d / dMax) * stripH}
                                    width={barW}
                                    height={(d / dMax) * stripH}
                                    rx={Math.min(1, barW / 3)}
                                    style={{ transitionDelay: `${t * 38}ms` }}
                                />
                            ))}
                            <path className="ivp-area" d={areaPath} />
                            <g className="ivp-rule ivp-rule--S">
                                <line x1={padL} y1={y(S)} x2={ruleEnd} y2={y(S)} />
                                <text x={padL - 7} y={y(S) + 3.5} textAnchor="end">S</text>
                            </g>
                            <g className="ivp-rule ivp-rule--s">
                                <line x1={padL} y1={y(s)} x2={ruleEnd} y2={y(s)} />
                                <text x={padL - 7} y={y(s) + 3.5} textAnchor="end">s</text>
                            </g>
                            <path className="ivp-level" d={linePath} pathLength="1" />
                            {marks.filter(m => m.kind === 'arrive').map(m => (
                                <rect
                                    key={`a${m.t}`}
                                    className="ivp-arrive"
                                    x={x(m.t) - 1.5}
                                    y={y(m.to)}
                                    width="3"
                                    height={Math.max(0, y(m.from) - y(m.to))}
                                    rx="1"
                                    style={{ transitionDelay: `${at(m.idx)}ms` }}
                                />
                            ))}
                            {marks.filter(m => m.kind === 'order').map(m => (
                                <circle
                                    key={`o${m.t}`}
                                    className="ivp-order"
                                    cx={x(m.t + 1)}
                                    cy={y(m.level)}
                                    r="3.2"
                                    style={{ transitionDelay: `${at(m.idx)}ms` }}
                                />
                            ))}
                        </g>
                    </svg>
                );
            }

            return (
                <div className="fcp" data-phase={phase} ref={rootRef}>
                    <PreviewSteps labels={[ui.ivp_data, ui.ivp_model, ui.ivp_forecast]} phase={phase} ms={IVP_MS} />
                    <div className="fcp-chart" ref={chartRef}>{scene}</div>
                </div>
            );
        };

        // Animated preview for the transport block: customer stops around a depot -> each stop is assigned
        // to a vehicle -> the vehicles' routes are drawn out from the depot and back.
        // Positions are fractions of the chart box; each route lists its stops in visiting order.
        const VRP_MS = { reset: 120, data: 1900, model: 1700, forecast: 4200, out: 450 };
        const VRP_DATA = {
            depot: [0.5, 0.52],
            routes: [
                [[0.4, 0.38], [0.24, 0.42], [0.12, 0.26], [0.22, 0.1], [0.4, 0.16]],
                [[0.6, 0.14], [0.78, 0.1], [0.9, 0.28], [0.86, 0.46], [0.68, 0.4]],
                [[0.8, 0.66], [0.7, 0.88], [0.48, 0.9], [0.28, 0.82], [0.16, 0.62]],
            ],
            // Faint street lines so the scene reads as a map
            roads: [
                [[0, 0.3], [0.35, 0.28], [0.62, 0.32], [1, 0.22]],
                [[0, 0.74], [0.3, 0.7], [0.55, 0.62], [1, 0.58]],
                [[0.32, 0], [0.36, 0.45], [0.3, 1]],
                [[0.74, 0], [0.66, 0.5], [0.72, 1]],
            ],
        };

        const VrpPreview = ({ ui }) => {
            const { rootRef, chartRef, size, phase } = usePreviewLoop(VRP_MS);

            let scene = null;
            if (size) {
                const { w, h } = size;
                const { depot, routes, roads } = VRP_DATA;
                const padX = 16, padT = 12, padB = 12;
                const px = ([fx, fy]) => [padX + fx * (w - 2 * padX), padT + fy * (h - padT - padB)];
                const line = (pts) => pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
                const roadLine = (pts) => line(pts.map(([fx, fy]) => [fx * w, fy * h]));
                const d0 = px(depot);
                let popIndex = 0;

                scene = (
                    <svg viewBox={`0 0 ${w} ${h}`} width={w} height={h} aria-hidden="true">
                        <g className="fcp-scene">
                            {roads.map((r, i) => <path key={`r${i}`} className="vrp-road" d={roadLine(r)} />)}
                            {routes.map((stops, k) => (
                                <path
                                    key={`p${k}`}
                                    className={`vrp-route vrp-k${k}`}
                                    d={line([d0, ...stops.map(px), d0])}
                                    pathLength="1"
                                    style={{ '--vrp-route': `${k * 520}ms` }}
                                />
                            ))}
                            {routes.map((stops, k) => stops.map((s, j) => {
                                const [cx, cy] = px(s);
                                const pop = 260 + (popIndex++) * 70;
                                return (
                                    <g key={`s${k}-${j}`} className={`vrp-pop vrp-k${k}`} style={{ '--vrp-pop': `${pop}ms`, '--vrp-fill': `${k * 260 + j * 70}ms` }}>
                                        <circle className="vrp-halo" cx={cx} cy={cy} r="8.5" />
                                        <circle className="vrp-stop" cx={cx} cy={cy} r="3.6" />
                                    </g>
                                );
                            }))}
                            <circle className="vrp-ring fcp-ring" cx={d0[0]} cy={d0[1]} r="6" />
                            <g className="vrp-pop">
                                <rect className="vrp-depot" x={d0[0] - 6} y={d0[1] - 6} width="12" height="12" rx="2.5" />
                            </g>
                        </g>
                    </svg>
                );
            }

            return (
                <div className="fcp" data-phase={phase} ref={rootRef}>
                    <PreviewSteps labels={[ui.vrp_data, ui.vrp_model, ui.vrp_forecast]} phase={phase} ms={VRP_MS} />
                    <div className="fcp-chart" ref={chartRef}>{scene}</div>
                </div>
            );
        };

        const ModulaBlock = ({ block, blockId, content, onClick, activeQuickViewBlockId, onQuickViewActive }) => {
            const quickViewScrollRef = useRef(null);
            const touchRef = useRef({
                startX: 0,
                startY: 0,
                lastY: 0,
                moved: false,
                longPressTimer: null,
                longPressTriggered: false,
                inQuickViewGesture: false,
            });

            const LONG_PRESS_MS = 560;
            const MOVE_THRESHOLD = 10;
            const SCROLL_SLOP = 24;

            const clearLongPress = useCallback(() => {
                if (touchRef.current.longPressTimer) {
                    clearTimeout(touchRef.current.longPressTimer);
                    touchRef.current.longPressTimer = null;
                }
            }, []);

            useEffect(() => () => clearLongPress(), [clearLongPress]);

            if (!block) return null;

            const mobileQuickView = activeQuickViewBlockId === blockId;

            const closeQuickView = () => {
                if (activeQuickViewBlockId === blockId) onQuickViewActive(null);
            };

            const openQuickView = () => {
                onQuickViewActive(blockId);
            };

            const rawSubModules = block.subModules;
            const subModules = Array.isArray(rawSubModules) ? rawSubModules : [];

            const subModulesList = subModules.map(modId => {
                const staticData = MODULE_STATIC_DATA[modId] || { icon: <ActivityIcon />, status: 'planned', href: '#' };
                const textData = (content && content.registry && content.registry[modId]) || { name: modId, desc: '' };
                return { ...staticData, ...textData, id: modId };
            });

            const hasLiveModule = subModulesList.some(m => m.status === 'live');
            const liveModules = subModulesList.filter(m => m.status === 'live');
            const shotId = hasLiveModule ? subModules.find(id => BLOCK_SHOTS[id]) : null;
            const shot = shotId ? BLOCK_SHOTS[shotId] : null;

            const isTouchUi = () => window.matchMedia('(hover: none), (pointer: coarse)').matches;

            const handleClick = () => {
                if (isTouchUi()) return;
                onClick(block);
            };

            const handleTouchStart = (e) => {
                if (!isTouchUi()) return;
                const t = e.touches[0];
                touchRef.current.startX = t.clientX;
                touchRef.current.startY = t.clientY;
                touchRef.current.lastY = t.clientY;
                touchRef.current.moved = false;
                touchRef.current.longPressTriggered = false;
                touchRef.current.inQuickViewGesture = mobileQuickView;
                if (activeQuickViewBlockId && activeQuickViewBlockId !== blockId) {
                    onQuickViewActive(null);
                    touchRef.current.inQuickViewGesture = false;
                }
                clearLongPress();
                touchRef.current.longPressTimer = setTimeout(() => {
                    if (!touchRef.current.moved) {
                        touchRef.current.longPressTriggered = true;
                        touchRef.current.inQuickViewGesture = false;
                        closeQuickView();
                        onClick(block);
                    }
                    clearLongPress();
                }, LONG_PRESS_MS);
            };

            const handleTouchMove = (e) => {
                if (!isTouchUi()) return;
                const t = e.touches[0];
                const dx = t.clientX - touchRef.current.startX;
                const dy = t.clientY - touchRef.current.startY;
                const adx = Math.abs(dx);
                const ady = Math.abs(dy);
                if (adx < MOVE_THRESHOLD && ady < MOVE_THRESHOLD) return;

                touchRef.current.moved = true;
                clearLongPress();

                const quickViewOpen = touchRef.current.inQuickViewGesture || mobileQuickView;
                if (quickViewOpen) {
                    const scrollEl = quickViewScrollRef.current;
                    if (scrollEl && ady >= adx) {
                        const deltaY = t.clientY - touchRef.current.lastY;
                        touchRef.current.lastY = t.clientY;
                        const maxScroll = scrollEl.scrollHeight - scrollEl.clientHeight;
                        const nextScroll = scrollEl.scrollTop - deltaY;
                        if (maxScroll > 0) {
                            scrollEl.scrollTop = Math.max(0, Math.min(maxScroll, nextScroll));
                            e.preventDefault();
                        }
                    }
                    return;
                }

                if (ady > SCROLL_SLOP && ady > adx * 1.2) {
                    return;
                }

                touchRef.current.inQuickViewGesture = true;
                openQuickView();
            };

            const handleTouchEnd = () => {
                if (!isTouchUi()) return;
                clearLongPress();
                touchRef.current.lastY = 0;
                if (touchRef.current.longPressTriggered) {
                    touchRef.current.longPressTriggered = false;
                    return;
                }
                if (touchRef.current.moved) return;
                if (!mobileQuickView) {
                    openQuickView();
                }
            };

            const handleTouchCancel = () => {
                clearLongPress();
                touchRef.current.lastY = 0;
                touchRef.current.longPressTriggered = false;
            };

                    onClick={handleClick}
                    onTouchStart={handleTouchStart}
                    onTouchMove={handleTouchMove}
                    onTouchEnd={handleTouchEnd}
                    onTouchCancel={handleTouchCancel}
                    onContextMenu={(e) => {

        const SC_SKIP_LINKS = [

            const lineStyle = isPast && !isActive ? { opacity: 0.75 } : undefined;
            const lineEnd = Math.max(0, mid - ah);

            return (

                    <line x1="0" y1="12" x2={lineEnd} y2="12" stroke={stroke} strokeWidth={strokeWidth} strokeLinecap="round" className={arrowClass} style={lineStyle} vectorEffect="non-scaling-stroke" />
                    <polygon points={`${mid - ah},${12 - SC_FLOW_ARROW_RISE} ${mid + ah},12 ${mid - ah},${12 + SC_FLOW_ARROW_RISE}`} fill={arrowFill} className={isActive ? 'sc-arrow-pulse' : undefined} />
                    <line x1={lineStart} y1="12" x2={w} y2="12" stroke={stroke} strokeWidth={strokeWidth} strokeLinecap="round" className={arrowClass} style={lineStyle} vectorEffect="non-scaling-stroke" />
                </svg>
            );
        };

        // Shared styling for skip routes and demand loop
        const SC_ROUTE_STROKE = 'rgba(148,163,184,0.55)';

        // Closed-loop demand signal: End Customers → Procurement
        const SC_DEMAND_LOOP = { from: 5, to: 0 };

        const SCDemandLoopLayer = ({ route, trackW, label }) => {
            if (!route || !trackW) return null;

            const ah = SC_FLOW_ARROW_HALF;

                        <line x1={x2} y1={loopY} x2={x2} y2={arrowBaseY} {...lineProps} />
                        <polygon
                            points={`${x2 - ah},${arrowBaseY} ${x2 + ah},${arrowBaseY} ${x2},${y2}`}
                            fill={SC_ROUTE_STROKE}

                    </g>
                    {label && (

                            {label}
