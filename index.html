                ['mad', 'alg'], ['sto', 'hel'], ['sto', 'waw'], ['hel', 'mow'], ['waw', 'mow'], ['waw', 'kie'], ['kie', 'mow'],
                ['kie', 'ist'], ['rom', 'tun'], ['rom', 'ath'], ['ath', 'ist'],
                // North Africa and the Middle East
                ['alg', 'tun'], ['tun', 'tip'], ['tip', 'ath'], ['tip', 'cai'], ['ath', 'cai'], ['cai', 'bgw'], ['cai', 'jed'],
                ['ist', 'bgw'], ['ist', 'bak'], ['ist', 'thr'], ['bgw', 'thr'], ['bgw', 'ruh'], ['jed', 'ruh'], ['ruh', 'dxb'],
                ['mow', 'bak'], ['bak', 'thr'], ['bak', 'tas'], ['thr', 'dxb'],
                // Russia and Central Asia
                ['mow', 'kzn'], ['mow', 'ast'], ['kzn', 'ast'], ['kzn', 'nsk'], ['ast', 'nsk'], ['ast', 'tas'], ['ast', 'alm'],
                ['ast', 'urc'], ['nsk', 'urc'], ['nsk', 'irk'], ['tas', 'alm'], ['alm', 'urc'], ['thr', 'tas'], ['thr', 'kbl'],
                ['kbl', 'tas'],
                // South Asia
                ['thr', 'del'], ['tas', 'del'], ['kbl', 'del'], ['kbl', 'khi'], ['dxb', 'khi'], ['dxb', 'bom'], ['khi', 'del'],
                ['khi', 'bom'], ['bom', 'del'], ['bom', 'ccu'], ['bom', 'maa'], ['maa', 'ccu'], ['maa', 'rgn'], ['del', 'ccu'],
                ['del', 'lhs'], ['lhs', 'urc'], ['lhs', 'ccu'], ['lhs', 'kmg'],
                // East and South-East Asia
                ['irk', 'ulb'], ['ulb', 'urc'], ['ulb', 'pek'], ['ulb', 'xia'], ['urc', 'xia'], ['urc', 'kmg'], ['pek', 'xia'],
                ['pek', 'sha'], ['sha', 'xia'], ['sha', 'can'], ['xia', 'kmg'], ['xia', 'can'], ['can', 'kmg'], ['can', 'vn'],
                ['ccu', 'kmg'], ['ccu', 'rgn'], ['ccu', 'vn'], ['rgn', 'kmg'], ['rgn', 'bkk'], ['kmg', 'vn'], ['bkk', 'vn'],
            ],
        };

        // Distance in kilometres between two map points, along the great circle. The map has 10 units per degree
        // and its top-left corner is 14°W 62°N.
        const originKm = ([x1, y1], [x2, y2]) => {
            const rad = Math.PI / 180;
            const lat1 = (62 - y1 / 10) * rad;
            const lat2 = (62 - y2 / 10) * rad;
            const dLon = ((x2 - x1) / 10) * rad;
            const h = Math.sin((lat2 - lat1) / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
            return 2 * 6371 * Math.asin(Math.sqrt(h));
        };

        // Dijkstra's shortest-path algorithm on ORIGIN_NETWORK (edge weight = real distance in km), stopped when
        // the target is settled. Returns what the animation shows: when the search wave reaches each hub, which
        // connections it runs along and in which direction, and the shortest path itself.
        const solveOriginNetwork = ({ nodes, edges, source, target }) => {
            const length = (a, b) => originKm(nodes[a], nodes[b]);
            const neighbours = {};
            Object.keys(nodes).forEach((id) => { neighbours[id] = []; });
            edges.forEach(([a, b]) => { neighbours[a].push(b); neighbours[b].push(a); });

            const dist = {};
            const previous = {};
            const settled = new Set();
            Object.keys(nodes).forEach((id) => { dist[id] = Infinity; });
            dist[source] = 0;
            while (!settled.has(target)) {
                let current = null;
                Object.keys(nodes).forEach((id) => {
                    if (!settled.has(id) && (current === null || dist[id] < dist[current])) current = id;
                });
                if (current === null || dist[current] === Infinity) break;
                settled.add(current);
                neighbours[current].forEach((next) => {
                    const candidate = dist[current] + length(current, next);
                    if (candidate < dist[next]) {
                        dist[next] = candidate;
                        previous[next] = current;
                    }
                });
            }

            const path = [target];
            while (path[0] !== source) path.unshift(previous[path[0]]);
            const pathEdges = path.slice(1).map((id, i) => ({ from: path[i], to: id, length: length(path[i], id) }));

            // A connection is searched from whichever end was settled first; unsettled hubs search nothing
            const scanned = [];
            edges.forEach(([a, b]) => {
                const starts = [a, b].filter((id) => settled.has(id)).sort((x, y) => dist[x] - dist[y]);
                if (!starts.length) return;
                const from = starts[0];
                scanned.push({ from, to: from === a ? b : a, start: dist[from], length: length(a, b) });
            });
            return { dist, settled, path, pathEdges, scanned, total: dist[target] };
        };

        const ORIGIN_SOLUTION = solveOriginNetwork(ORIGIN_NETWORK);

        // Names of the hubs on the shortest path, and the side of the hub each name stands on (chosen by hand so
        // that it stays clear of the path and of the kilometre figures). A hub without an entry gets no name:
        // if the network changes and the path with it, add the new hubs here.
        const ORIGIN_HUB_NAMES = {
            waw: { en: 'Warsaw', vi: 'Warsaw', de: 'Warschau', side: 'top' },
            mow: { en: 'Moscow', vi: 'Moskva', de: 'Moskau', side: 'top' },
            ast: { en: 'Astana', vi: 'Astana', de: 'Astana', side: 'top' },
            urc: { en: 'Ürümqi', vi: 'Urumqi', de: 'Ürümqi', side: 'right' },
            kmg: { en: 'Kunming', vi: 'Côn Minh', de: 'Kunming', side: 'left' },
        };
        const ORIGIN_HUB_NAME_SIDES = {
            top: { dx: 0, dy: -15, anchor: 'middle' },
            bottom: { dx: 0, dy: 27, anchor: 'middle' },
            right: { dx: 14, dy: -2, anchor: 'start' },
            left: { dx: -14, dy: 10, anchor: 'end' },
        };

        const OriginFlagGermany = () => (
            <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" className="shrink-0 rounded-full ring-1 ring-slate-900/10 dark:ring-white/20">
                <rect width="22" height="7.4" fill="#111827" /><rect y="7.3" width="22" height="7.4" fill="#dc2626" /><rect y="14.6" width="22" height="7.4" fill="#fbbf24" />
            </svg>
        );

        const OriginFlagVietnam = () => (
            <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" className="shrink-0 rounded-full ring-1 ring-slate-900/10 dark:ring-white/20">
                <rect width="22" height="22" fill="#dc2626" />
                <polygon fill="#fde047" points="11,5.2 12.4,9.3 16.7,9.3 13.2,11.9 14.5,16 11,13.5 7.5,16 8.8,11.9 5.3,9.3 9.6,9.3" />
            </svg>
        );

        // Origin band: "Made in Germany. Now available in Vietnam." — a route across the map, one card per country
        const OriginSection = ({ content, lang }) => {
            const ui = content.ui;
            const sectionRef = useRef(null);
            const [visible, setVisible] = useState(false);
            useEffect(() => {
                const el = sectionRef.current;
                if (!el) return undefined;
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setVisible(true);
                        observer.disconnect();
                    }
                }, { threshold: 0.25 });
                observer.observe(el);
                return () => observer.disconnect();
            }, []);

            // Loop: once the marker has made RUN_TRIPS trips, the animated layers fade out (RESET_MS) and are
            // remounted under a new key, which restarts every CSS animation from the search wave
            const [cycle, setCycle] = useState(0);
            const [resetting, setResetting] = useState(false);
            useEffect(() => {
                if (!visible) return undefined;
                if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return undefined;
                const RUN_TRIPS = 2;
                const RESET_MS = 800;
                let restart;
                const fade = window.setTimeout(() => {
                    setResetting(true);
                    restart = window.setTimeout(() => {
                        setResetting(false);
                        setCycle((c) => c + 1);
                    }, RESET_MS);
                }, (NETWORK_FADE_S + 0.9 + RUN_TRIPS * MARKER_TRIP_S) * 1000);
                return () => {
                    window.clearTimeout(fade);
                    window.clearTimeout(restart);
                };
            }, [visible, cycle]);

            const cards = [
                { id: 'de', flag: <OriginFlagGermany />, label: ui.origin_de_label, title: 'Made in Germany', facts: ui.origin_de_facts },
                { id: 'vn', flag: <OriginFlagVietnam />, label: ui.origin_vn_label, title: ui.origin_vn_title, facts: ui.origin_vn_facts, badge: ui.origin_vn_badge },
            ];

            // Timeline (seconds): the search wave runs for SEARCH_S, then the shortest path is drawn in PATH_S
            const SEARCH_S = 2.6;
            const PATH_START_S = SEARCH_S + 0.3;
            const PATH_S = 1.5;
            const NETWORK_FADE_S = PATH_START_S + PATH_S + 0.7;   // the rest of the network leaves once the path stands
            const MARKER_TRIP_S = 4.2;                              // one marker trip, as in .lp3-origin-marker
            const { nodes } = ORIGIN_NETWORK;
            const solution = ORIGIN_SOLUTION;
            const perUnit = SEARCH_S / solution.total;
            const from = { x: nodes[ORIGIN_NETWORK.source][0], y: nodes[ORIGIN_NETWORK.source][1] };
            const to = { x: nodes[ORIGIN_NETWORK.target][0], y: nodes[ORIGIN_NETWORK.target][1] };
            const line = (a, b) => `M${nodes[a][0]} ${nodes[a][1]}L${nodes[b][0]} ${nodes[b][1]}`;
            const pathD = `M${solution.path.map((id) => nodes[id].join(' ')).join('L')}`;
            const hubIds = Object.keys(nodes).filter((id) => id !== ORIGIN_NETWORK.source && id !== ORIGIN_NETWORK.target);
            let pathElapsed = 0;
            const pathSegments = solution.pathEdges.map((edge) => {
                const duration = (edge.length / solution.total) * PATH_S;
                const segment = { ...edge, delay: PATH_START_S + pathElapsed, duration };
                pathElapsed += duration;
                return segment;
            });
            const pathArrival = { [ORIGIN_NETWORK.source]: PATH_START_S };
            pathSegments.forEach((segment) => { pathArrival[segment.to] = segment.delay + segment.duration; });

            // Length of each connection on the shortest path, rounded to 100 km because the hub positions are
            // approximate. The figure sits level beside the middle of the visible line, pushed off it just far
            // enough that the text box clears the line whatever its slope.
            const KM_FONT = 17;
            const kmLocale = { en: 'en-US', vi: 'vi-VN', de: 'de-DE' }[lang] || 'en-US';
            const endRadius = (id) => (id === ORIGIN_NETWORK.source || id === ORIGIN_NETWORK.target ? 19 : 6.5);
            const kmLabels = pathSegments.map((segment) => {
                const [x1, y1] = nodes[segment.from];
                const [x2, y2] = nodes[segment.to];
                const span = Math.hypot(x2 - x1, y2 - y1);
                const ux = (x2 - x1) / span;
                const uy = (y2 - y1) / span;
                const middle = (endRadius(segment.from) + span - endRadius(segment.to)) / 2;
                const text = `${(Math.round(segment.length / 100) * 100).toLocaleString(kmLocale)} km`;
                const halfWidth = (text.length * KM_FONT * 0.62) / 2;
                const offset = 9 + halfWidth * Math.abs(uy) + KM_FONT * 0.36 * Math.abs(ux);
                // Above the line, except on the first connection: the country name already stands above Germany
                const up = (ux >= 0 ? 1 : -1) * (segment.from === ORIGIN_NETWORK.source ? -1 : 1);
                return {
                    key: `${segment.from}-${segment.to}`,
                    text,
                    x: x1 + ux * middle + uy * up * offset,
                    y: y1 + uy * middle - ux * up * offset,
                    delay: segment.delay + segment.duration,
                };
            });

            return (
                <section ref={sectionRef} aria-labelledby="origin-title" className={`lp3-origin rounded-3xl border ${visible ? 'is-visible' : ''} ${resetting ? 'is-resetting' : ''}`}>
                    <div className="relative z-10 text-center px-6 pt-10 sm:px-10 md:pt-14">
                        <p className="text-[10px] md:text-[11px] font-bold uppercase opus-eyebrow text-brand-gold mb-3 md:mb-4">{ui.origin_eyebrow}</p>
                        {/* "Made in Germany" stays English in every language: it is a recognised label */}
                        <h2 id="origin-title" className="text-[1.75rem] sm:text-4xl md:text-[2.75rem] font-bold tracking-tight leading-[1.15] md:leading-[1.12] text-slate-900 dark:text-white">
                            <span className="block">Made in Germany.</span>
                            <span className="block opus-sheen pb-[0.14em] -mb-[0.14em]">{ui.origin_title_b}</span>
                        </h2>
                    </div>

                    <div className="relative mt-4 md:-mt-4">
                        <svg
                            viewBox={`0 0 ${ORIGIN_MAP.width} ${ORIGIN_MAP.height}`}
                            role="img"
                            aria-label={ui.origin_map_alt}
                            className="relative block w-full h-auto"
                        >
                            <defs>
                                <linearGradient id="lp3-origin-arc-grad" gradientUnits="userSpaceOnUse" x1={from.x} y1={from.y} x2={to.x} y2={to.y}>
                                    <stop offset="0" className="lp3-origin-stop-edge" />
                                    <stop offset="0.5" className="lp3-origin-stop-mid" />
                                    <stop offset="1" className="lp3-origin-stop-edge" />
                                </linearGradient>
                            </defs>
                            <path className="lp3-origin-dots" d={ORIGIN_MAP.land} />
                            <path className="lp3-origin-dots" d={ORIGIN_MAP.germany} />
                            <path className="lp3-origin-dots" d={ORIGIN_MAP.vietnam} />

                            {/* Animated layer under the country markers; remounted on every loop */}
                            <g key={`run-a-${cycle}`} className="lp3-origin-run">
                            {/* Everything that is not the answer: all connections, the search wave and the hubs off the path.
                                Once the shortest path is drawn, this group fades away and only the path remains. */}
                            <g className="lp3-origin-network" style={{ animationDelay: `${NETWORK_FADE_S.toFixed(2)}s` }}>
                                {/* 1. the network */}
                                {ORIGIN_NETWORK.edges.map(([a, b]) => (
                                    <path key={`${a}-${b}`} className="lp3-origin-edge" d={line(a, b)} />
                                ))}

                                {/* 2. the search wave, timed by Dijkstra's distances */}
                                {solution.scanned.map((edge) => (
                                    <path
                                        key={`scan-${edge.from}-${edge.to}`}
                                        className="lp3-origin-scan"
                                        d={line(edge.from, edge.to)}
                                        pathLength="1"
                                        style={{ animationDelay: `${(edge.start * perUnit).toFixed(2)}s`, animationDuration: `${(edge.length * perUnit).toFixed(2)}s` }}
                                    />
                                ))}

                                {hubIds.filter((id) => pathArrival[id] === undefined).map((id) => {
                                    const visited = solution.settled.has(id);
                                    return (
                                        <circle
                                            key={id}
                                            className={`lp3-origin-node ${visited ? 'lp3-origin-node--visited' : ''}`}
                                            cx={nodes[id][0]}
                                            cy={nodes[id][1]}
                                            r="6.5"
                                            style={visited ? { animationDelay: `${(solution.dist[id] * perUnit).toFixed(2)}s` } : undefined}
                                        />
                                    );
                                })}
                            </g>

                            {/* 3. the shortest path and its hubs, which stay */}
                            {pathSegments.map((segment) => (
                                <path
                                    key={`path-${segment.from}-${segment.to}`}
                                    className="lp3-origin-path"
                                    d={line(segment.from, segment.to)}
                                    pathLength="1"
                                    style={{ animationDelay: `${segment.delay.toFixed(2)}s`, animationDuration: `${segment.duration.toFixed(2)}s` }}
                                />
                            ))}
                            {hubIds.filter((id) => pathArrival[id] !== undefined).map((id) => (
                                <circle
                                    key={id}
                                    className="lp3-origin-node lp3-origin-node--path"
                                    cx={nodes[id][0]}
                                    cy={nodes[id][1]}
                                    r="6.5"
                                    style={{ animationDelay: `${(solution.dist[id] * perUnit).toFixed(2)}s, ${pathArrival[id].toFixed(2)}s` }}
                                />
                            ))}
                            </g>

                            {[from, to].map((point, i) => (
                                <g key={i}>
                                    <circle className={`lp3-origin-pulse ${i ? 'lp3-origin-pulse--late' : ''}`} cx={point.x} cy={point.y} r="19" />
                                    <circle className="lp3-origin-ring" cx={point.x} cy={point.y} r="19" />
                                    <circle className="lp3-origin-point" cx={point.x} cy={point.y} r="9" />
                                </g>
                            ))}

                            {/* Place names. The map scales with the screen, so phones get their own, larger type:
                                50 map units is about 11px on a phone-width map, 21 units about 16px on desktop */}
                            <g className="hidden md:block font-mono lp3-origin-place" fontSize="21" fontWeight="700" letterSpacing="3.5">
                                {/* Centred over Germany. A long name ("DEUTSCHLAND") is right-aligned instead, so that
                                    it stays clear of the first hub's name */}
                                {String(ui.origin_de_place).length > 7
                                    ? <text x={from.x + 40} y={from.y - 36} textAnchor="end">{String(ui.origin_de_place).toUpperCase()}</text>
                                    : <text x={from.x} y={from.y - 36} textAnchor="middle">{String(ui.origin_de_place).toUpperCase()}</text>}
                                <text x={to.x + 36} y={to.y + 8}>{String(ui.origin_vn_place).toUpperCase()}</text>
                            </g>
                            <g className="md:hidden font-mono lp3-origin-place" fontSize="50" fontWeight="700" letterSpacing="5">
                                <text x={from.x} y={from.y - 44} textAnchor="middle">{String(ui.origin_de_place).toUpperCase()}</text>
                                <text x={to.x + 40} y={to.y + 18}>{String(ui.origin_vn_place).toUpperCase()}</text>
                            </g>

                            {/* The route is the answer on a simplified network, not a real freight route: say so (desktop; phones get it under the map).
                                Outside the looping layers, so it stays put while the animation restarts */}
                            <g className="hidden md:block font-mono lp3-origin-note" fontSize="19" fontWeight="700" letterSpacing="1.4">
                                <text x="96" y="440">{String(ui.origin_map_note).toUpperCase()}</text>
                                <text x="96" y="470" fontSize="16.5" fontWeight="500" letterSpacing="0.6" className="lp3-origin-note-detail">{ui.origin_map_note_detail}</text>
                            </g>

                            {/* Animated layer above the place names: marker, hub names and distances; remounted on every loop */}
                            <g key={`run-b-${cycle}`} className="lp3-origin-run">
                            <circle
                                className="lp3-origin-marker"
                                r="6.5"
                                style={{ offsetPath: `path('${pathD}')`, animationDelay: `${(NETWORK_FADE_S + 0.9).toFixed(2)}s` }}
                            />

                            {/* Hub names on the shortest path: desktop only, each appears when the path reaches its hub */}
                            <g className="hidden md:block font-mono" fontSize="15" fontWeight="700" letterSpacing="2">
                                {solution.path.filter((id) => ORIGIN_HUB_NAMES[id]).map((id) => {
                                    const hub = ORIGIN_HUB_NAMES[id];
                                    const side = ORIGIN_HUB_NAME_SIDES[hub.side];
                                    return (
                                        <text
                                            key={id}
                                            className="lp3-origin-hub-name"
                                            x={nodes[id][0] + side.dx}
                                            y={nodes[id][1] + side.dy}
                                            textAnchor={side.anchor}
                                            style={{ animationDelay: `${pathArrival[id].toFixed(2)}s` }}
                                        >{String(hub[lang] || hub.en).toUpperCase()}</text>
                                    );
                                })}
                            </g>

                            {/* Connection lengths: desktop only, the lines are too short for figures on a phone */}
                            <g className="hidden md:block font-mono" fontSize={KM_FONT} fontWeight="700" textAnchor="middle" dominantBaseline="central">
                                {kmLabels.map((label) => (
                                    <text key={label.key} className="lp3-origin-km" x={label.x.toFixed(1)} y={label.y.toFixed(1)} style={{ animationDelay: `${label.delay.toFixed(2)}s` }}>{label.text}</text>
                                ))}
                            </g>
                            </g>
                        </svg>
                        <p className="md:hidden px-6 -mt-1 mb-3 text-center font-mono text-[10px] leading-relaxed text-slate-500 dark:text-slate-400">
                            <span className="font-bold uppercase tracking-wider">{ui.origin_map_note}</span>
                            <br />{ui.origin_map_note_detail}
                        </p>
                    </div>

                    <div className="relative z-10 grid md:grid-cols-2 gap-4 md:gap-6 px-5 pb-6 pt-4 sm:px-8 md:px-12 md:pb-12 md:pt-0">
                        {cards.map((card) => (
                            <div key={card.id} className={`lp3-origin-card rounded-2xl p-6 md:p-7 ${card.badge ? 'lp3-origin-card--new' : ''}`}>
                                <div className="flex items-center gap-2.5 mb-3">
                                    {card.flag}
                                    <span className="text-[10px] font-bold uppercase tracking-widest text-slate-500 dark:text-slate-400">{card.label}</span>
                                    {card.badge && (
                                        <span className="ml-auto inline-flex items-center rounded-full bg-brand-gold/15 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-amber-700 dark:text-brand-gold ring-1 ring-brand-gold/40 dark:ring-brand-gold/30">{card.badge}</span>
                                    )}
                                </div>
                                <h3 className="text-xl md:text-2xl font-bold tracking-tight text-slate-900 dark:text-white mb-4">{card.title}</h3>
                                <ul className="space-y-2.5">
                                    {card.facts.map((fact, i) => (
                                        <li key={i} className="flex items-start gap-2.5 text-sm md:text-[0.95rem] leading-snug text-slate-600 dark:text-slate-300">
                                            <span className="mt-0.5 shrink-0 text-brand-gold [&>svg]:h-[1.05rem] [&>svg]:w-[1.05rem]" aria-hidden="true"><CheckCircleIcon /></span>
                                            <span>{fact}</span>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        ))}
                    </div>
                </section>
            );
        };

        // Teaser for the background page (why-aps.html), where the three teaching sections now live
        const WhyApsTeaser = ({ content }) => {
            const ui = content.ui;
            const labels = {
                'industry-40': ui.nav_industry_40,
                'analytics': ui.nav_analytics,
                'proof-foundation': ui.nav_mathematical_foundation,
            };
            return (
                <div className="grid lg:grid-cols-12 gap-8 lg:gap-12 items-center rounded-3xl border border-slate-200/80 dark:border-slate-800 bg-white/45 dark:bg-slate-900/35 backdrop-blur-sm px-6 py-10 sm:px-10 md:px-12 md:py-14">
                    <div className="lg:col-span-7">
                        <SectionHeading className="!mb-0" eyebrow={ui.whyaps_eyebrow} title={ui.i4l_title} desc={ui.whyaps_teaser_body} />
                        <a
                            href="./why-aps"
                            className="inline-flex items-center gap-2 mt-7 md:mt-8 px-7 py-3.5 rounded-xl bg-brand-gold text-white text-sm md:text-base font-bold shadow-lg shadow-brand-gold/20 hover:bg-amber-600 hover:shadow-brand-gold/40 hover:scale-[1.02] active:scale-95 transition-all"
                        >
                            {ui.whyaps_teaser_cta} <ArrowRightIcon />
                        </a>
                    </div>
                    <ul className="lg:col-span-5 space-y-3">
                        {ui.whyaps_teaser_items.map((item, i) => (
                            <li key={item.id}>
                                <a
                                    href={`./why-aps#${item.id}`}
                                    className="group flex items-center gap-4 rounded-2xl border border-slate-200 dark:border-white/10 bg-white/80 dark:bg-slate-900/50 px-5 py-4 hover:border-brand-gold/50 transition-colors"

        const App = () => {
            const [theme, setThemeState] = useState(() => window.getOperartisTheme());

                if (typeof window.setOperartisTheme === 'function') {
                    window.setOperartisTheme(next);
                } else {
                    window.persistOperartisTheme?.(next);
                    window.applyOperartisThemeClass?.(next);
                    setThemeState(next);

            }, []);

            useEffect(() => {
                const handler = (event) => {
                    setThemeState((event.detail && event.detail.theme) || window.getOperartisTheme());
                };
                window.addEventListener('operartis:theme-change', handler);
                return () => window.removeEventListener('operartis:theme-change', handler);
            }, []);
            const [lang, setLang] = useState(() => window.getOperartisLang());
            useEffect(() => {
                const handler = (event) => {

                window.addEventListener('operartis:lang-change', handler);
                return () => window.removeEventListener('operartis:lang-change', handler);
            }, []);
            const [selectedBlock, setSelectedBlock] = useState(null);
            const [activeQuickViewBlockId, setActiveQuickViewBlockId] = useState(null);
            const [mobileNavOpen, setMobileNavOpen] = useState(false);
            const [navCollapsed, setNavCollapsed] = useState(false);
            const [activeNavId, setActiveNavId] = useState(() => window.OperartisNavIndicator?.navIdFromLocation?.() || null);
            const [authUser, setAuthUser] = useState(() => window.OperartisAuth?.getUser?.() || null);
            const [accountMenuOpen, setAccountMenuOpen] = useState(false);
            const headerNavRef = useRef(null);
            const accountMenuRef = useRef(null);
            const initialHashNavId = typeof window.OperartisNavIndicator?.navIdFromLocation === 'function'
                ? window.OperartisNavIndicator.navIdFromLocation()
                : null;
            const scrollLockRef = useRef(!!(initialHashNavId && initialHashNavId !== 'contact'));
            const pinnedNavIdRef = useRef(initialHashNavId && initialHashNavId !== 'contact' ? initialHashNavId : null);
            const pinnedScrollTopRef = useRef(null);
            const scrollEndTimerRef = useRef(null);
            const scrollAnimListenerRef = useRef(null);
            const scrollRetryTimersRef = useRef([]);
            const scrollAnimCancelRef = useRef(null);

            // Derived Content
            const content = TRANSLATIONS[lang] || TRANSLATIONS.en;

            // On the Why APS and Platform pages the page's own menu tab stays lit, even above the first section
            const menuActiveId = activeNavId || (PAGE === 'why-aps' ? 'why-aps-top' : PAGE === 'platform' ? 'matrix-fit' : null);

            const pageNavItems = useMemo(
                () => buildPageNavItems(content.ui, content.matrix),
                [content]
            );

            const format = window.OperartisFormat.forLanguage(lang);

            // Derived stats for hero console + metrics band
            const stats = useMemo(() => {
                const liveCount = Object.values(MODULE_STATIC_DATA).filter(m => m.status === 'live').length;
                const totalModules = Object.keys(MODULE_STATIC_DATA).length;
                const horizonCount = content.matrix.length;
                const blockCount = content.matrix.reduce((n, h) => n + h.blocks.length, 0);
                return [
                    { value: format.number(liveCount, 0, 0), label: content.ui.stat_live },
                    { value: format.number(horizonCount, 0, 0), label: content.ui.stat_horizons },
                    { value: format.number(blockCount, 0, 0), label: content.ui.stat_blocks },
                    { value: format.number(totalModules, 0, 0), label: content.ui.stat_engines },
                ];
            }, [content, lang]);

            const getAnchorOffset = useCallback(() => {
                const headerH = headerNavRef.current?.closest('nav')?.offsetHeight ?? 72;
                // Extra gap so the section heading sits fully below the header.
                // Safari/WebKit often undershoots overflow-container scroll by ~1 header row.
                return headerH + (needsWebKitSectionScrollFix() ? 28 : 12);
            }, []);

            const getSectionList = useCallback(() => {
                const sections = [
                    { id: 'supply-chain', el: document.getElementById('supply-chain') },
                    { id: 'proof-foundation', el: document.getElementById('proof-foundation') },
                    { id: 'industry-40', el: document.getElementById('industry-40') },
                    { id: 'analytics', el: document.getElementById('analytics') },
                    ...content.matrix.map(h => ({ id: h.id, el: document.getElementById(`horizon-${h.id}`) })),
                    { id: 'or-process', el: document.getElementById('or-process') },
                ].filter(s => s.el);
                return sections;
            }, [content]);

            const updateActiveFromScroll = useCallback(() => {
                if (scrollLockRef.current) return;
                const scrollRoot = getMainScrollRoot();
                const sections = getSectionList();
                if (!scrollRoot || !sections.length) return;

                const activeId = resolveActiveHorizonId(sections, scrollRoot, getAnchorOffset());
                const pinned = pinnedNavIdRef.current;
                if (pinned) {
                    const drift = Math.abs(scrollRoot.scrollTop - (pinnedScrollTopRef.current ?? scrollRoot.scrollTop));
                    if (drift < 64) {
                        if (activeId === pinned) pinnedNavIdRef.current = null;
                        return;
                    }
                    pinnedNavIdRef.current = null;
                }
                setActiveNavId(activeId);
            }, [getSectionList, getAnchorOffset]);

            const scrollToNavItem = useCallback((id) => {
                if (id === 'about' || id === 'about-why') {
                    const href = id === 'about-why' ? './about#about-why' : './about';
                    if (typeof window.OperartisNavIndicator?.go === 'function') {
                        window.OperartisNavIndicator.go(href);
                    } else {
                        window.location.href = href;
                    }
                    return;
                }
                if (id === 'contact') {
                    if (typeof window.OperartisNavIndicator?.go === 'function') {
                        window.OperartisNavIndicator.go('./contact');
                    } else {
                        window.location.href = './contact';
                    }
                    return;
                }

                // The section lives on another landing page: go there, its hash scrolls to the section
                const targetPage = navPageOf(id);
                if (targetPage !== PAGE) {
                    const href = PAGE_TOP_NAV_IDS.includes(id) ? PAGE_HREF[targetPage] : `${PAGE_HREF[targetPage]}#${getNavTargetId(id)}`;
                    if (typeof window.OperartisNavIndicator?.go === 'function') {
                        window.OperartisNavIndicator.go(href);
                    } else {
                        window.location.href = href;
                    }
                    return;
                }

                const scrollRoot = getMainScrollRoot();
                const el = document.getElementById(getNavTargetId(id));
                if (!scrollRoot || !el) {
                    scrollLockRef.current = false;
                    return;
                }

                scrollRetryTimersRef.current.forEach((timer) => clearTimeout(timer));
                scrollRetryTimersRef.current = [];
                if (scrollAnimCancelRef.current) {
                    scrollAnimCancelRef.current();
                    scrollAnimCancelRef.current = null;
                }

                scrollLockRef.current = true;
                pinnedNavIdRef.current = id;
                setActiveNavId(id);

                const measureTop = () => {
                    const marginTop = parseFloat(window.getComputedStyle(el).marginTop) || 0;
                    return Math.max(0, getSectionTopInRoot(el, scrollRoot) - getAnchorOffset() - marginTop);
                };

                const distance = Math.abs(measureTop() - scrollRoot.scrollTop);
                const duration = Math.max(420, Math.min(920, 280 + distance * 0.32));
                const anim = animateScrollRootTo(scrollRoot, measureTop, duration);
                scrollAnimCancelRef.current = anim.cancel;
                pinnedScrollTopRef.current = measureTop();

                if (scrollEndTimerRef.current) clearTimeout(scrollEndTimerRef.current);
                if (scrollAnimListenerRef.current) {
                    scrollRoot.removeEventListener('scroll', scrollAnimListenerRef.current);
                    scrollAnimListenerRef.current = null;
                }

                anim.promise.then((finalTop) => {
                    if (pinnedNavIdRef.current !== id) return;
                    scrollAnimCancelRef.current = null;
                    pinnedScrollTopRef.current = finalTop;
                    scrollLockRef.current = false;
                    const resolved = resolveActiveHorizonId(getSectionList(), scrollRoot, getAnchorOffset());
                    if (resolved === id) pinnedNavIdRef.current = null;
                    else setActiveNavId(id);
                });
            }, [getAnchorOffset, getSectionList]);

            const scrollToId = useCallback((id) => {
                if (id === 'contact') {
                    scrollToNavItem('contact');
                    return;
                }
                if (['proof-foundation', 'supply-chain', 'industry-40', 'analytics', 'about', 'about-why', 'platform'].includes(id)) {
                    scrollToNavItem(id === 'platform' ? 'strategic' : id);
                    return;
                }
                scrollToNavItem(id);
            }, [scrollToNavItem]);

            const didHashScrollRef = useRef(false);
            useLayoutEffect(() => {
                if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
            }, []);

            useEffect(() => {
                if (didHashScrollRef.current) return;
                const id = window.OperartisNavIndicator?.navIdFromLocation?.();
                if (!id || id === 'contact') return;
                didHashScrollRef.current = true;
                let innerRaf = 0;
                const outerRaf = requestAnimationFrame(() => {
                    innerRaf = requestAnimationFrame(() => scrollToNavItem(id));
                });
                return () => {
                    cancelAnimationFrame(outerRaf);
                    cancelAnimationFrame(innerRaf);
                };
            }, [scrollToNavItem]);

            useEffect(() => {
                window.persistOperartisLang(lang);
                document.documentElement.lang = lang;
                const pageTitle = PAGE === 'why-aps' ? content.ui.whyaps_page_title
                    : PAGE === 'platform' ? content.ui.platform_page_title
                    : content.ui.page_title;
                document.title = pageTitle || TRANSLATIONS.en.ui.page_title;
            }, [lang, content]);

            useEffect(() => {
                const handleAuthState = (event) => {
                    const user = event.detail?.user || window.OperartisAuth?.getUser?.() || null;
                    setAuthUser(user);
                    if (user) setAccountMenuOpen(false);
                };
                const handleLoggedOut = () => {
                    setAuthUser(null);
                    setAccountMenuOpen(false);
                };
                window.addEventListener('operartis:authenticated', handleAuthState);
                window.addEventListener('operartis:auth-state', handleAuthState);
                window.addEventListener('operartis:logged-out', handleLoggedOut);
                window.OperartisAuth?.refresh?.().catch(() => setAuthUser(null));
                return () => {
                    window.removeEventListener('operartis:authenticated', handleAuthState);
                    window.removeEventListener('operartis:auth-state', handleAuthState);
                    window.removeEventListener('operartis:logged-out', handleLoggedOut);
                };
            }, []);

            // Scroll-spy: sync header nav highlight with section position in main scroll container
            useEffect(() => {
                const scrollRoot = getMainScrollRoot();
                if (!scrollRoot) return undefined;

                const onScroll = () => requestAnimationFrame(updateActiveFromScroll);
                scrollRoot.addEventListener('scroll', onScroll, { passive: true });

                let navObserver;
                if (typeof ResizeObserver !== 'undefined' && headerNavRef.current) {
                    const navEl = headerNavRef.current.closest('nav');
                    if (navEl) {
                        navObserver = new ResizeObserver(() => requestAnimationFrame(updateActiveFromScroll));
                        navObserver.observe(navEl);
                    }
                }

                requestAnimationFrame(updateActiveFromScroll);

                return () => {
                    scrollRoot.removeEventListener('scroll', onScroll);
                    if (navObserver) navObserver.disconnect();
                    if (scrollEndTimerRef.current) clearTimeout(scrollEndTimerRef.current);
                    scrollRetryTimersRef.current.forEach((timer) => clearTimeout(timer));
                    scrollRetryTimersRef.current = [];
                    if (scrollAnimCancelRef.current) {
                        scrollAnimCancelRef.current();
                        scrollAnimCancelRef.current = null;
                    }
                };
            }, [content, updateActiveFromScroll]);

            const toggleTheme = () => {
                if (theme === 'system') setTheme('light');
                else if (theme === 'light') setTheme('dark');
                else setTheme('system');
            };

            // The language button steps through English, Vietnamese and German
            const toggleLang = () => {
                const order = ['en', 'vi', 'de'];
                setLang(prev => order[(order.indexOf(prev) + 1) % order.length]);
            };

            const handleBlockClick = (block) => {
                setSelectedBlock(block);
            };

            const handleCloseModal = () => {
                setSelectedBlock(null);
            };

            const resetMatrixBlocks = useCallback(() => {
                setActiveQuickViewBlockId(null);
                setSelectedBlock(null);
            }, []);

            const closeMobileNav = useCallback(() => {
                setMobileNavOpen(false);
            }, []);

            const handleNavCollapse = useCallback((collapsed) => {
                setNavCollapsed(collapsed);
            }, []);

            const handleAuthButtonClick = useCallback(() => {
                setAccountMenuOpen(prev => !prev);
            }, []);

            const handleDashboardOpen = useCallback(() => {
                setAccountMenuOpen(false);
                const canUseAdminDashboard = authUser?.role === 'owner' || authUser?.role === 'admin';
                window.location.href = canUseAdminDashboard ? './dashboard.html#admin-overview' : './dashboard.html';
            }, [authUser]);

            const handleLoginOpen = useCallback(() => {
                setAccountMenuOpen(false);
                window.OperartisAuth?.showLogin?.();
            }, []);

            const handleLogout = useCallback(async () => {
                setAccountMenuOpen(false);
                await window.OperartisAuth?.logout?.();
                setAuthUser(null);
            }, []);

            useEffect(() => {
                if (!accountMenuOpen) return undefined;

                const handleOutsideClick = (event) => {
                    if (!accountMenuRef.current || accountMenuRef.current.contains(event.target)) return;
                    setAccountMenuOpen(false);
                };
                const handleEscape = (event) => {
                    if (event.key === 'Escape') setAccountMenuOpen(false);
                };

                document.addEventListener('mousedown', handleOutsideClick);
                document.addEventListener('touchstart', handleOutsideClick, { passive: true });
                document.addEventListener('keydown', handleEscape);
                return () => {
                    document.removeEventListener('mousedown', handleOutsideClick);
                    document.removeEventListener('touchstart', handleOutsideClick);
                    document.removeEventListener('keydown', handleEscape);
                };
            }, [accountMenuOpen]);

            useEffect(() => {
                if (!navCollapsed) setMobileNavOpen(false);
            }, [navCollapsed]);

            useEffect(() => {
                const isTouchUi = () => window.matchMedia('(hover: none), (pointer: coarse)').matches;

                const onOutsideTouch = (e) => {
                    if (!isTouchUi()) return;
                    const target = e.target;
                    if (!(target instanceof Element)) return;
                    if (target.closest('.touch-open-card')) return;
                    if (target.closest('.modal-content')) return;
                    if (target.closest('.mobile-nav-panel')) return;
                    resetMatrixBlocks();
                };

                document.addEventListener('touchstart', onOutsideTouch, { passive: true });
                return () => document.removeEventListener('touchstart', onOutsideTouch);
            }, [resetMatrixBlocks]);

            return (
                <div className="h-full flex flex-col relative bg-white dark:bg-[#020617] transition-colors duration-500">
                    <LandingCanvasBackground theme={theme} />

                    <nav className="header-bar relative z-30 shrink-0 overflow-visible border-b border-slate-200/50 dark:border-slate-800/50">
                        <div className="max-w-7xl mx-auto w-full h-16 px-3 sm:px-6 md:px-10 flex items-center gap-2 md:gap-4 overflow-visible">
                        <div className="header-glass-pill header-glass-pill--wide header-glass-pill--brand">
                            <a href="./" className="header-brand inline-flex items-center gap-2 sm:gap-3">
                                <OperartisLogoMark className="h-8 w-8 md:h-10 md:w-10" />
                                <span className="font-bold text-sm sm:text-base md:text-lg tracking-tight text-slate-900 dark:text-white leading-none">OPERARTIS</span>
                            </a>
                        </div>

                        <HeaderNav
                            navRef={headerNavRef}
                            items={pageNavItems}
                            activeId={menuActiveId}
                            onNav={scrollToNavItem}
                            onCollapseChange={handleNavCollapse}
                        />

                        {navCollapsed && (
                            <div className="ml-auto shrink-0 header-glass-pill">
                                <button
                                    type="button"
                                    onClick={() => setMobileNavOpen(true)}
                                    aria-expanded={mobileNavOpen}
                                    aria-label={content.ui.nav_open}
                                    className="header-util-btn h-8 w-8 p-0"
                                >
                                    <span className="header-util-icon" aria-hidden="true"><MenuIcon /></span>
                                </button>
                            </div>
                        )}

                        <div className="flex items-center gap-1.5 md:gap-6 shrink-0">
                            <div className="hidden md:flex header-glass-pill header-glass-pill--wide items-center">
                                {/* Theme Toggle — default system; cycle: system → light → dark → system */}
                                <button
                                    onClick={toggleTheme}
                                    className="header-util-btn"
                                    title={theme === 'light' ? 'Light mode — click for dark' : theme === 'dark' ? 'Dark mode — click for system' : 'System theme — follows OS — click for light'}
                                >
                                    <span className="header-util-icon" aria-hidden="true">
                                        {theme === 'light' ? <SunIcon /> : theme === 'dark' ? <MoonIcon /> : <SystemIcon />}
                                    </span>
                                </button>

                                <span className="w-px h-4 shrink-0 self-center bg-slate-200 dark:bg-slate-700/50" aria-hidden="true" />

                                {/* Language Toggle */}
                                <button onClick={toggleLang} className="header-util-btn gap-1 font-mono text-xs font-bold px-2">
                                    <span className="header-util-icon" aria-hidden="true"><GlobeIcon /></span>
                                    <span>{lang.toUpperCase()}</span>
                                </button>
                            </div>

                            <div className="flex md:hidden items-center gap-1.5">
                                <div className="header-glass-pill max-[359px]:hidden">
                                    <button
                                        onClick={toggleTheme}
                                        className="header-util-btn h-8 w-8 p-0"
                                        title={theme === 'light' ? 'Light mode — click for dark' : theme === 'dark' ? 'Dark mode — click for system' : 'System theme — follows OS — click for light'}
                                    >
                                        <span className="header-util-icon" aria-hidden="true">
                                            {theme === 'light' ? <SunIcon /> : theme === 'dark' ? <MoonIcon /> : <SystemIcon />}
                                        </span>
                                    </button>
                                </div>
                                <div className="header-glass-pill">
                                    <button onClick={toggleLang} className="header-util-btn h-8 w-8 p-0" aria-label={`Language: ${lang.toUpperCase()}`}>
                                        <span className="header-util-icon" aria-hidden="true"><GlobeIcon /></span>
                                    </button>
                                </div>
                            </div>

                            <div ref={accountMenuRef} className="relative shrink-0">
                                <button
                                    type="button"
                                    onClick={handleAuthButtonClick}
                                    aria-expanded={accountMenuOpen}
                                    aria-haspopup="menu"
                                    aria-label={authUser ? `Account: ${accountDisplayName(authUser)}` : content.ui.nav_login}
                                    title={authUser ? accountDisplayName(authUser) : content.ui.nav_login}
                                    className="relative header-auth-btn header-auth-btn--gold h-9 w-9 rounded-full bg-gradient-to-tr from-brand-gold to-brand-dark flex items-center justify-center text-white shrink-0"
                                >
                                    <AccountAvatar user={authUser} />
                                    <span className={`absolute -right-0.5 -top-0.5 h-3 w-3 rounded-full border-2 border-[#020617] ${authUser ? 'bg-emerald-400 shadow-[0_0_0_2px_rgba(52,211,153,0.28),0_0_12px_rgba(52,211,153,0.9)]' : 'bg-white shadow-[0_0_0_1px_rgba(255,255,255,0.45)]'}`} aria-hidden="true" />
                                </button>

                                {accountMenuOpen && (
                                    <div
                                        role="menu"
                                        aria-label={content.ui.nav_account_menu}
                                        className="index-account-menu"
                                    >
                                        {authUser && (
                                            <div className="index-account-menu-head">
                                                <p className="index-account-menu-email">{accountDisplayName(authUser)}</p>
                                                <p className="index-account-menu-role">{authUser.role}</p>
                                            </div>
                                        )}
                                        <div className="index-account-menu-body">
                                            <button
                                                type="button"
                                                role="menuitem"
                                                onClick={handleDashboardOpen}
                                                className="index-account-menu-item"
                                            >
                                                <span className="index-account-menu-item-icon" aria-hidden="true"><AccountDashboardIcon /></span>
                                                <span>{content.ui.nav_dashboard}</span>
                                            </button>
                                            <div className="index-account-menu-divider" role="separator" aria-hidden="true" />
                                            {authUser ? (
                                                <button
                                                    type="button"
                                                    role="menuitem"
                                                    onClick={handleLogout}
                                                    className="index-account-menu-item index-account-menu-item--danger"
                                                >
                                                    <span className="index-account-menu-item-icon" aria-hidden="true"><AccountLogoutIcon /></span>
                                                    <span>{content.ui.nav_logout}</span>
                                                </button>
                                            ) : (
                                                <button
                                                    type="button"
                                                    role="menuitem"
                                                    onClick={handleLoginOpen}
                                                    className="index-account-menu-item"
                                                >
                                                    <span className="index-account-menu-item-icon" aria-hidden="true"><AccountLoginIcon /></span>
                                                    <span>{content.ui.nav_login}</span>
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                        </div>
                    </nav>

                    <MobileNavDrawer
                        items={pageNavItems}
                        activeId={menuActiveId}
                        onNav={scrollToNavItem}
                        open={mobileNavOpen}
                        onClose={closeMobileNav}
                        content={content}
                    />

                    <main className="flex-1 overflow-y-auto overflow-x-hidden z-10 w-full min-h-0 [scroll-padding-top:5.25rem]">
                        <div className="max-w-7xl mx-auto w-full px-4 sm:px-6 md:px-10 py-8 md:py-12 flex flex-col">
                            {/* One source, three pages: index.html (home), why-aps.html and platform.html. See PAGE at the top of this script. */}
                            {PAGE === 'home' && (
                                <>
                                    <Reveal>
                                        <HeroSection content={content} onExplore={() => scrollToId('platform-overview')} onWhy={() => scrollToId('about-why')} />
                                    </Reveal>

                                    <div className="mt-8 md:mt-10">
                                        <CapabilityRibbon content={content} />
                                    </div>

                                    {/* Companies Operartis works with, right under the hero */}
                                    <div id="partners" className="opus-scroll-target mt-14 md:mt-20">
                                        <PartnersSection content={content} />
                                    </div>

                                    <div className="mt-20 md:mt-28">
                                        <Reveal><MetricsBand content={content} stats={stats} /></Reveal>
                                    </div>

                                    {/* Where the product comes from and where it is now available */}
                                    <div className="mt-24 md:mt-32">
                                        <Reveal><OriginSection content={content} lang={lang} /></Reveal>
                                    </div>

                                    <div className="mt-24 md:mt-32">
                                        <Reveal><DecisionsSection content={content} /></Reveal>
                                    </div>

                                    <div id="supply-chain" className="opus-scroll-target mt-24 md:mt-32">
                                        <Reveal><SectionHeading eyebrow={content.ui.sc_eyebrow} title={content.ui.sc_title} /></Reveal>
                                        <Reveal delay={100}><SupplyChainFlow content={content} onOpenCatalogue={() => scrollToId('matrix-fit')} /></Reveal>
                                    </div>

                                    {/* The teaching sections (ERP/MES, analytics levels, proof) live on why-aps.html */}
                                    <div className="mt-24 md:mt-32">
                                        <Reveal><WhyApsTeaser content={content} /></Reveal>
                                    </div>

                                    {/* Target of the hero's Explore button. The full matrix lives on platform.html */}
                                    <div id="platform-overview" className="opus-scroll-target mt-24 md:mt-32">
                                        <PlatformOverview content={content} />
                                    </div>

                                    {/* The systems Operartis plugs into, before the deployment process */}
                                    <div id="integrations" className="opus-scroll-target mt-24 md:mt-32">
                                        <IntegrationsSection content={content} />
                                    </div>

                                    <div id="or-process" className="opus-scroll-target mt-24 md:mt-32">
                                        <Reveal><SectionHeading eyebrow={content.ui.or_process_eyebrow} title={content.ui.or_process_title} desc={content.ui.or_process_subtitle} /></Reveal>
                                        <Reveal delay={100}><OrProcessSection content={content} /></Reveal>
                                    </div>

                                    {/* Q&A: the last questions before the closing call to action */}
                                    <div id="faq" className="opus-scroll-target mt-24 md:mt-32">
                                        <Reveal><FaqSection content={content} onScrollTo={scrollToId} /></Reveal>
                                    </div>
                                </>
                            )}

                            {PAGE === 'why-aps' && (
                                <>
                                    {/* Page header: larger and centred, so it reads as the page title above the left-aligned section titles */}
                                    <Reveal>
                                        <div id="why-aps-top" className="pt-4 sm:pt-8 md:pt-12 text-center max-w-4xl mx-auto">
                                            <p className="text-[10px] md:text-[11px] font-bold uppercase opus-eyebrow text-brand-gold mb-4 md:mb-5">{content.ui.whyaps_eyebrow}</p>
                                            <h1 className="text-[2.25rem] sm:text-5xl lg:text-6xl font-black text-slate-900 dark:text-white tracking-tight leading-[1.1]">{content.ui.whyaps_title}</h1>
                                            <p className="mt-5 md:mt-6 text-base sm:text-lg md:text-xl text-slate-600 dark:text-slate-300 leading-relaxed max-w-2xl mx-auto">{content.ui.whyaps_desc}</p>
                                            <div className="mt-7 md:mt-8 flex flex-wrap items-center justify-center gap-2.5">
                                                {[
                                                    { id: 'industry-40', label: content.ui.nav_industry_40 },
                                                    { id: 'analytics', label: content.ui.nav_analytics },
                                                    { id: 'proof-foundation', label: content.ui.nav_mathematical_foundation },
                                                ].map((item) => (
                                                    <button
                                                        key={item.id}
                                                        type="button"
                                                        onClick={() => scrollToId(item.id)}
                                                        className="rounded-full border border-slate-300 dark:border-white/15 bg-white/60 dark:bg-white/5 px-4 py-2 text-[11px] font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 hover:border-brand-gold hover:text-brand-gold transition-colors"
                                                    >
                                                        {item.label}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    </Reveal>

                                    <div id="industry-40" className="opus-scroll-target mt-16 md:mt-24">
                                        <Reveal><SectionHeading eyebrow={content.ui.i4l_eyebrow} title={content.ui.i4l_title} /></Reveal>
                                        <SystemIntegrationLoop content={content} />
                                    </div>

                                    <div id="analytics" className="opus-scroll-target mt-24 md:mt-32">
                                        <Reveal><SectionHeading eyebrow={content.ui.analytics_eyebrow} title={content.ui.analytics_title} desc={content.ui.analytics_subtitle} /></Reveal>
                                        <Reveal delay={100}><AnalyticsMaturitySection content={content} /></Reveal>
                                    </div>

                                    <div className="mt-24 md:mt-32">
                                        <Reveal delay={125}><ProofFoundationSection content={content} /></Reveal>
                                    </div>
                                </>
                            )}

                            {PAGE === 'platform' && (
                                <>
                                    {/* The spacing sits on an outer wrapper so a scroll to the target lands on the stage, not on the gap above it */}
                                    <div className="pt-2 md:pt-4">
                                    <div id="matrix-fit" className="opus-scroll-target">
                                    <div id="platform" className="opus-scroll-target">
                                        <MatrixStage
                                            head={(
                                                <div className="lp3-photo-band lp3-photo-band--factory lp3-matrix-head flex items-end min-h-[15rem] md:min-h-[22rem] px-6 py-8 sm:px-10 md:px-14 md:py-12">
                                                    <SectionHeading as="h1" tone="dark" className="!mb-0" eyebrow={content.ui.platform_eyebrow} title={content.ui.platform_title} desc={content.ui.platform_desc} />
                                                </div>
                                            )}
                                        >
                                            {content.matrix.map((horizon, index) => (
                                                <HorizonSection
                                                    key={horizon.id}
                                                    horizon={horizon}
                                                    content={content}
                                                    onBlockClick={handleBlockClick}
                                                    index={index}
                                                    activeQuickViewBlockId={activeQuickViewBlockId}
                                                    onQuickViewActive={setActiveQuickViewBlockId}
                                                />
                                            ))}
                                        </MatrixStage>
                                    </div>
                                    </div>
                                    </div>
                                </>
                            )}

                            <ClosingCta content={content} onNav={scrollToNavItem} />
                        </div>

                        <SiteFooter content={content} onNav={scrollToId} />
                    </main>

                    <ModuleModal
                        block={selectedBlock}
                        content={content}
                        isOpen={!!selectedBlock}
                        onClose={handleCloseModal}
                    />
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>

</html>
