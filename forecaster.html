                    </div>
                </div>
            );
        });

        // --- ZOOMABLE CHART WRAPPER ---
        // Supports: Mouse wheel zoom, pinch-to-zoom, drag to pan, double-click to reset
        const useChartZoom = (dataLength, zoomState) => {
            const [zoomDomain, setZoomDomain] = zoomState;
            const [isDragging, setIsDragging] = useState(false);
            const [dragStart, setDragStart] = useState(null);
            const containerRef = useRef(null);

            useEffect(() => {
                const el = containerRef.current;
                if (!el) return;

                const handleWheel = (e) => {
                    // Use the rendered plot bounds so legends, axes and margins
                    // keep normal scrolling, including after a resize or zoom.
                    const rect = el.querySelector('.recharts-cartesian-grid')?.getBoundingClientRect();
                    if (!rect || rect.width <= 0 || rect.height <= 0 ||
                        e.clientX < rect.left || e.clientX > rect.right ||
                        e.clientY < rect.top || e.clientY > rect.bottom) return;

                    // A native, non-passive listener can cancel scrolling. Keep
                    // consuming the wheel at the zoom limits so the panel stays put.
                    e.preventDefault();
                    e.stopPropagation();
                    const delta = e.deltaY || e.deltaX;
                    if (!delta) return;
                    const cursorRatio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
                    const wantZoomIn = delta < 0;

                    setZoomDomain((prev) => {
                        const last = Math.max(0, dataLength - 1);
                        const minRange = Math.min(last, Math.max(5, Math.floor(dataLength * 0.05)));
                        let start = Math.max(0, Math.min(prev.start, last));
                        let end = Math.max(start, Math.min(prev.end, last));
                        const range = end - start;
                        const zoomFactor = 0.1;

                        if (wantZoomIn && range > minRange) {
                            const reduction = Math.max(1, Math.floor(range * zoomFactor));
                            const leftReduction = Math.floor(reduction * cursorRatio);
                            const rightReduction = reduction - leftReduction;
                            start = Math.min(start + leftReduction, end - minRange);
                            end = Math.max(end - rightReduction, start + minRange);
                        } else if (!wantZoomIn && range < last) {
                            const expansion = Math.max(1, Math.floor(range * zoomFactor));
                            const leftExpansion = Math.floor(expansion * cursorRatio);
                            const rightExpansion = expansion - leftExpansion;
                            start = Math.max(0, start - leftExpansion);
                            end = Math.min(last, end + rightExpansion);
                        }
                        if (end < start) end = start;
                        return { start, end };
                    });
                };

                el.addEventListener('wheel', handleWheel, { passive: false });
                return () => el.removeEventListener('wheel', handleWheel);
            }, [dataLength]);

            const handleMouseDown = (e) => {
                if (e.button === 0) { // Left click only
                    setIsDragging(true);
                    setDragStart({ x: e.clientX, domain: { ...zoomDomain } });
                }
            };

            const handleMouseMove = (e) => {
                if (!isDragging || !dragStart) return;

                const rect = containerRef.current?.getBoundingClientRect();
                if (!rect) return;

                const deltaX = e.clientX - dragStart.x;
                const range = dragStart.domain.end - dragStart.domain.start;
                const pixelsPerPoint = rect.width / range;
                const pointsDelta = Math.round(-deltaX / pixelsPerPoint);

                const newStart = Math.max(0, Math.min(dataLength - 1 - range, dragStart.domain.start + pointsDelta));
                const newEnd = newStart + range;

                setZoomDomain({ start: newStart, end: Math.min(dataLength - 1, newEnd) });
            };

            const handleMouseUp = () => {
                setIsDragging(false);
                setDragStart(null);
            };

            const handleDoubleClick = () => {
                // Reset to full view
                setZoomDomain({ start: 0, end: dataLength - 1 });
            };

            // Explicit Zoom Helpers — functional updates so rapid +/- clicks never use stale domain
            const zoomIn = () => {
                setZoomDomain((prev) => {
                    const last = Math.max(0, dataLength - 1);
                    const minRange = Math.min(last, Math.max(5, Math.floor(dataLength * 0.05)));
                    let start = Math.max(0, Math.min(prev.start, last));
                    let end = Math.max(start, Math.min(prev.end, last));
                    const range = end - start;
                    if (range <= minRange) return { start, end };

                    const reduction = Math.max(1, Math.floor(range * 0.25));
                    const half = Math.floor(reduction / 2);
                    start = Math.min(start + half, end - minRange);
                    end = Math.max(end - (reduction - half), start + minRange);
                    if (end - start < minRange) end = Math.min(last, start + minRange);
                    start = Math.max(0, Math.min(start, end));
                    end = Math.min(last, Math.max(end, start));
                    return { start, end };
                });
            };

            const zoomOut = () => {
                setZoomDomain((prev) => {
                    const last = Math.max(0, dataLength - 1);
                    let start = Math.max(0, Math.min(prev.start, last));
                    let end = Math.max(start, Math.min(prev.end, last));
                    if (start <= 0 && end >= last) return { start: 0, end: last };

                    const range = Math.max(1, end - start);
                    const expansion = Math.max(1, Math.floor(range * 0.25));
                    const half = Math.floor(expansion / 2);
                    start = Math.max(0, start - half);
                    end = Math.min(last, end + (expansion - half));
                    return { start, end };
                });
            };

            // Touch: two-finger pan (horizontal) + pinch zoom. One-finger still scrolls the page.
            const lastTouchDistance = useRef(null);
            const lastTouchCenter = useRef(null);
            const panAccum = useRef(0);
            const zoomDomainRef = useRef(zoomDomain);
            const dragStartRef = useRef(dragStart);
            const isDraggingRef = useRef(isDragging);
            zoomDomainRef.current = zoomDomain;
            dragStartRef.current = dragStart;
            isDraggingRef.current = isDragging;

            useEffect(() => {
                const el = containerRef.current;
                if (!el) return;

                const plotRect = () => (
                    el.querySelector('.recharts-cartesian-grid')?.getBoundingClientRect()
                    || el.getBoundingClientRect()
                );

                const twoFingerMetrics = (touches) => {
                    const dx = touches[0].clientX - touches[1].clientX;
                    const dy = touches[0].clientY - touches[1].clientY;
                    return {
                        distance: Math.hypot(dx, dy),
                        centerX: (touches[0].clientX + touches[1].clientX) / 2,
                    };
                };

                const setTwoFingerCapture = (on) => {
                    const value = on ? 'none' : '';
                    el.style.touchAction = value;
                    el.querySelectorAll('.recharts-wrapper, .recharts-surface').forEach((node) => {
                        node.style.touchAction = value;
                    });
                };

                const onTouchStart = (e) => {
                    if (e.touches.length >= 2) {
                        e.preventDefault();
                        setTwoFingerCapture(true);
                        const { distance, centerX } = twoFingerMetrics(e.touches);
                        lastTouchDistance.current = distance;
                        lastTouchCenter.current = centerX;
                        panAccum.current = 0;
                        setIsDragging(false);
                        setDragStart(null);
                        return;
                    }
                    const rect = el.getBoundingClientRect();
                    const touchY = e.touches[0].clientY - rect.top;
                    const isBottomArea = touchY > rect.height * 0.85;
                    if (e.touches.length === 1 && isBottomArea) {
                        setIsDragging(true);
                        setDragStart({ x: e.touches[0].clientX, domain: { ...zoomDomainRef.current } });
                    }
                };

                const onTouchMove = (e) => {
                    if (e.touches.length >= 2) {
                        e.preventDefault();
                        const { distance, centerX } = twoFingerMetrics(e.touches);
                        const prevDist = lastTouchDistance.current;
                        const prevCenter = lastTouchCenter.current;
                        lastTouchDistance.current = distance;
                        lastTouchCenter.current = centerX;
                        if (!prevDist || prevCenter == null) return;

                        const scale = distance / prevDist;
                        const panPx = centerX - prevCenter;
                        const rect = plotRect();
                        const plotWidth = Math.max(1, rect.width);
                        const currentRange = Math.max(1, zoomDomainRef.current.end - zoomDomainRef.current.start);
                        panAccum.current += -panPx / (plotWidth / currentRange);
                        const panPoints = Math.round(panAccum.current);
                        if (panPoints !== 0) panAccum.current -= panPoints;

                        setZoomDomain((prev) => {
                            const last = Math.max(0, dataLength - 1);
                            const minRange = Math.min(last, Math.max(5, Math.floor(dataLength * 0.05)));
                            let start = prev.start;
                            let end = prev.end;
                            let range = Math.max(1, end - start);

                            if (panPoints !== 0) {
                                const newStart = Math.max(0, Math.min(last - range, start + panPoints));
                                start = newStart;
                                end = start + range;
                            }

                            const zoomed = scale > 1.008 || scale < 0.992;
                            if (zoomed) {
                                const cursorRatio = Math.min(1, Math.max(0, (centerX - rect.left) / plotWidth));
                                const nextRange = Math.max(minRange, Math.min(last, range / scale));
                                const focus = start + range * cursorRatio;
                                start = focus - nextRange * cursorRatio;
                                end = start + nextRange;
                            }

                            if (end - start > last) {
                                start = 0;
                                end = last;
                            } else if (start < 0) {
                                end -= start;
                                start = 0;
                                if (end > last) end = last;
                            } else if (end > last) {
                                start -= (end - last);
                                end = last;
                                if (start < 0) start = 0;
                            }

                            start = Math.round(Math.max(0, Math.min(start, last)));
                            end = Math.round(Math.max(start, Math.min(end, last)));
                            if (end - start < minRange && last >= minRange) {
                                end = Math.min(last, start + minRange);
                                start = Math.max(0, end - minRange);
                            }
                            return { start, end };
                        });
                        return;
                    }

                    const start = dragStartRef.current;
                    if (e.touches.length === 1 && isDraggingRef.current && start) {
                        e.preventDefault();
                        const rect = plotRect();
                        const deltaX = e.touches[0].clientX - start.x;
                        const range = start.domain.end - start.domain.start;
                        const pixelsPerPoint = rect.width / Math.max(1, range);
                        const pointsDelta = Math.round(-deltaX / pixelsPerPoint);
                        const newStart = Math.max(0, Math.min(dataLength - 1 - range, start.domain.start + pointsDelta));
                        setZoomDomain({ start: newStart, end: Math.min(dataLength - 1, newStart + range) });
                    }
                };

                const onTouchEnd = (e) => {
                    if (e.touches.length < 2) {
                        lastTouchDistance.current = null;
                        lastTouchCenter.current = null;
                        panAccum.current = 0;
                        setTwoFingerCapture(false);
                    }
                    if (e.touches.length === 0) {
                        setIsDragging(false);
                        setDragStart(null);
                    }
                };

                const preventGesture = (e) => { e.preventDefault(); };

                el.addEventListener('touchstart', onTouchStart, { passive: false });
                el.addEventListener('touchmove', onTouchMove, { passive: false });
                el.addEventListener('touchend', onTouchEnd);
                el.addEventListener('touchcancel', onTouchEnd);
                el.addEventListener('gesturestart', preventGesture, { passive: false });
                el.addEventListener('gesturechange', preventGesture, { passive: false });

                return () => {
                    setTwoFingerCapture(false);
                    el.removeEventListener('touchstart', onTouchStart);
                    el.removeEventListener('touchmove', onTouchMove);
                    el.removeEventListener('touchend', onTouchEnd);
                    el.removeEventListener('touchcancel', onTouchEnd);
                    el.removeEventListener('gesturestart', preventGesture);
                    el.removeEventListener('gesturechange', preventGesture);
                };
            }, [dataLength]);

            return {
                zoomDomain,
                containerRef,
                handlers: {
                    onMouseDown: handleMouseDown,
                    onMouseMove: handleMouseMove,
                    onMouseUp: handleMouseUp,
                    onMouseLeave: handleMouseUp,
                    onDoubleClick: handleDoubleClick
                    // Touch handlers removed from here, handled natively
                },
                isDragging,
                zoomIn,
                zoomOut
            };
        };

        const CHART_LEGEND_LINES = {
            actual_train: { line: 'is-train', text: 'text-slate-500 dark:text-slate-400' },
            actual_test: { line: 'is-test', text: 'text-emerald-600 dark:text-emerald-400' },
            fitted: { line: 'is-fitted', text: 'text-slate-400 dark:text-slate-500' },
            val_forecast: { line: 'is-forecast', text: 'text-amber-600 dark:text-amber-400' },
            actual_history: { line: 'is-train', text: 'text-slate-500 dark:text-slate-400' },
            final_fit: { line: 'is-fitted', text: 'text-slate-400 dark:text-slate-500' },
            future_forecast: { line: 'is-forecast', text: 'text-amber-600 dark:text-amber-400' },
        };

        const useCompactChartChrome = () => {
            const query = '(max-width: 768px), (orientation: landscape) and (max-height: 500px)';
            const [compact, setCompact] = useState(() => window.matchMedia(query).matches);
            useEffect(() => {
                const media = window.matchMedia(query);
                const update = () => setCompact(media.matches);
                update();
                media.addEventListener('change', update);
                return () => media.removeEventListener('change', update);
            }, []);
            return compact;
        };

        const chartTooltipLabel = (name, compact) => {
            if (!compact || !name) return name;
            const split = name.indexOf(' (');
            return split > 0 ? name.slice(0, split) : name;
        };

        // Display prepared values in Actual without changing observations used by metrics.
        const preparedActualChartData = (rows, keys = ['actual_train', 'actual_test', 'actual_history']) => rows?.map(point => {
            if (point.closed || !Number.isFinite(point.prepared_actual)) return point;
            const prepared_actual_keys = keys.filter(key => Object.hasOwn(point, key) && point[key] == null);
            if (!prepared_actual_keys.length) return point;
            return { ...point, ...Object.fromEntries(prepared_actual_keys.map(key => [key, point.prepared_actual])), prepared_actual_keys };
        });

        const chartTooltipEntryLabel = (entry, compact, locale = 'en-US') => {
            let name = entry.name;
            if (entry.payload?.prepared_actual_keys?.includes(entry.dataKey)) {
                const key = { actual_train: 'est_train', training: 'est_train', actual_test: 'est_test', actual: 'est_test', actual_history: 'estimation' }[entry.dataKey];
                const language = locale.startsWith('vi') ? 'vi' : locale.startsWith('de') ? 'de' : 'en';
                if (key) name = TRANSLATIONS[language].charts[key];
            }
            return chartTooltipLabel(name, compact);
        };

        const CompactChartTooltip = ({ active, payload, label, isDark, compact, locale }) => {
            if (!active || !payload?.length) return null;
            const items = payload.filter(entry => entry?.value != null && entry.value !== '' && !Number.isNaN(Number(entry.value)));
            if (!items.length) return null;
            return (
                <div className={`fc-chart-tooltip rounded-md border shadow-md ${isDark ? 'bg-slate-900 border-slate-700 text-slate-100' : 'bg-white border-slate-200 text-slate-900'}`}>
                    {label != null && label !== '' && (
                        <div className={`fc-chart-tooltip-label font-semibold ${isDark ? 'border-slate-700/70' : 'border-slate-200/70'} border-b`}>{label}</div>
                    )}
                    <ul className="fc-chart-tooltip-items">
                        {items.map(entry => (
                            <li key={entry.dataKey || entry.name} className="fc-chart-tooltip-item">
                                <span className="fc-chart-tooltip-swatch" style={{ backgroundColor: entry.color }} aria-hidden="true" />
                                <span className="fc-chart-tooltip-name">{chartTooltipEntryLabel(entry, compact, locale)}</span>
                                <span className="fc-chart-tooltip-value">{fmtNumber(entry.value, 0, 2, locale)}</span>
                            </li>
                        ))}
                    </ul>
                </div>
            );
        };

        const ChartTooltipContent = ({ isDark, labelFormatter, active, payload, label, locale }) => {
            const compact = useCompactChartChrome();
            const displayLabel = formatForecastDate(labelFormatter ? labelFormatter(label, payload) : label, locale);
            return <CompactChartTooltip locale={locale} active={active} payload={payload} label={displayLabel} isDark={isDark} compact={compact} />;
        };

        const ChartLineLegend = ({ payload }) => {
            if (!payload?.length) return null;
            return (
                <ul className="fc-chart-line-legend" aria-hidden="true">
                    {payload.map(entry => {
                        const key = entry.dataKey;
                        const style = CHART_LEGEND_LINES[key] || { line: '', text: 'text-slate-500 dark:text-slate-400' };
                        return (
                            <li key={`${entry.value}-${key || entry.color}`}>
                                <span className={`fc-replay-legend-item ${style.text}`}>
                                    <span className={`fc-replay-legend-line ${style.line}`.trim()} aria-hidden="true" />
                                    {entry.value}
                                </span>
                            </li>
                        );
                    })}
                </ul>
            );
        };

        // A single observation cannot form a line or filled area. Keep it visible,
        // including when zooming leaves just one finite point in the series.
        const singlePointDot = (data, key, color) => data.filter(point => Number.isFinite(point[key])).length === 1
            ? chartPointStyle(color)
            : false;

        const BacktestChart = ({ data: sourceData, syncId, isDark, t, zoomState }) => {
            const data = useMemo(() => preparedActualChartData(sourceData), [sourceData]);
            if (!data) return null;

            const { zoomDomain, containerRef, handlers, isDragging, zoomIn, zoomOut } = useChartZoom(data.length, zoomState);
            const visibleData = useMemo(() => data.slice(zoomDomain.start, zoomDomain.end + 1), [data, zoomDomain.start, zoomDomain.end]);
            const isZoomed = zoomDomain.start > 0 || zoomDomain.end < data.length - 1;

            return (
                <div className="w-full h-full flex flex-col min-h-0">
                    <div className="fc-chart-header">
                        <h3 className="text-[13px] font-semibold text-slate-600 dark:text-slate-300">{t('sidebar.detail_validation_chart')}</h3>
                        <ChartLineLegend payload={[
                        { dataKey: 'actual_train', value: t('charts.act_train') },
                        { dataKey: 'actual_test', value: t('charts.act_test') },
                        { dataKey: 'fitted', value: t('charts.fitted') },
                        { dataKey: 'val_forecast', value: t('charts.val_fc') },
                        ]} />
                    </div>
                    <div
                        ref={containerRef}
                        className={`fc-chart-touch flex-1 min-h-0 relative ${isDragging ? 'cursor-grabbing' : 'cursor-grab'}`}
                        {...handlers}
                    >
                    <div
                        className="fc-chart-zoom absolute top-2 right-2 z-10 flex items-center gap-1"
                        onMouseDown={(e) => e.stopPropagation()}
                        onPointerDown={(e) => e.stopPropagation()}
                        onDoubleClick={(e) => e.stopPropagation()}
                        onClick={(e) => e.stopPropagation()}
                    >
                        {/* Pts/Reset grows to the left; zoom +/- stays pinned on the right */}
                        {isZoomed && (
                            <div className="flex items-center gap-2 bg-white/80 dark:bg-slate-900/80 px-2 py-1 rounded-lg backdrop-blur-sm border border-white/20 dark:border-white/10 shadow-sm">
                                <span className="text-[10px] text-slate-500 dark:text-slate-400">
                                    {zoomDomain.end - zoomDomain.start + 1} / {data.length} pts
                                </span>
                                <button
                                    type="button"
                                    onClick={(e) => { e.stopPropagation(); handlers.onDoubleClick(); }}
                                    className="text-[10px] text-amber-600 dark:text-amber-400 hover:bg-amber-50 dark:hover:bg-amber-900/30 px-1.5 py-0.5 rounded transition-colors"
                                >
                                    Reset
                                </button>
                            </div>
                        )}
                        <div className="fc-chart-zoom-btns flex flex-col gap-1 bg-white/80 dark:bg-slate-900/80 p-0.5 rounded-lg backdrop-blur-sm border border-white/20 dark:border-white/10 shadow-sm">
                            <button type="button" onClick={(e) => { e.stopPropagation(); zoomIn(); }} className="w-5 h-5 flex items-center justify-center rounded bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors font-bold text-xs" aria-label="Zoom In">+</button>
                            <button type="button" onClick={(e) => { e.stopPropagation(); zoomOut(); }} className="w-5 h-5 flex items-center justify-center rounded bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors font-bold text-xs" aria-label="Zoom Out">-</button>
                        </div>
                    </div>
                    <ResponsiveContainer width="100%" height="100%">
                        <ComposedChart data={visibleData} syncId={syncId} margin={{ top: 8, right: 24, left: 8, bottom: 20 }}>
                            <defs>
                                <linearGradient id="gd_bt_actual_train" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="5%" stopColor="#64748b" stopOpacity={0.3} />
                                    <stop offset="95%" stopColor="#64748b" stopOpacity={0} />
                                </linearGradient>
                                <linearGradient id="gd_bt_actual_test" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="5%" stopColor="#10b981" stopOpacity={0.3} />
                                    <stop offset="95%" stopColor="#10b981" stopOpacity={0} />
                                </linearGradient>
                                <linearGradient id="gd_bt_fitted" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="5%" stopColor="#94a3b8" stopOpacity={0.3} />
                                    <stop offset="95%" stopColor="#94a3b8" stopOpacity={0} />
                                </linearGradient>
                                <linearGradient id="gd_bt_val_forecast" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="5%" stopColor="#f59e0b" stopOpacity={0.3} />
                                    <stop offset="95%" stopColor="#f59e0b" stopOpacity={0} />
                                </linearGradient>
                            </defs>
                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke={isDark ? "#334155" : "#e2e8f0"} />
                            <XAxis dataKey="date" tickFormatter={value => formatForecastDate(value, t.numberLocale)} axisLine={false} tickLine={false} tick={{ fill: isDark ? "#cbd5e1" : "#64748b", fontSize: 10 }} tickMargin={10} minTickGap={36} interval="preserveStartEnd" padding={{ left: 8, right: 8 }} />
                            <YAxis tickFormatter={value => formatChartAxis(value, t.numberLocale)} width={44} axisLine={false} tickLine={false} tick={{ fill: isDark ? "#cbd5e1" : "#64748b", fontSize: 10 }} tickMargin={6} />
                            <Tooltip wrapperClassName="fc-chart-tooltip-wrapper" cursor={{ stroke: isDark ? '#475569' : '#cbd5e1', strokeWidth: 1 }} content={<ChartTooltipContent locale={t.numberLocale} isDark={isDark} />} />
                            <Area type="linear" dataKey="actual_train" name={t('charts.act_train')} stroke="#64748b" fill="url(#gd_bt_actual_train)" strokeWidth={2} isAnimationActive={false} />
                            <Area type="linear" dataKey="actual_test" name={t('charts.act_test')} stroke="#10b981" fill="url(#gd_bt_actual_test)" strokeWidth={2} dot={singlePointDot(visibleData, 'actual_test', '#10b981')} isAnimationActive={false} />
                            <Area type="linear" dataKey="fitted" name={t('charts.fitted')} stroke="#94a3b8" fill="url(#gd_bt_fitted)" strokeDasharray="3 3" strokeWidth={2} isAnimationActive={false} />
                            <Area type="linear" dataKey="val_forecast" name={t('charts.val_fc')} stroke="#f59e0b" fill="url(#gd_bt_val_forecast)" strokeWidth={2} strokeDasharray="5 5" dot={singlePointDot(visibleData, 'val_forecast', '#f59e0b')} isAnimationActive={false} />
                        </ComposedChart>
                    </ResponsiveContainer>
                    </div>
                </div>
            );
        };

        // Preserve chart interaction when polling adds other IDs. Completed results and
        // the translator retain their references; new data, language or theme still rerenders.
        // Both charts use the forecast timeline, including empty validation slots for future dates.
        const SynchronizedForecastCharts = memo(({ validationData, forecastData, isDark, t }) => {
            const dataLength = forecastData?.length || 0;
            const zoomState = useState({ start: 0, end: dataLength - 1 });
            const [, setZoomDomain] = zoomState;
            const timelineKey = JSON.stringify((forecastData || []).map(point => point.date));
            useEffect(() => {
                setZoomDomain({ start: 0, end: dataLength - 1 });
            }, [timelineKey]);
            return (
                <div className="fc-detail-charts min-w-0 gap-4 border border-slate-200 dark:border-slate-700 rounded-lg p-2">
                    <div className="fc-detail-chart flex flex-col border-b border-dashed border-slate-200 dark:border-slate-700 relative">
                        <div className="flex-1 min-h-0">
                        <BacktestChart data={validationData} syncId="sv" zoomState={zoomState} isDark={isDark} t={t} />
                        </div>
                    </div>
                    <div className="fc-detail-chart flex flex-col relative">
                        <div className="flex-1 min-h-0">
                        <ForecastChart data={forecastData} syncId="sv" zoomState={zoomState} isDark={isDark} t={t} />
                        </div>
                    </div>
                </div>
            );
        });

        const ForecastChart = ({ data: sourceData, syncId, isDark, t, zoomState }) => {
            const data = useMemo(() => preparedActualChartData(sourceData), [sourceData]);
            if (!data) return null;

            const { zoomDomain, containerRef, handlers, isDragging, zoomIn, zoomOut } = useChartZoom(data.length, zoomState);
            const visibleData = useMemo(() => data.slice(zoomDomain.start, zoomDomain.end + 1), [data, zoomDomain.start, zoomDomain.end]);
            const isZoomed = zoomDomain.start > 0 || zoomDomain.end < data.length - 1;

            return (
                <div className="w-full h-full flex flex-col min-h-0">
                    <div className="fc-chart-header">
                        <h3 className="text-[13px] font-semibold text-slate-600 dark:text-slate-300">{t('sidebar.detail_forecast_chart')}</h3>
                        <ChartLineLegend payload={[
                        { dataKey: 'actual_history', value: t('charts.history') },
                        { dataKey: 'final_fit', value: t('charts.final_fit') },
                        { dataKey: 'future_forecast', value: t('charts.future_fc') },
                        ]} />
                    </div>
                    <div
                        ref={containerRef}
                        className={`fc-chart-touch flex-1 min-h-0 relative ${isDragging ? 'cursor-grabbing' : 'cursor-grab'}`}
                        {...handlers}
                    >
                    <div
                        className="fc-chart-zoom absolute top-2 right-2 z-10 flex items-center gap-1"
                        onMouseDown={(e) => e.stopPropagation()}
                        onPointerDown={(e) => e.stopPropagation()}
                        onDoubleClick={(e) => e.stopPropagation()}
                        onClick={(e) => e.stopPropagation()}
                    >
                        {/* Pts/Reset grows to the left; zoom +/- stays pinned on the right */}
                        {isZoomed && (
                            <div className="flex items-center gap-2 bg-white/80 dark:bg-slate-900/80 px-2 py-1 rounded-lg backdrop-blur-sm border border-white/20 dark:border-white/10 shadow-sm">
                                <span className="text-[10px] text-slate-500 dark:text-slate-400">
                                    {zoomDomain.end - zoomDomain.start + 1} / {data.length} pts
                                </span>
                                <button
                                    type="button"
                                    onClick={(e) => { e.stopPropagation(); handlers.onDoubleClick(); }}
                                    className="text-[10px] text-amber-600 dark:text-amber-400 hover:bg-amber-50 dark:hover:bg-amber-900/30 px-1.5 py-0.5 rounded transition-colors"
                                >
                                    Reset
                                </button>
                            </div>
                        )}
                        <div className="fc-chart-zoom-btns flex flex-col gap-1 bg-white/80 dark:bg-slate-900/80 p-0.5 rounded-lg backdrop-blur-sm border border-white/20 dark:border-white/10 shadow-sm">
                            <button type="button" onClick={(e) => { e.stopPropagation(); zoomIn(); }} className="w-5 h-5 flex items-center justify-center rounded bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors font-bold text-xs" aria-label="Zoom In">+</button>
                            <button type="button" onClick={(e) => { e.stopPropagation(); zoomOut(); }} className="w-5 h-5 flex items-center justify-center rounded bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors font-bold text-xs" aria-label="Zoom Out">-</button>
                        </div>
                    </div>

                    <ResponsiveContainer width="100%" height="100%">

        };

        const AlertModal = ({ isOpen, message, confirmLabel, cancelLabel, onConfirm, onClose }) => {

        };

        const suggestForecastMapping = (headers) => {
            const dates = headers.map((h, i) => Number.isFinite(parseForecastHeaderDate(h)) ? i : -1).filter(i => i >= 0);
            const idIndex = headers.findIndex((h, i) => !dates.includes(i) && /sku|item|product|(^|[_\s])id($|[_\s])/i.test(h));
            const fallback = headers.findIndex((_, i) => !dates.includes(i));
            return { sku: headers[idIndex >= 0 ? idIndex : fallback] || '', start: headers[dates[0]] || '', end: headers[dates[dates.length - 1]] || '' };
        };

        const FORECAST_TEMPLATE_FILES = {
            vertical: 'Template-Vertical-Format.xlsx',
            horizontal: 'Template-Horizontal-Format.xlsx',
        };

        const forecastSerialDate = (value, date1904 = false) => {
            const parts = XLSX.SSF.parse_date_code(value, { date1904 });
            return parts ? new Date(Date.UTC(parts.y, parts.m - 1, parts.d, parts.H, parts.M, parts.S, Math.round((parts.u || 0) * 1000))).toISOString().replace(/T00:00:00\.000Z$/, '') : '';
        };

        const suggestVerticalForecastMapping = ({ headers, rows }) => {
            const names = headers.map(header => header.toLowerCase().replace(/[_\s-]+/g, ' ').trim());
            const sample = rows.slice(0, 200);
            const namedId = names.findIndex(name => /^(unique id|item id|product id|sku|sku id|item|product|id|code|item code|product code)$/.test(name));
            let date = names.findIndex(name => /^(date|ds|period|time|timestamp|month|year|sales date|order date)$/.test(name));
            if (date < 0) date = headers.findIndex((_, col) => col !== namedId && sample.length > 0 && sample.filter(row => {
                const text = String(row[col] ?? '').trim();
                return !/^\d+$/.test(text) && Number.isFinite(parseForecastHeaderDate(text));
            }).length / sample.length >= 0.8);
            let value = names.findIndex((name, col) => col !== date && /^(quantity|qty|value|y|sales|demand|units|volume|amount|sales quantity|sales qty)$/.test(name));
            const sku = namedId >= 0 ? namedId : headers.findIndex((_, col) => col !== date && col !== value);
            if (value < 0) value = headers.findIndex((_, col) => col !== date && col !== sku && sample.length > 0 && sample.every(row => String(row[col] ?? '').trim() !== '' && Number.isFinite(Number(row[col]))));
            return { sku: headers[sku] || '', date: headers[date] || '', value: headers[value] || '' };
        };

        const readForecastUpload = (workbook, requestedFormat) => {
            const horizontal = readForecastWorksheet(workbook);
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const raw = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: '' });
            const range = XLSX.utils.decode_range(sheet['!ref'] || 'A1');
            const date1904 = !!workbook.Workbook?.WBProps?.date1904;
            const rawRows = [];
            const rows = horizontal.rows.flatMap((row, index) => {
                const values = raw[index + 1] || [];
                if (!values.some(value => String(value ?? '').trim() !== '')) return [];
                rawRows.push(values);
                return [horizontal.headers.map((_, col) => {
                    const cell = sheet[XLSX.utils.encode_cell({ r: range.s.r + index + 1, c: range.s.c + col })];
                    return cell?.t === 'n' && cell.z && XLSX.SSF.is_date(cell.z) ? forecastSerialDate(cell.v, date1904) : (row[col] ?? '');
                })];
            });
            const data = { headers: horizontal.headers, rows, rawRows, date1904 };
            const verticalMapping = suggestVerticalForecastMapping(data);
            const dateHeaders = data.headers.filter(header => Number.isFinite(parseForecastHeaderDate(header)));
            const detectedFormat = dateHeaders.length >= 2 ? 'horizontal' : verticalMapping.date ? 'vertical' : 'horizontal';
            const format = requestedFormat || detectedFormat;
            return { ...data, format, detectedFormat, mapping: format === 'vertical' ? verticalMapping : suggestForecastMapping(data.headers) };
        };

        const readVerticalForecastTemplate = (workbook) => {
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const raw = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: '' });
            const formatted = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
            const headers = (raw[0] || []).map(String);
            if (headers.length !== 3 || headers[0] !== 'Item ID' || headers[1] !== 'Date' || headers[2] !== 'Quantity') throw new Error('Expected Item ID, Date and Quantity columns.');
            const rows = raw.slice(1).map((row, i) => {
                if (!row.some(value => value !== '')) return null;
                let date = row[1];
                if (typeof date === 'number') {
                    const parts = XLSX.SSF.parse_date_code(date, { date1904: !!workbook.Workbook?.WBProps?.date1904 });
                    date = parts ? new Date(Date.UTC(parts.y, parts.m - 1, parts.d, parts.H, parts.M, parts.S)).toISOString().replace(/T00:00:00\.000Z$/, '') : '';
                }
                return [String(formatted[i + 1]?.[0] ?? row[0]), String(date), row[2]];
            }).filter(Boolean);
            return { headers, rows };
        };

        // Preview validation only. Original files and mappings go to the backend,
        // which owns canonical normalization and authoritative validation.
        const inspectVerticalForecastSource = (source) => {
            const headers = source.headers || ['Item ID', 'Date', 'Quantity'];
            const mapping = source.mapping || { sku: headers[0], date: headers[1], value: headers[2] };
            const indices = ['sku', 'date', 'value'].map(key => headers.indexOf(mapping[key]));
            if (indices.some(index => index < 0) || new Set(indices).size !== 3 || new Set(headers).size !== headers.length) return null;
            const [idIndex, dateIndex, valueIndex] = indices;
            const items = new Map(), dates = new Set();
            for (const [index, row] of source.rows.entries()) {
                const rawId = row[idIndex];
                let rawDate = row[dateIndex];
                const rawValues = source.rawRows?.[index] || row;
                if (typeof rawValues[dateIndex] === 'number' && !Number.isFinite(parseForecastHeaderDate(rawDate))) rawDate = forecastSerialDate(rawValues[dateIndex], source.date1904);
                const rawQuantity = rawValues[valueIndex];
                const quantity = typeof rawQuantity === 'number' ? rawQuantity : typeof rawQuantity === 'string' && rawQuantity.trim() !== '' ? Number(rawQuantity) : NaN;
                const id = String(rawId ?? '').trim();
                const time = parseForecastHeaderDate(rawDate);
                if (!id || !Number.isFinite(time) || typeof quantity !== 'number' || !Number.isFinite(quantity)) return null;
                const date = new Date(time).toISOString().replace(/T00:00:00\.000Z$/, '');
                if (!items.has(id)) items.set(id, new Map());
                const series = items.get(id);
                if (series.has(date)) return null;
                series.set(date, quantity);
                dates.add(date);
            }
            const periods = Array.from(dates).sort();
            if (!items.size || inferFrequencyFromHeaders(periods) === 'unsupported' || Array.from(items.values()).some(series => series.size !== periods.length)) return null;
            return { valid: true, count: periods.length, items: items.size, frequency: inferFrequencyFromHeaders(periods) };
        };

        const appendForecastSourceForm = (form, source) => {
            const { file, headers, mapping } = source;
            form.append('file', file);
            form.append('data_format', source.format || 'horizontal');
            if (source.preparation) form.append('preparation', JSON.stringify(source.preparation));
            if (source.versionId) form.append('dataset_version_id', source.versionId);
            form.append('sku_col_idx', headers.indexOf(mapping.sku));
            if (source.format === 'vertical') {
                form.append('date_col_idx', headers.indexOf(mapping.date));
                form.append('quantity_col_idx', headers.indexOf(mapping.value));
            } else {
                form.append('start_col_idx', headers.indexOf(mapping.start));
                form.append('end_col_idx', headers.indexOf(mapping.end));
            }
        };

        const inspectForecastMapping = (source) => {
            if (!source) return { valid: false, count: 0, items: 0 };
            if (source.format === 'vertical') {
                return inspectVerticalForecastSource(source) || { valid: false, count: 0, items: 0 };
            }
            const { headers, rows, mapping } = source;
            const sku = headers.indexOf(mapping.sku), start = headers.indexOf(mapping.start), end = headers.indexOf(mapping.end);
            const count = start >= 0 && end >= start ? end - start + 1 : 0;
            const items = new Set(rows.map(row => String(row[sku] ?? '').trim()).filter(Boolean)).size;
            const frequency = inferFrequencyFromHeaders(count ? headers.slice(start, end + 1) : []);
            const valid = sku >= 0 && count > 0 && (sku < start || sku > end) && items > 0 && frequency !== 'unsupported';
            return { valid, count, items, frequency };
        };

        const verticalForecastPreviewRows = (source) => {
            if (!source) return [];
            const headers = source.headers || [];
            const rows = source.rows || [];
            const mapping = source.mapping || {};
            const skuIndex = headers.indexOf(mapping.sku);
            if (skuIndex < 0) return [];
            if (source.format === 'vertical') {
                const dateIndex = headers.indexOf(mapping.date);
                const valueIndex = headers.indexOf(mapping.value);
                if (dateIndex < 0 || valueIndex < 0 || new Set([skuIndex, dateIndex, valueIndex]).size !== 3) return [];
                return rows.map(row => ({
                    unique_id: String(row[skuIndex] ?? ''),
                    ds: row[dateIndex],
                    quantity: row[valueIndex],
                }));
            }
            const startIndex = headers.indexOf(mapping.start);
            const endIndex = headers.indexOf(mapping.end);
            if (startIndex < 0 || endIndex < startIndex || (startIndex <= skuIndex && skuIndex <= endIndex)) return [];
            return rows.flatMap(row => {
                const uniqueId = String(row[skuIndex] ?? '');
                return headers.slice(startIndex, endIndex + 1).map((date, offset) => ({
                    unique_id: uniqueId,
                    ds: date,
                    quantity: row[startIndex + offset],
                }));
            });
        };

        const PREPARATION_METHODS = {none:'Leave unresolved', forward:'Forward Fill', backward:'Backward Fill', interpolation:'Interpolation', seasonal:'Seasonal Imputation', zero:'Zero Imputation'};
        const preparationMapping = source => {
            const mapping = {data_format:source.format || 'horizontal', sku_col_idx:source.headers.indexOf(source.mapping.sku)};
            if (source.format === 'vertical') { mapping.date_col_idx = source.headers.indexOf(source.mapping.date); mapping.quantity_col_idx = source.headers.indexOf(source.mapping.value); }
            else { mapping.start_col_idx = source.headers.indexOf(source.mapping.start); mapping.end_col_idx = source.headers.indexOf(source.mapping.end); }
            return mapping;
        };
        const datasetRequest = async (baseUrl, path, options = {}) => {
            const response = await fetch(`${baseUrl}${path}`, options);
            if (!response.ok) throw new Error(await readResponseError(response, 'Could not complete this request.'));
            return response;
        };
        const downloadPreparedPreview = (review, filename) => {
            const data = [['Item ID','Date','Quantity','Original Quantity','Imputed','Method','Missing type','Closed'], ...review.records.map(r=>[r.unique_id,r.ds,r.prepared,r.original,r.missing,r.method,r.kind,r.closed||false])];
            const quote = value => '"' + String(value ?? '').replace(/"/g,'""') + '"';
            const csv = data.map(row=>row.map((value,index)=>quote(index === 0 && /^[=+@-]/.test(String(value)) ? "'"+value : value)).join(',')).join('\r\n');
            window.OperartisSecurity.downloadBlob(new Blob(['\uFEFF',csv],{type:'text/csv'}),filename.replace(/\.[^.]+$/,'')+'-prepared.csv');
        };
        const LocalizedDateInput = ({label,value,minValue,locale='en-US',onChange,onValidityChange}) => {
            const tr=value=>window.ForecastDialogI18n.translate(value,locale);
            const [text,setText] = useState(()=>formatForecastDate(value,locale));
            const [touched,setTouched] = useState(false);
            const lastEmitted=useRef(value), previousLocale=useRef(locale);
            useEffect(()=>{
                if(value!==lastEmitted.current || locale!==previousLocale.current) {setText(formatForecastDate(value,locale));setTouched(false);onValidityChange?.(false);}
                lastEmitted.current=value;previousLocale.current=locale;
            },[value,locale]);
            const invalid=parseCalendarDateInput(text,locale)===null;
            const rangeInvalid = !invalid && !!value && !!minValue && value < minValue;
            const showError = (invalid && touched) || rangeInvalid;
            const rangeMessage = tr('End date cannot be before start date.');
            const message=locale==='de-DE'?`Gültiges Datum eingeben (${calendarDatePattern(locale)}).`:locale==='vi-VN'?`Nhập ngày hợp lệ (${calendarDatePattern(locale)}).`:`Enter a valid date (${calendarDatePattern(locale)}).`;
            const edit = (next, input) => {
                const direct = parseCalendarDateInput(next,locale);
                const display = direct ? formatForecastDate(direct,locale) : partialCalendarDateInput(next,locale);
                const parsed = parseCalendarDateInput(display,locale);
                if (input && display !== next) {
                    const count = next.slice(0,input.selectionStart).replace(/\D/g,'').length;
                    let caret = 0, seen = 0;
                    while (caret < display.length && seen < count) {if (/\d/.test(display[caret])) seen++;caret++;}
                    input.value = display;
                    input.setSelectionRange(caret,caret);
                }
                setText(display);setTouched(false);
                lastEmitted.current=parsed ?? '';onValidityChange?.(parsed===null);onChange(parsed ?? '');
            };
            return <span className="fc-local-date"><span className="fc-local-date-control">
                <input type="text" aria-label={tr(label)} placeholder={tr(calendarDatePattern(locale))} autoComplete="off" spellCheck={false} value={text} aria-invalid={invalid || rangeInvalid || undefined} aria-description={showError ? (rangeInvalid ? rangeMessage : message) : undefined} onChange={e=>edit(e.target.value,e.target)} onKeyDown={e=>{
                    const input=e.currentTarget, start=input.selectionStart, end=input.selectionEnd;
                    if(start!==end || e.ctrlKey || e.metaKey || e.altKey) return;
                    if(e.key==='Backspace' && start>0 && /[-./]/.test(text[start-1])) input.setSelectionRange(start-2,start);
                    if(e.key==='Delete' && /[-./]/.test(text[start] || '')) input.setSelectionRange(start,start+2);
                }} onFocus={()=>setTouched(false)} onBlur={()=>{setTouched(true);if(!invalid)setText(formatForecastDate(value,locale));}}/>
                {text && text.length < 10 && partialCalendarDateInput(text,locale) === text && <span className="fc-local-date-mask" aria-hidden="true"><span style={{visibility:'hidden'}}>{text}</span>{calendarDatePattern(locale).slice(text.length)}</span>}
                <span className="fc-local-date-picker"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg><input type="date" aria-label={tr(`${label} calendar picker`)} lang={locale==='en-US'?'en-CA':locale} value={value || ''} onClick={e=>{try{e.currentTarget.showPicker?.();}catch{}}} onChange={e=>{edit(e.target.value);setText(formatForecastDate(e.target.value,locale));setTouched(false);}}/></span>
                </span><small className="fc-local-date-error" aria-hidden={!showError} role={showError ? 'alert' : undefined}><span style={{visibility:invalid && touched ? 'visible' : 'hidden'}}>{message}</span>{minValue !== undefined && <span style={{visibility:rangeInvalid ? 'visible' : 'hidden'}}>{rangeMessage}</span>}</small>
            </span>;
        };

        const DatasetLibrary = ({baseUrl,onOpen,locale='en-US'}) => {
            const tr=value=>window.ForecastDialogI18n.translate(value,locale);
            const [datasets,setDatasets] = useState([]), [detail,setDetail] = useState(null), [history,setHistory] = useState(null);
            const [error,setError] = useState(''), [busy,setBusy] = useState(false), [rename,setRename] = useState(''), [deleteId,setDeleteId] = useState(null);
            const [menuId,setMenuId] = useState(null), [editId,setEditId] = useState(null);
            const [loadingLibrary,setLoadingLibrary] = useState(true);
            const actionButtons = useRef(new Map());
            useEffect(()=>{
                const dismiss = event => { if (!event.target.closest('.fc-dataset-card-menu')) setMenuId(null); };
                document.addEventListener('pointerdown',dismiss);
                return ()=>document.removeEventListener('pointerdown',dismiss);
            },[]);
            const refresh = async () => setDatasets((await (await datasetRequest(baseUrl,'/datasets')).json()).datasets);
            useEffect(()=>{
                const controller = new AbortController();
                setBusy(true);
                (async()=>{
                    try {
                        const listing = await (await datasetRequest(baseUrl,'/datasets',{signal:controller.signal})).json();
                        if (controller.signal.aborted) return;
                        setDatasets(listing.datasets);
                        if (listing.datasets.length) {
                            const first = listing.datasets[0];
                            const versions = await (await datasetRequest(baseUrl,`/datasets/${first.id}/versions`,{signal:controller.signal})).json();
                            if (!controller.signal.aborted) setDetail(versions);
                        }
                    } catch(e) { if (!controller.signal.aborted) setError(e.message); }
                    finally { if (!controller.signal.aborted) { setBusy(false);setLoadingLibrary(false); } }
                })();
                return ()=>controller.abort();
            },[baseUrl]);
            const action = async fn => {setBusy(true);setError('');try {await fn();}catch(e){setError(e.message);}finally{setBusy(false);}};
            const select = item => action(async()=>{const result=await (await datasetRequest(baseUrl,`/datasets/${item.id}/versions`)).json();setDetail(result);setHistory(null);setDeleteId(null);setEditId(null);setMenuId(null);});
            const download = (version,kind) => action(async()=>{const response=await datasetRequest(baseUrl,`/datasets/${detail.id}/versions/${version.id}/${kind}`);window.OperartisSecurity.downloadBlob(await response.blob(),kind==='original'?detail.filename:detail.name+'-prepared.csv');});
            return <section className="fc-dataset-library" aria-label={tr("My datasets")}>
                <div className="fc-prep-heading"><h3>{tr("My datasets")}</h3><small>{tr("Private to your account · 100 MB library · 50 datasets")}</small></div>
                <p className="fc-prep-help">{tr("Reopen a saved version to preserve original observations and handling rules. Prepared downloads include estimate flags.")}</p>
                {error && <p role="alert" className="fc-source-error">{tr(error)}</p>}
                <div className="fc-dataset-grid"><div className="fc-dataset-list">{!datasets.length && <p className="fc-dataset-empty-state">{loadingLibrary ? tr('Loading datasets…') : tr('No saved datasets yet. Upload data, review it, then save a version.')}</p>}{datasets.map(item=><div className="fc-dataset-card" data-selected={detail?.id===item.id} key={item.id}>
                    <div className="fc-dataset-card-row">
                        <button type="button" className="fc-dataset-select" disabled={busy} aria-pressed={detail?.id===item.id} onClick={()=>select(item)}><strong>{item.name}</strong><small>{item.filename}</small></button>

                            <button type="button" className="fc-dataset-more" ref={el=>{if(el)actionButtons.current.set(item.id,el);else actionButtons.current.delete(item.id);}} aria-label={tr(`Actions for ${item.name}`)} aria-expanded={menuId===item.id} aria-controls={`dataset-actions-${item.id}`} disabled={busy} onClick={()=>setMenuId(current=>current===item.id?null:item.id)}><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
                            {menuId===item.id && <div className="fc-dataset-menu-panel" id={`dataset-actions-${item.id}`} role="group" aria-label={tr(`Dataset actions for ${item.name}`)}>
                                <button type="button" onClick={()=>{setRename(item.name);setEditId(item.id);setDeleteId(null);setMenuId(null);}}>{tr("Rename")}</button>
                                <button type="button" className="fc-dataset-delete-action" onClick={()=>{setDeleteId(item.id);setEditId(null);setMenuId(null);}}>{tr("Delete")}</button>
                            </div>}

            const importFile = async event => {

                            <div className="fc-calendar-exceptions fc-calendar-holiday-list">{!holidays.length && <p className="fc-calendar-empty">{tr("Holiday suggestions will appear here.")}</p>}{holidays.map(row=>{const state=holidaySuggestionState(row,draft.exceptions,holidayProposals,draft.weekdays);return <div className="fc-calendar-event" key={row.date}><div className="fc-calendar-event-copy"><strong>{row.label}</strong><span>{formatForecastDate(row.date,locale)}</span></div><button type="button" className="fc-source-secondary" disabled={state.opened || state.closedAdded || state.alreadyClosed || state.appliedPending} onClick={()=>{if(state.opened||state.closedAdded||state.alreadyClosed||state.appliedPending)return;if(state.proposed)setHolidayProposals(prev=>prev.filter(item=>item.date!==row.date));else setHolidayProposals(prev=>[...prev,{date:row.date,label:row.label.slice(0,120)}]);setError('');setExceptionConflicts([]);}}>{state.opened?tr('Opened'):state.closedAdded?tr('Added'):state.alreadyClosed?tr('Already closed'):state.proposed?tr('Proposed'):tr('Propose closure')}</button></div>;})}</div>

                    {draft.enabled && !pendingDisable && <CalendarConflictSummary review={review} calendar={calendar} salesResolutions={salesResolutions} update={patch=>{update(patch);if(patch.operating_calendar){setDraft(prev=>({...prev,...patch.operating_calendar}));setError('');setExceptionConflicts([]);}}} locale={locale} />}
                    <div className="fc-calendar-actions"><div className="fc-calendar-action-status" role="status">{hasUnapplied?<><strong>{tr("Changes ready to apply")}</strong><span>{tr("Your preview updates after applying.")}</span></>:applied?<><strong>{review?.closed_count||0} {tr("closed item-days ·")} {review?.conflict_count||0} {tr("conflicts")}</strong><span>{formatForecastDate(calendar.start,locale)} – {formatForecastDate(calendar.end,locale)}</span></>:<span>{tr("No calendar applied")}</span>}</div><div>{!pendingDisable && <button type="button" className="fc-source-secondary" disabled={!hasUnapplied || busy} onClick={discardDraft}>{tr("Discard")}</button>}{!pendingDisable && <button type="button" className="fc-source-confirm" disabled={!hasUnapplied || busy} onClick={apply}>{tr("Apply")}</button>}</div></div>

        const PreparationFrequency = ({frequency,automatic,detectedFrequency,detectionFailed,update,locale='en-US'}) => { const tr=value=>window.ForecastDialogI18n.translate(value,locale); return <div className="fc-prep-frequency"><span className="fc-prep-frequency-title">{tr("Frequency")}</span><select aria-label={tr("Missing data frequency")} value={automatic ? '' : frequency} onChange={e=>update({frequency:e.target.value || null,frequency_confirmed:false})}><option value="">{tr("Detect automatically")}</option>{['hourly','daily','business_daily','weekly','monthly','quarterly','yearly'].map(v=><option key={v} value={v}>{tr(v.replace('_',' '))}</option>)}</select>{automatic && <span className="fc-prep-auto-frequency" role="status">{detectedFrequency ? tr(detectedFrequency.replace('_',' ')) : detectionFailed ? tr('Not detected') : tr('Detecting…')}</span>}</div>; };
        const missingHandlingStatus = (review, current, error) => {

            if (!review || !current) return {readyToConfirm:false,tone:'pending',summary:'Updating handling status…',items:'Updating…'};

        const filterPreparationRecords = (review, itemFilter, onlyUnresolved, openOnly) => {

                (!itemFilter || row.unique_id===itemFilter) &&

                (!openOnly || !row.closed || (onlyUnresolved && row.conflict)));
        };
        const preparationPreviewCells = row => [
            row.unique_id, row.ds,
            row.original ?? ((row.original_kind ?? row.kind)==='absent_period' || (row.original_kind === undefined && row.closed) ? 'Missing period' : 'Empty'),
            row.prepared ?? (row.conflict ? 'Conflict' : 'Unresolved'),
            row.conflict ? 'Calendar conflict · no change' : row.calendar_conflict_resolved || row.calendar_conflict_resolution ? (row.closed || row.calendar_conflict_resolution==='closed' ? 'Closed · conflict resolved' : 'Open · conflict resolved') : row.closed ? (row.original == null ? 'No record · closed' : 'Closed') : PREPARATION_METHODS[row.method] || (row.missing ? 'Unresolved' : 'Observed')
        ];
        const normalizePreviewSearch = value => String(value ?? '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[đĐ]/g, 'd').toLowerCase();
        const previewSearchTerms = query => Array.from(query.matchAll(/"([^"]*)"|(\S+)/g), match=>normalizePreviewSearch(match[1] ?? match[2]).trim()).filter(Boolean);
        const indexPreviewRows = (rows, cells) => rows.map(row=>({row, values:cells(row).map(normalizePreviewSearch)}));
        const searchPreviewRows = (index, terms) => index.filter(({values})=>terms.every(term=>values.some(value=>value.includes(term)))).map(({row})=>row);
        const MissingDataReview = ({review,update,locale='en-US',frequencyAuto,detectedFrequency,detectionFailed,handlingLocked,handlingStatus,recommendationsLocked,previewError}) => {
            const tr=value=>window.ForecastDialogI18n.translate(value,locale);
            const policy=review.policy, affected=review.items.filter(item=>item.missing || item.conflicts);

            return <section className="fc-prep-panel fc-missing-workspace" aria-label={tr("Missing data")}>

        const MissingItemRecommendation = ({recommendation,locale,itemId,method,rows,pending,previewError,valueMethods={},onValueMethod,disabled,handlingControl}) => {

            const previewItemIds = useMemo(()=>preparedPreview
                ? [...new Set((review?.records || []).map(row=>String(row.unique_id)))]
                : [...new Set(rawVerticalRecords.map(row=>row.unique_id).filter(Boolean))],[preparedPreview,review?.records,rawVerticalRecords]);
            const rawPreviewRows = useMemo(()=>filterPreparationRecords({records:searchPreviewRows(rawSearchIndex,searchTerms)},itemFilter,false,false),[rawSearchIndex,searchTerms,itemFilter]);
            const previewRowCount = preparedPreview ? previewRecords.length : rawPreviewRows.length;

            useEffect(()=>{setPage(current=>Math.min(current, Math.max(0, Math.ceil(previewRowCount/pageSize)-1)));},[previewRowCount]);
