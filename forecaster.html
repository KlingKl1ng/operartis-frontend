            const runGenerationRef = useRef(0);
            const skuContestHighlightRef = useRef({});

            // UI State
            const [currentSku, setCurrentSku] = useState(null);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => localStorage.getItem('fc-sidebar-collapsed') === '1');
            const [isLargeScreen, setIsLargeScreen] = useState(() => window.matchMedia('(min-width: 1024px)').matches);
            const showExpandedSidebarContent = !isLargeScreen || !isSidebarCollapsed;
            const sidebarSearchRef = useRef(null);
            const focusSearchOnExpand = useRef(false);
            useEffect(() => {
                if (showExpandedSidebarContent && focusSearchOnExpand.current) {
                    sidebarSearchRef.current?.focus();
                    focusSearchOnExpand.current = false;
                }
            }, [showExpandedSidebarContent]);
            const [isFullScreen, setIsFullScreen] = useState(false);
            const [kpiValuesCollapsed, setKpiValuesCollapsed] = useState(() => localStorage.getItem('fc-kpi-values-collapsed') === '1');
            const toggleKpiValuesCollapsed = useCallback(() => {
                setKpiValuesCollapsed((prev) => {
                    const next = !prev;
                    localStorage.setItem('fc-kpi-values-collapsed', next ? '1' : '0');
                    return next;
                });
            }, []);
            const [isSplitView, setIsSplitView] = useState(true); // For All-In-One
            const [activeTab, setActiveTab] = useState("overview"); // overview | sku id
            const [detailView, setDetailView] = useState("summary");
            const detailTabTouch = useRef(null);
            const selectDetailView = useCallback((view) => {
                setDetailView(view);
            }, []);
            const bindDetailTab = (view) => ({
                onPointerDown: (event) => {
                    detailTabTouch.current = { view, x: event.clientX, y: event.clientY, id: event.pointerId };
                },
                onPointerUp: (event) => {
                    const start = detailTabTouch.current;
                    if (!start || start.view !== view || start.id !== event.pointerId) return;
                    if (Math.hypot(event.clientX - start.x, event.clientY - start.y) > 12) {
                        detailTabTouch.current = null;
                        return;
                    }
                    detailTabTouch.current = null;
                    selectDetailView(view);
                },
                onPointerCancel: () => { detailTabTouch.current = null; },
                onTouchStart: (event) => {
                    const touch = event.changedTouches[0];
                    if (!touch) return;
                    detailTabTouch.current = { view, x: touch.clientX, y: touch.clientY, id: 'touch' };
                },
                onTouchEnd: (event) => {
                    const start = detailTabTouch.current;
                    const touch = event.changedTouches[0];
                    detailTabTouch.current = null;
                    if (!start || start.view !== view || !touch) return;
                    if (Math.hypot(touch.clientX - start.x, touch.clientY - start.y) > 12) return;
                    event.stopPropagation();
                    selectDetailView(view);
                },
                onClick: (event) => {
                    event.stopPropagation();
                    selectDetailView(view);
                },
            });
            // Survives detail-panel unmounts; obsolete results can be collected.
            const replayPositions = useRef(new WeakMap());
            const [validationInformation, setValidationInformation] = useState(null);
            const closeValidationInformation = useCallback(() => setValidationInformation(null), []);
            const [overviewSearchQuery, setOverviewSearchQuery] = useState("");
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [settingsTab, setSettingsTab] = useState('theme');
            const [isMappingModalOpen, setIsMappingModalOpen] = useState(false);
            const [theme, setTheme] = useOperartisTheme();
            const [isDark, setIsDark] = useState(() => document.documentElement.classList.contains('dark'));

            useEffect(() => {
                const syncDark = () => setIsDark(document.documentElement.classList.contains('dark'));
                window.addEventListener('operartis:theme-change', syncDark);
                return () => window.removeEventListener('operartis:theme-change', syncDark);
            }, []);

            useEffect(() => {
                const openSettings = () => {
                    setSettingsTab('theme');
                    setIsSettingsOpen(true);
                };
                window.addEventListener('operartis:open-settings', openSettings);
                return () => window.removeEventListener('operartis:open-settings', openSettings);
            }, []);

            useEffect(() => {
                const media = window.matchMedia('(min-width: 1024px)');
                const syncLargeScreen = () => setIsLargeScreen(media.matches);
                syncLargeScreen();
                if (typeof media.addEventListener === 'function') {
                    media.addEventListener('change', syncLargeScreen);
                    return () => media.removeEventListener('change', syncLargeScreen);
                }
                media.addListener(syncLargeScreen);
                return () => media.removeListener(syncLargeScreen);
            }, []);

            // API State
            const [apiUrl, setApiUrl] = useState(API_ENDPOINTS.PROD);
            const [connectionStatus, setConnectionStatus] = useState('checking');
            const [forecastCapabilities, setForecastCapabilities] = useState({
                status: 'loading',
                cloudEnabled: false,
                supportedModels: [],
                frequencyProfiles: parseFrequencyProfiles(),
            });
            const maxValidationEvaluations = forecastCapabilities.maxValidationEvaluations || 5;
            const validationEvaluations = adaptiveValidation ? Math.max(0, Math.min(maxValidationEvaluations, Number(testHorizon) - Number(forecastSteps) + 1)) : 1;
            const [inferredFrequency, setInferredFrequency] = useState('monthly');
            const [capabilityRefreshToken, setCapabilityRefreshToken] = useState(0);
            const deploymentEnvironment = getDeploymentEnvironment();
            const environmentBadge = getEnvironmentBadgeConfig(deploymentEnvironment);
            const BASE_URL = apiUrl;

            // Force re-render on resize/rotate to fix chart scaling
            const [layoutKey, setLayoutKey] = useState(0);
            useEffect(() => {
                let timeoutId;
                const handleResize = () => {
                    clearTimeout(timeoutId);
                    timeoutId = setTimeout(() => setLayoutKey(prev => prev + 1), 200);
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            // Persist sidebar collapse state + nudge chart layout to re-measure after the width transition
            useEffect(() => {
                localStorage.setItem('fc-sidebar-collapsed', isSidebarCollapsed ? '1' : '0');
                const id = setTimeout(() => setLayoutKey(prev => prev + 1), 320);
                return () => clearTimeout(id);
            }, [isSidebarCollapsed]);

            const [mappingSource, setMappingSource] = useState(null);
            const [confirmedInputSource, setConfirmedInputSource] = useState(null);
            const openSourceDialog = (edit = false) => {
                if (isRunning) return;
                setMappingSource(edit ? confirmedInputSource : null);
                setIsMappingModalOpen(true);
            };

            // --- EFFECTS ---
            useEffect(() => {
                const checkConnection = async () => {
                    const isLocal = deploymentEnvironment === 'local';
                    if (!isLocal) { setApiUrl(API_ENDPOINTS.PROD); setConnectionStatus('cloud'); return; }
                    try {
                        const controller = new AbortController();
                        setTimeout(() => controller.abort(), 2000);
                        const res = await fetch(`${API_ENDPOINTS.LOCAL}/`, { method: 'GET', signal: controller.signal });
                        if (res.ok || res.status === 404) { setApiUrl(API_ENDPOINTS.LOCAL); setConnectionStatus('local'); }
                        else throw new Error('Err');
                    } catch (e) { setApiUrl(API_ENDPOINTS.PROD); setConnectionStatus('cloud'); }
                };
                checkConnection();
            }, [deploymentEnvironment]);

            useEffect(() => {
                const refreshCapabilities = () => setCapabilityRefreshToken((current) => current + 1);
                window.addEventListener('operartis:authenticated', refreshCapabilities);
                return () => window.removeEventListener('operartis:authenticated', refreshCapabilities);
            }, []);

            useEffect(() => {
                let disposed = false;
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);

                const loadForecastCapabilities = async () => {
                    setForecastCapabilities({
                        status: 'loading',
                        cloudEnabled: false,
                        supportedModels: [],
                        frequencyProfiles: parseFrequencyProfiles(),
                    });
                    try {
                        const response = await fetch(`${BASE_URL}${FORECAST_CAPABILITY_PATH}`, {
                            method: 'GET',
                            signal: controller.signal,
                        });
                        if (!response.ok) throw new Error(`Capability request failed (${response.status})`);
                        const parsed = parseForecastCapabilities(await response.json());
                        if (disposed) return;
                        setForecastCapabilities({ status: 'ready', ...parsed });
                        const readyCapabilities = { status: 'ready', ...parsed };
                        const available = availableVisibleForecastModels(readyCapabilities, visibleModelsRef.current);
                        setSelectedModels(available.length ? available : orderedSelectedModels(visibleModelsRef.current));
                    } catch (capabilityError) {
                        if (disposed) return;
                        const unavailableCapabilities = {
                            status: 'unavailable',
                            cloudEnabled: false,
                            supportedModels: [],
                            frequencyProfiles: parseFrequencyProfiles(),
                        };
                        setForecastCapabilities(unavailableCapabilities);
                        const available = availableVisibleForecastModels(unavailableCapabilities, visibleModelsRef.current);
                        setSelectedModels(available.length ? available : orderedSelectedModels(visibleModelsRef.current));
                        if (capabilityError.name !== 'AbortError') {
                            console.warn('Cloud forecasting capabilities unavailable:', capabilityError);
                        }
                    } finally {
                        clearTimeout(timeoutId);
                    }
                };

                loadForecastCapabilities();
                return () => {
                    disposed = true;
                    clearTimeout(timeoutId);
                    controller.abort();
                };
            }, [BASE_URL, capabilityRefreshToken]);

            // Toggle mobile scroll behavior based on results presence - DISABLE for fixed view
            // useEffect(() => {
            //     if (batchResults && batchResults.length > 0) {
            //         document.body.classList.add('mobile-result-scroll');
            //     } else {
            //         document.body.classList.remove('mobile-result-scroll');
            //     }
            // }, [batchResults]);

            // Language State
            const [lang, setLang] = useState(() => window.getOperartisLang());
            useEffect(() => {
                const handler = (event) => {
                    const nextLang = (event.detail && event.detail.lang) || window.getOperartisLang();
                    setLang(prev => prev === nextLang ? prev : nextLang);
                };
                window.addEventListener('operartis:lang-change', handler);
                return () => window.removeEventListener('operartis:lang-change', handler);
            }, []);
            useEffect(() => { window.persistOperartisLang(lang); }, [lang]);
            useEffect(() => {
                if (!modelPickerOpen && !validationPickerOpen && !metricPickerOpen && !valueDomainPickerOpen) return undefined;
                const onPointer = (event) => {
                    if (modelPickerRef.current && !modelPickerRef.current.contains(event.target)) {
                        setModelPickerOpen(false);
                    }
                    if (validationPickerRef.current && !validationPickerRef.current.contains(event.target)) {
                        setValidationPickerOpen(false);
                    }
                    if (metricPickerRef.current && !metricPickerRef.current.contains(event.target)) {
                        setMetricPickerOpen(false);
                    }
                    if (valueDomainPickerRef.current && !valueDomainPickerRef.current.contains(event.target)) {
                        setValueDomainPickerOpen(false);
                    }
                };
                const onKey = (event) => {
                    if (event.key === 'Escape') {
                        setModelPickerOpen(false);
                        setValidationPickerOpen(false);
                        setMetricPickerOpen(false);
                        setValueDomainPickerOpen(false);
                    }
                };
                document.addEventListener('mousedown', onPointer);
                document.addEventListener('keydown', onKey);
                return () => {
                    document.removeEventListener('mousedown', onPointer);
                    document.removeEventListener('keydown', onKey);
                };
            }, [modelPickerOpen, validationPickerOpen, metricPickerOpen, valueDomainPickerOpen]);
            useEffect(() => {
                if (isPolling || runningSkus.length > 0 || isCancelling) {
                    setModelPickerOpen(false);
                    setValidationPickerOpen(false);
                    setMetricPickerOpen(false);
                    setValueDomainPickerOpen(false);
                }
            }, [isPolling, runningSkus, isCancelling]);

            const t = useMemo(() => {
                const translate = (key) => {
                    const keys = key.split('.');
                    let val = TRANSLATIONS[lang] || TRANSLATIONS.en;
                    for (const k of keys) {
                        val = val ? val[k] : null;
                    }
                    if (val != null) return val;
                    let fallback = TRANSLATIONS.en;
                    for (const k of keys) {
                        fallback = fallback ? fallback[k] : null;
                    }
                    return fallback || key;
                };

                translate.numberLocale = numberLocaleForLanguage(lang);
                return translate;
            }, [lang]);

            const isForecastModelAvailable = (candidate) => forecastModelAvailable(candidate, forecastCapabilities);
            const hasAvailableAdvancedModels = SELECTABLE_FORECAST_MODELS.some(
                (option) => option.advanced && isForecastModelAvailable(option.value)
            );
            const modelType = deriveModelType(selectedModels);
            const frequencyProfiles = forecastCapabilities.frequencyProfiles || parseFrequencyProfiles();
            const invalidFrequency = totalTimeSeries > 0 && !frequencyProfiles[inferredFrequency];
            const activeFrequencyProfile = frequencyProfiles[inferredFrequency] || {};
            const maxTrainHorizon = Number(activeFrequencyProfile.max_train_horizon) || 240;
            const maxTestHorizon = Number(activeFrequencyProfile.max_test_horizon) || 60;
            const maxForecastHorizon = Number(activeFrequencyProfile.max_forecast_horizon) || 60;
            const maxHistoryColumns = Number(activeFrequencyProfile.max_history_columns) || 240;
            const historyTooLong = totalTimeSeries > 0 && totalTimeSeries > maxHistoryColumns;

            const recommendedValidationSplit = recommendValidationSplit({
                total: totalTimeSeries,
                horizon: Number(forecastSteps),
                models: selectedModels.filter(isForecastModelAvailable),
                profile: frequencyProfiles[inferredFrequency],
                maxEvaluations: maxValidationEvaluations,
            });
            const recommendedTrain = recommendedValidationSplit?.train;
            const recommendedTest = recommendedValidationSplit?.test;
            useEffect(() => {
                if (!adaptiveValidation || !automaticValidationSplit || recommendedTest == null) return;
                setTrainHorizon(String(recommendedTrain));
                setTestHorizon(String(recommendedTest));
            }, [adaptiveValidation, automaticValidationSplit, recommendedTrain, recommendedTest]);

            const simpleSplitInvalid = !adaptiveValidation && totalTimeSeries > 0 && (
                !Number.isInteger(Number(forecastSteps)) || Number(forecastSteps) < 1
                || Number(forecastSteps) > Math.min(maxForecastHorizon, maxTestHorizon)
                || totalTimeSeries - Number(forecastSteps) < 4
                || totalTimeSeries - Number(forecastSteps) > maxTrainHorizon
            );
            useEffect(() => {
                if (adaptiveValidation) return;
                setTestHorizon(forecastSteps);
                if (totalTimeSeries > 0) {
                    const horizon = Number(forecastSteps);
                    setTrainHorizon(Number.isInteger(horizon) && horizon > 0
                        ? String(Math.max(0, totalTimeSeries - horizon)) : '');
                }
            }, [adaptiveValidation, forecastSteps, totalTimeSeries]);

            // --- POLLING (merge partial results as each SKU completes) ---
            useEffect(() => {
                let disposed = false;
                let timeoutId = null;
                let activeController = null;
                if (isPolling && jobId) {
                    const polledJobId = jobId;
                    const generation = runGenerationRef.current;
                    let unchangedPolls = 0;
                    let lastCompleted = -1;
                    let lastStatus = '';
                    let pollBackend = executionBackend || (
                        isAdvancedModelType(jobModelType, jobSelectedModels) && forecastCapabilities.cloudEnabled
                            ? 'cloud'
                            : 'local'
                    );

                    const scheduleNextPoll = (hadError) => {
                        if (disposed || generation !== runGenerationRef.current) return;
                        const delay = getAdaptivePollDelay({
                            cloud: pollBackend === 'cloud',
                            unchangedPolls,
                            hadError,
                        });
                        timeoutId = setTimeout(pollOnce, delay);
                    };

                    const pollOnce = async () => {
                        let shouldContinue = true;
                        let hadError = false;
                        activeController = new AbortController();
                        try {
                            const res = await fetch(`${BASE_URL}/batch_status/${encodeURIComponent(polledJobId)}`, {
                                method: 'GET',
                                signal: activeController.signal,
                            });
                            if (!res.ok) {
                                throw new Error(await readResponseError(res, `Status request failed (${res.status})`));
                            }
                            const data = await res.json();
                            if (disposed || generation !== runGenerationRef.current) {
                                shouldContinue = false;
                                return;
                            }

                            const responseBackend = normalizeExecutionBackend(data.execution_backend || data.backend);
                            if (responseBackend) {
                                pollBackend = responseBackend;
                                setExecutionBackend(responseBackend);
                            }

                            const incoming = data.result?.results || [];
                            if (incoming.length > 0) {
                                setBatchResults((prev) => mergeForecastResults(prev, incoming));
                                const done = new Set(incoming.map((r) => String(r.sku)));
                                setRunningSkus((prev) => prev.filter((sku) => !done.has(String(sku))));
                            }

                            const parsedTotal = data.total_count != null ? Number(data.total_count) : null;
                            const parsedCompleted = data.completed_count != null ? Number(data.completed_count) : incoming.length;
                            const totalCount = Number.isFinite(parsedTotal) && parsedTotal >= 0 ? parsedTotal : 0;
                            const completedCount = Number.isFinite(parsedCompleted) && parsedCompleted >= 0 ? parsedCompleted : incoming.length;
                            setJobProgress((previous) => ({
                                queuePosition: Math.max(0, Number(data.queue_position) || 0),
                                completed: Math.max(previous.completed, completedCount),
                                total: totalCount > 0 ? totalCount : previous.total,
                            }));

                            const responseStatus = normalizeJobStatus(data.status);
                            const effectiveStatus = responseStatus;
                            setJobStatus(effectiveStatus);

                            const progressChanged = completedCount > lastCompleted || effectiveStatus !== lastStatus;
                            unchangedPolls = progressChanged ? 0 : unchangedPolls + 1;
                            lastCompleted = Math.max(lastCompleted, completedCount);
                            lastStatus = effectiveStatus;

                            if (TERMINAL_JOB_STATUSES.has(effectiveStatus)) {
                                shouldContinue = false;
                                setIsPolling(false);
                                setRunningSkus([]);
                                if (effectiveStatus === 'failed') {
                                    setError(data.error || "Job failed");
                                } else if (effectiveStatus === 'completed') {
                                    setCompletedJobIds((previous) => (
                                        previous.includes(polledJobId)
                                            ? previous
                                            : [...previous, polledJobId]
                                    ));
                                    window.OperartisApi?.broadcastDashboardDataChanged?.('forecaster-completed');
                                } else {
                                    window.OperartisApi?.broadcastDashboardDataChanged?.('forecaster-canceled');
                                }
                            }
                        } catch (e) {
                            if (disposed || generation !== runGenerationRef.current || e.name === 'AbortError') {
                                shouldContinue = false;
                                return;
                            }
                            hadError = true;
                            unchangedPolls += 1;
                            console.error('Forecast status polling failed:', e);
                        } finally {
                            activeController = null;
                            if (shouldContinue) scheduleNextPoll(hadError);
                        }
                    };
                    pollOnce();
                }
                return () => {
                    disposed = true;
                    clearTimeout(timeoutId);
                    if (activeController) activeController.abort();
                };
            }, [isPolling, jobId, BASE_URL, jobModelType, jobSelectedModels]);

            // --- HANDLERS ---
            const handleMappingConfirm = (sku, start, end, source) => {
                if (isRunning || !source || !(source.analysis || inspectForecastMapping(source)).valid) return;
                const { headers, rows, mapping } = source;
                sku = mapping.sku;
                start = mapping.start || mapping.date;
                end = mapping.end || mapping.value;
                setFile(source.file);
                setAvailableCols(headers);
                setSheetRows(rows);
                setConfirmedInputSource(source);
                setSkuCol(sku);
                setStartCol(start);
                setEndCol(end);
                setIsMappingModalOpen(false);

                // Calculate and store column indices immediately
                const skuIdx = headers.indexOf(sku);
                const startIdx = headers.indexOf(start);
                const endIdx = headers.indexOf(end);

                setSkuColIdx(skuIdx);
                setStartColIdx(startIdx);
                setEndColIdx(endIdx);

                console.log('Mapping confirmed - Indices:', { skuIdx, startIdx, endIdx });

                // Build Main Table SKU list from mapped data (pre-forecast)
                const seen = new Set();
                const skus = [];
                if (skuIdx >= 0) {
                    for (const row of rows) {
                        if (!row || row[skuIdx] == null || row[skuIdx] === '') continue;
                        const value = String(row[skuIdx]).trim();
                        if (!value || seen.has(value)) continue;
                        seen.add(value);
                        skus.push(value);
                    }
                }
                setMappedSkus(skus);
                setItemTabs([]);
                setSelectedSkus(skus);
                setRunningSkus([]);
                setSkuValidationMethods({});
                setOverviewSearchQuery("");
                setActiveTab("overview");
                setCurrentSku(null);
                setBatchResults(null);
                ++runGenerationRef.current;
                setJobId(null);
                setCompletedJobIds([]);
                setIsPolling(false);
                setJobStatus(null);
                setJobModelType(null);
                setExecutionBackend(null);
                setJobProgress({ completed: 0, total: 0, queuePosition: 0 });
                setIsCancelling(false);

                const { count: total, frequency } = source.analysis || inspectForecastMapping(source);
                const profile = (forecastCapabilities.frequencyProfiles || parseFrequencyProfiles())[frequency]
                    || {};
                setInferredFrequency(frequency);
                setError(frequency === 'unsupported' ? t('sidebar.frequency_unsupported') : null);
                setTotalTimeSeries(total);

                // Set initial values: Test = 6, Train = Total - 6, Forecast = Test
                const initialTest = Math.min(
                    6,
                    Math.floor(total / 2),
                    Number(profile.max_test_horizon) || 6
                );
                const initialTrain = Math.min(
                    Math.max(4, total - initialTest),
                    Number(profile.max_train_horizon) || total
                );
                const initialForecast = Math.min(initialTest, Number(profile.max_forecast_horizon) || initialTest);
                const initialSplit = adaptiveValidation ? recommendValidationSplit({
                    total, horizon: initialForecast, profile,
                    models: selectedModels.filter(isForecastModelAvailable),
                    maxEvaluations: maxValidationEvaluations,
                }) : null;
                setAutomaticValidationSplit(true);
                setTestHorizon(String(initialSplit?.test ?? initialTest));
                setTrainHorizon(String(initialSplit?.train ?? initialTrain));
                setForecastSteps(String(initialForecast));
            };

            const startBatchForSkus = async (skusToRun) => {
                if (!skusToRun.length) return;
                if (simpleSplitInvalid) {
                    setAlertMessage(t('sidebar.validation_simple_invalid'));
                    return;
                }
                if (validationHorizonTooShort) {
                    setAlertMessage(t('sidebar.validation_short'));
                    return;
                }
                if (invalidFrequency) {
                    setAlertMessage(t('sidebar.frequency_unsupported'));
                    return;
                }
                if (historyTooLong) {
                    setAlertMessage(
                        t('sidebar.history_too_long')
                            .replace('{frequency}', t(`sidebar.freq_${inferredFrequency}`))
                            .replace('{count}', fmtNumber(totalTimeSeries, 0, 0, t.numberLocale))
                            .replace('{max}', fmtNumber(maxHistoryColumns, 0, 0, t.numberLocale))
                    );
                    return;
                }
                const selectedModelType = deriveModelType(selectedModels);
                if (!selectedModels.length) {
                    setAlertMessage(t('sidebar.models_required'));
                    return;
                }
                if (selectionUsesHeavy(selectedModels) && selectedModels.some((code) => (
                    HEAVY_SELECTABLE_MODELS.has(code) && !isForecastModelAvailable(code)
                ))) {
                    setAlertMessage(t('sidebar.models_unavailable'));
                    return;
                }

                const rerunSet = new Set(skusToRun.map(String));
                // Bump generation so any in-flight poll from a prior job is ignored.
                const generation = ++runGenerationRef.current;

                // Show Processing on the Run button immediately; clear jobId so we do not
                // keep polling the previous job while /batch_init is in flight.
                setIsPolling(true);
                setJobId(null);

                // Drop previous metrics/charts for SKUs being re-run so only the newest run is shown.
                setBatchResults((prev) => {
                    if (!prev?.length) return null;
                    const next = prev.filter((r) => !rerunSet.has(String(r.sku)));
                    return next.length ? next : null;
                });
                setItemTabs((prev) => prev.filter((sku) => !rerunSet.has(String(sku))));
                setCurrentSku((prev) => (prev && rerunSet.has(String(prev)) ? null : prev));
                setActiveTab("overview");

                setError(null);
                setJobStatus("queued");
                setJobModelType(selectedModelType);
                setJobSelectedModels([...selectedModels]);
                setExecutionBackend(
                    selectionUsesHeavy(selectedModels) && forecastCapabilities.cloudEnabled
                        ? 'cloud'
                        : 'local'
                );
                setJobProgress({ completed: 0, total: skusToRun.length, queuePosition: 0 });
                setIsCancelling(false);
                setRunningSkus(skusToRun);
                setSkuValidationMethods((prev) => {
                    const next = { ...prev };
                    for (const sku of skusToRun) next[String(sku)] = validationMethod;
                    return next;
                });
                console.log('Execute with indices:', { skuColIdx, startColIdx, endColIdx, selectedSkus, skusToRun });

                const fd = new FormData();
                appendForecastSourceForm(fd, confirmedInputSource);
                fd.append('model_type', selectedModelType);
                fd.append('selected_models', JSON.stringify(orderedSelectedModels(selectedModels)));
                fd.append('validation_method', validationMethod);
                fd.append('evaluation_metric', normalizeContestMetric(evaluationMetric));
                fd.append('value_domain', normalizeValueDomain(valueDomain));
                fd.append('train_horizon', parseInt(trainHorizon) || 24);
                fd.append('test_horizon', parseInt(testHorizon) || 6);
                fd.append('forecast_steps', parseInt(forecastSteps) || 6);
                fd.append('selected_skus', JSON.stringify(skusToRun));

                try {
                    const res = await fetch(`${BASE_URL}/batch_init`, { method: 'POST', body: fd });
                    if (generation !== runGenerationRef.current) return;
                    if (!res.ok) {
                        const message = await readResponseError(res, "Failed to start job");
                        setIsPolling(false);
                        setRunningSkus([]);
                        throw new Error(typeof message === 'string' ? message : "Failed to start job");
                    }
                    const data = await res.json();
                    if (generation !== runGenerationRef.current) return;
                    if (!data.job_id) throw new Error("Forecast job ID was not returned");
                    setJobId(data.job_id);
                    setJobStatus(normalizeJobStatus(data.status || 'queued'));
                    setExecutionBackend(
                        normalizeExecutionBackend(data.execution_backend || data.backend)
                        || (
                            selectionUsesHeavy(selectedModels) && forecastCapabilities.cloudEnabled
                                ? 'cloud'
                                : 'local'
                        )
                    );
                    setJobProgress((previous) => ({
                                queuePosition: Math.max(0, Number(data.queue_position) || 0),
                        completed: Number.isFinite(Number(data.completed_count)) ? Number(data.completed_count) : previous.completed,
                        total: Number.isFinite(Number(data.total_count)) && Number(data.total_count) > 0
                            ? Number(data.total_count)
                            : previous.total,
                    }));
                } catch (e) {
                    if (generation !== runGenerationRef.current) return;
                    setIsPolling(false);
                    setRunningSkus([]);
                    setJobStatus('failed');
                    setError(e.message);
                    setAlertMessage(e.message);
                }
            };

            const handleExecute = async () => {
                if (!file || !skuCol || !startCol || !endCol) { setError("Please select file and map columns."); return; }
                if (skuColIdx < 0 || startColIdx < 0 || endColIdx < 0) { setError("Invalid column mapping. Please re-map columns."); return; }
                if (!selectedSkus.length) {
                    setAlertMessage(t('dashboard.select_required'));
                    return;
                }
                if (selectedSkus.length > 100) {
                    setAlertMessage(t('job.max_skus'));
                    return;
                }
                if (invalidFrequency) {
                    setAlertMessage(t('sidebar.frequency_unsupported'));
                    return;
                }
                if (historyTooLong) {
                    setAlertMessage(
                        t('sidebar.history_too_long')
                            .replace('{frequency}', t(`sidebar.freq_${inferredFrequency}`))
                            .replace('{count}', fmtNumber(totalTimeSeries, 0, 0, t.numberLocale))
                            .replace('{max}', fmtNumber(maxHistoryColumns, 0, 0, t.numberLocale))
                    );
                    return;
                }

                const completedSkus = new Set((batchResults || []).map((r) => String(r.sku)));
                const hasAlreadyProcessed = selectedSkus.some((sku) => completedSkus.has(String(sku)));
                if (hasAlreadyProcessed) {
                    setRerunConfirmOpen(true);
                    return;
                }

                await startBatchForSkus(selectedSkus);
            };

            const handleConfirmRerun = async () => {
                setRerunConfirmOpen(false);
                await startBatchForSkus(selectedSkus);
            };

            const handleCancelJob = async () => {
                if (!jobId || isCancelling || TERMINAL_JOB_STATUSES.has(normalizeJobStatus(jobStatus))) return;
                const cancelJobId = jobId;
                const previousStatus = jobStatus;
                const previousRunningSkus = [...runningSkus];
                const generation = ++runGenerationRef.current;

                setIsCancelling(true);
                setIsPolling(false);
                setJobStatus('cancel_requested');
                setRunningSkus([]);

                try {
                    const response = await fetch(`${BASE_URL}/batch_cancel/${encodeURIComponent(cancelJobId)}`, {
                        method: 'POST',
                    });
                    if (!response.ok) {
                        throw new Error(await readResponseError(response, t('job.cancel_failed')));
                    }
                    const data = await response.json().catch(() => ({}));
                    if (generation !== runGenerationRef.current) return;

                    const canceledStatus = normalizeJobStatus(data.status || 'canceled');
                    const responseBackend = normalizeExecutionBackend(data.execution_backend || data.backend);
                    if (responseBackend) setExecutionBackend(responseBackend);
                    setJobStatus(canceledStatus);
                    setJobProgress((previous) => ({
                                queuePosition: Math.max(0, Number(data.queue_position) || 0),
                        completed: Number.isFinite(Number(data.completed_count))
                            ? Math.max(previous.completed, Number(data.completed_count))
                            : previous.completed,
                        total: Number.isFinite(Number(data.total_count)) && Number(data.total_count) > 0
                            ? Number(data.total_count)
                            : previous.total,
                    }));

                    if (TERMINAL_JOB_STATUSES.has(canceledStatus)) {
                        setIsPolling(false);
                        setRunningSkus([]);
                    } else {
                        setIsPolling(true);
                    }
                } catch (cancelError) {
                    if (generation !== runGenerationRef.current) return;
                    setError(cancelError.message);
                    setAlertMessage(t('job.cancel_failed'));
                    setJobStatus(previousStatus || 'processing');
                    setRunningSkus(previousRunningSkus);
                    setIsPolling(true);
                } finally {
                    if (generation === runGenerationRef.current) setIsCancelling(false);
                }
            };

            const handleExport = async () => {
                if (!file || !skuCol || !startCol || !endCol) { setError("Please load and map data first."); return; }
                if (isExporting) return;
                const exportSelected = jobId && jobSelectedModels && jobSelectedModels.length
                    ? jobSelectedModels
                    : selectedModels;
                const exportModelType = jobId && jobModelType ? jobModelType : modelType;
                const advancedExport = isAdvancedModelType(exportModelType, exportSelected);
                if (advancedExport && (
                    normalizeJobStatus(jobStatus) !== 'completed'
                    || completedJobIds.length === 0
                    || !batchResults
                    || batchResults.length === 0
                )) {
                    setAlertMessage(t('job.advanced_export_required'));
                    return;
                }
                setIsExporting(true);

                // Use fast export if cached results are available
                if (batchResults && batchResults.length > 0) {
                    const fd = new FormData();
                    appendForecastSourceForm(fd, confirmedInputSource);
                    fd.append('validation_method', validationMethod);
                    fd.append('forecast_steps', parseInt(forecastSteps) || 6);
                    fd.append('cached_results', JSON.stringify(batchResults));
                    fd.append('job_id', jobId || '');
                    fd.append('job_ids', JSON.stringify(completedJobIds));

                    try {
                        const res = await fetch(`${BASE_URL}/export-fast`, { method: 'POST', body: fd });
                        if (!res.ok) throw new Error(await readResponseError(res, "Export failed"));
                        const inputBaseName = file.name.replace(/\.[^/.]+$/, "");
                        const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                        let filename = `Operartis_Forecast_${inputBaseName}_${timestamp}.xlsx`;
                        const disposition = res.headers.get('Content-Disposition');
                        if (disposition && disposition.indexOf('attachment') !== -1) {
                            const filenameRegex = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/;
                            const matches = filenameRegex.exec(disposition);
                            if (matches != null && matches[1]) {
                                filename = matches[1].replace(/['"]/g, '');
                            }
                        }
                        const blob = await res.blob();
                        window.OperartisSecurity.downloadBlob(blob, filename);
                    } catch (e) { setError(e.message); }
                    finally { setIsExporting(false); }
                } else {
                    // Basic/local-only fallback. Advanced profiles must use persisted /export-fast results.
                    if (advancedExport) {
                        setIsExporting(false);
                        setAlertMessage(t('job.advanced_export_required'));
                        return;
                    }
                    const fd = new FormData();
                    appendForecastSourceForm(fd, confirmedInputSource);
                    fd.append('model_type', exportModelType);
                    fd.append('selected_models', JSON.stringify(exportSelected));
                    fd.append('validation_method', validationMethod);
                    fd.append('evaluation_metric', normalizeContestMetric(evaluationMetric));
                    fd.append('value_domain', normalizeValueDomain(valueDomain));
                    fd.append('train_horizon', parseInt(trainHorizon) || 24);
                    fd.append('test_horizon', parseInt(testHorizon) || 6);
                    fd.append('forecast_steps', parseInt(forecastSteps) || 6);

                    try {
                        const res = await fetch(`${BASE_URL}/export`, { method: 'POST', body: fd });
                        if (!res.ok) throw new Error(await readResponseError(res, "Export failed"));
                        const inputBaseName = file.name.replace(/\.[^/.]+$/, "");
                        const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                        let filename = `Operartis_Forecast_${inputBaseName}_${timestamp}.xlsx`;
                        const disposition = res.headers.get('Content-Disposition');
                        if (disposition && disposition.indexOf('attachment') !== -1) {
                            const filenameRegex = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/;
                            const matches = filenameRegex.exec(disposition);
                            if (matches != null && matches[1]) {
                                filename = matches[1].replace(/['"]/g, '');
                            }
                        }
                        const blob = await res.blob();
                        window.OperartisSecurity.downloadBlob(blob, filename);
                    } catch (e) { setError(e.message); }
                    finally { setIsExporting(false); }
                }
            };

            const handleReset = () => {
                ++runGenerationRef.current;
                setFile(null); setBatchResults(null); setJobId(null); setCompletedJobIds([]); setIsPolling(false); setError(null);
                setJobStatus(null); setJobModelType(null); setJobSelectedModels(null); setExecutionBackend(null);
                setModelPickerOpen(false);
                setValidationPickerOpen(false);
                setMetricPickerOpen(false);
                setValueDomainPickerOpen(false);
                setJobProgress({ completed: 0, total: 0, queuePosition: 0 }); setIsCancelling(false);
                setSkuCol(""); setStartCol(""); setEndCol("");
                setSkuColIdx(-1); setStartColIdx(-1); setEndColIdx(-1);
                setTotalTimeSeries(0); setAvailableCols([]);
                setInferredFrequency('monthly');
                setSheetRows([]); setMappedSkus([]); setItemTabs([]);
                setSelectedSkus([]);
                setRunningSkus([]);
                setCurrentSku(null);
                setOverviewSearchQuery("");
                setActiveTab("overview");
                setSkuValidationMethods({});
                setMappingSource(null);
                setConfirmedInputSource(null);
                setIsMappingModalOpen(false);
            };

            const handleSkuSelect = (sku) => {
                if (batchResults && batchResults.find(r => r.sku === sku)) {
                    setCurrentSku(sku);
                    setItemTabs((prev) => (prev.includes(sku) ? prev : [...prev, sku]));
                    setActiveTab(sku);
                }
            };

            const handleToggleSkuSelection = useCallback((sku) => {
                setSelectedSkus((prev) => (
                    prev.includes(sku) ? prev.filter((s) => s !== sku) : [...prev, sku]
                ));
            }, []);

            const handleToggleSelectAll = useCallback(() => {
                setSelectedSkus((prev) => (
                    mappedSkus.length > 0 && prev.length === mappedSkus.length ? [] : [...mappedSkus]
                ));
            }, [mappedSkus]);

            const handleCloseItemTab = (sku) => {
                setItemTabs((prev) => prev.filter((s) => s !== sku));
                if (activeTab === sku) {
                    setActiveTab("overview");
                    setCurrentSku(null);
                }
            };

            const handleReorderItemTabs = useCallback((fromSku, toSku) => {
                setItemTabs((prev) => {
                    const from = prev.indexOf(fromSku);
                    const to = prev.indexOf(toSku);
                    if (from < 0 || to < 0 || from === to) return prev;
                    const next = [...prev];
                    const [moved] = next.splice(from, 1);
                    next.splice(to, 0, moved);
                    return next;
                });
            }, []);



            const getCurrentSkuData = () => {
                if (!batchResults) return null;
                const targetSku = activeTab !== 'overview' ? activeTab : currentSku;
                if (!targetSku) return null;
                return batchResults.find(r => r.sku === targetSku);
            };

            const skuData = getCurrentSkuData();
            const interfaceReady = !!(batchResults && batchResults.length > 0);
            const mappingReady = mappedSkus.length > 0;
            const isDetailTab = activeTab !== 'overview' && !!skuData;
            // Keep Run button in sync with Overview row status (not only the poll flag).
            const isRunning = isPolling || runningSkus.length > 0 || isCancelling;
            const normalizedJobStatus = jobStatus ? normalizeJobStatus(jobStatus) : null;
            const canCancelJob = !!jobId
                && !!normalizedJobStatus
                && !TERMINAL_JOB_STATUSES.has(normalizedJobStatus)
                && normalizedJobStatus !== 'cancel_requested';
            const visibleModelOptions = SELECTABLE_FORECAST_MODELS.filter((option) => {
                if (!visibleModels.includes(option.value)) return false;
                const checking = !option.disabled && option.advanced && forecastCapabilities.status === 'loading';
                return checking || isForecastModelAvailable(option.value);
            });
            const availableSelectableCodes = visibleModelOptions
                .filter((option) => isForecastModelAvailable(option.value))
                .map((option) => option.value);
            const allAvailableSelected = availableSelectableCodes.length > 0
                && availableSelectableCodes.every((code) => selectedModels.includes(code));
            const modelPickerSummary = (() => {
                const selected = orderedSelectedModels(selectedModels);
                if (!selected.length) return t('sidebar.models_required');
                if (allAvailableSelected) return t(visibleModels.length === SELECTABLE_FORECAST_MODELS.length ? 'sidebar.models_all' : 'settings.models_all_listed');
                if (selected.length <= 4) {
                    return selected.map((code) => {
                        const option = SELECTABLE_FORECAST_MODELS.find((item) => item.value === code);
                        return option ? t(option.labelKey) : code.toUpperCase();
                    }).join(', ');
                }
                return t('sidebar.models_selected').replace('{count}', String(selected.length));
            })();
            const toggleSelectedModel = (code, available) => {
                if (!available || isRunning || !visibleModels.includes(code)) return;
                setSelectedModels((current) => {
                    if (current.includes(code)) {
                        if (current.length <= 1) return current;
                        return orderedSelectedModels(current.filter((item) => item !== code));
                    }
                    return orderedSelectedModels(current.concat(code));
                });
            };
            const toggleSelectAllModels = () => {
                if (isRunning || !availableSelectableCodes.length) return;
                setSelectedModels(availableSelectableCodes);
            };
            const toggleVisibleModel = (code) => {
                if (isRunning || !isForecastModelAvailable(code)) return;
                const removing = visibleModels.includes(code);
                setVisibleModels((current) => removing ? current.filter((item) => item !== code) : [...current, code]);
                if (removing) setSelectedModels((current) => current.filter((item) => item !== code));
                else setSelectedModels((current) => orderedSelectedModels(current.concat(code)));
            };
            const openModelSettings = () => {
                setModelPickerOpen(false);
                setSettingsTab('models');
                setIsSettingsOpen(true);
            };

            const openDetailedView = () => {
                if (!interfaceReady || !batchResults?.length) return;
                const target = (currentSku && batchResults.find(r => r.sku === currentSku)?.sku)
                    || batchResults[0].sku;
                handleSkuSelect(target);
            };

            const overviewRows = useMemo(() => {
                if (!mappedSkus.length) {
                    skuContestHighlightRef.current = {};
                    return [];
                }
                const resultMap = new Map((batchResults || []).map((r) => [String(r.sku), r]));
                const runningSet = new Set(runningSkus.map(String));
                const selectedSet = new Set(selectedSkus.map(String));
                const previousHighlight = skuContestHighlightRef.current;
                const nextHighlight = {};
                mappedSkus.forEach((sku) => {
                    const key = String(sku);
                    nextHighlight[key] = selectedSet.has(key)
                        ? contestMetric
                        : (previousHighlight[key] || contestMetric);
                });
                skuContestHighlightRef.current = nextHighlight;
                return mappedSkus.map((sku) => {
                    const result = resultMap.get(sku);
                    const trackedMethod = skuValidationMethods[String(sku)] || null;
                    const rowMetric = nextHighlight[String(sku)];
                    // While a SKU is re-running, never show stale metrics from a previous run.
                    if (runningSet.has(String(sku))) {
                        return {
                            sku,
                            status: 'running',
                            validation_method: trackedMethod,
                            best_ts_model: null,
                            mae_validation: null,
                            mse_validation: null,
                            rmse_validation: null,
                            mape_validation: null,
                            evaluation_metric: rowMetric,
                        };
                    }
                    if (result) {
                        return {
                            ...result,
                            status: 'success',
                            validation_method: result.validation_method || trackedMethod,
                        };
                    }
                    return {
                        sku,
                        status: 'not_run',
                        validation_method: null,
                        best_ts_model: null,
                        mae_validation: null,
                        mse_validation: null,
                        rmse_validation: null,
                        mape_validation: null,
                        evaluation_metric: rowMetric,
                    };
                });
            }, [mappedSkus, batchResults, runningSkus, skuValidationMethods, contestMetric, selectedSkus]);

            const handleOverviewSearchChange = useCallback((value) => {
                setOverviewSearchQuery(value);
                setActiveTab("overview");
            }, []);

            const filteredOverviewRows = useMemo(() => {
                const q = overviewSearchQuery.trim().toLowerCase();
                if (!q) return overviewRows;
                return overviewRows.filter((r) => String(r.sku).toLowerCase().includes(q));
            }, [overviewRows, overviewSearchQuery]);

            // Synchronize Validation Data with Forecast Data Timeline
            const alignedValidationData = useMemo(() => {
                if (!skuData || !skuData.forecast_data || !skuData.validation_data) return null;
                const valMap = new Map(skuData.validation_data.map(d => [d.date, d]));
                return skuData.forecast_data.map(fd => {
                    const vd = valMap.get(fd.date);
                    return {
                        ...vd, // Preserve preparation metadata and each point's train/test role.
                        date: fd.date, // Use forecast date as master axis
                        fitted: vd ? vd.fitted : null,
                        val_forecast: vd ? vd.val_forecast : null
                    };
                });
            }, [skuData]);

            return (
                <div className="flex h-full min-h-0 bg-slate-50 dark:bg-slate-950 overflow-hidden relative w-full transition-colors duration-300 mobile-landscape-root">
                    {isMappingModalOpen && <MappingModal baseUrl={BASE_URL} initialSource={mappingSource} onClose={() => setIsMappingModalOpen(false)} onConfirm={handleMappingConfirm} t={t} />}
                    <AlertModal
                        isOpen={!!alertMessage}
                        message={alertMessage || ''}
                        confirmLabel={t('dashboard.select_required_ok')}
                        onClose={() => setAlertMessage(null)}
                    />
                    <AlertModal
                        isOpen={rerunConfirmOpen}
                        message={t('dashboard.select_already_run')}
                        cancelLabel={t('dashboard.select_already_run_cancel')}
                        confirmLabel={t('dashboard.select_already_run_confirm')}
                        onClose={() => setRerunConfirmOpen(false)}
                        onConfirm={handleConfirmRerun}
                    />
                    {/* Mobile Sidebar Backdrop */}
                    {isSidebarOpen && (
                        <div
                            className="lg:hidden fixed inset-0 z-40 bg-slate-900/20 backdrop-blur-sm transition-opacity"
                            onClick={() => setIsSidebarOpen(false)}
                        />
                    )}

                    {/* SIDEBAR */}
                    <div className={`fc-sidebar-shell ${isFullScreen ? 'hidden' : ''} fixed lg:relative inset-y-0 left-0 z-50 w-64 ${isSidebarCollapsed ? 'lg:w-[76px]' : 'lg:w-64'} transform transition-all duration-300 ease-in-out ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}`}>
                        <button
                            onClick={() => setIsSidebarCollapsed(prev => !prev)}
                            className="fc-sidebar-toggle hidden lg:flex items-center justify-center h-6 w-6 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 hover:text-brand-gold hover:border-brand-gold shadow-md transition-colors"
                            title={isSidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'}
                        >
                            {isSidebarCollapsed ? <ChevronRightIcon /> : <ChevronLeftIcon />}
                        </button>
                    <aside data-collapsed={isSidebarCollapsed ? 'true' : 'false'} className={`fc-sidebar flex w-full h-full bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border-r border-white/20 dark:border-white/10 flex-col shadow-2xl lg:shadow-none`}>

                        <div className="h-16 flex items-center justify-center px-4 border-b border-white/20 dark:border-white/10 shrink-0 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md gap-2 relative sticky top-0 z-20">
                            <a href="./">
                                <img src="./icononly_transparent_nobuffer.png" className="h-8 w-8 md:h-10 md:w-10 object-contain cursor-pointer transition-transform hover:scale-110" onError={(e) => e.target.style.display = 'none'} />
                            </a>
                            <h1 className={`font-bold text-slate-800 dark:text-slate-100 tracking-tight text-base ${isSidebarCollapsed ? 'lg:hidden' : ''}`}>OPERARTIS</h1>
                            <button onClick={() => setIsSidebarOpen(false)} className="lg:hidden absolute right-4 text-slate-400"><XIcon /></button>
                        </div>

                        {isLargeScreen && isSidebarCollapsed && (
                        <div className="relative z-10 flex flex-1 flex-col items-center gap-3 pt-5 pb-4 min-h-0 pointer-events-auto">
                            <button
                                type="button"
                                onClick={() => {
                                    focusSearchOnExpand.current = true;
                                    setIsSidebarCollapsed(false);
                                }}
                                className="relative flex items-center justify-center h-11 w-11 rounded-xl border transition-all border-slate-200 dark:border-slate-700 text-slate-400 hover:text-brand-gold hover:border-brand-gold"
                                title={t('dashboard.search_placeholder')}
                                aria-label={t('dashboard.search_placeholder')}
                                aria-expanded={false}
                            >
                                <SearchIcon className="w-5 h-5" />
                                {overviewSearchQuery && <span className="absolute top-1.5 right-1.5 w-1.5 h-1.5 rounded-full bg-brand-gold" aria-hidden="true" />}
                            </button>
                            <button
                                type="button"
                                onClick={() => openSourceDialog()}
                                disabled={isRunning}
                                className={`relative flex items-center justify-center h-11 w-11 rounded-xl border transition-all disabled:cursor-not-allowed disabled:opacity-60 ${file ? (skuCol && startCol && endCol ? 'border-emerald-500/40 bg-emerald-500/10 text-emerald-500' : 'border-brand-gold/40 bg-amber-500/10 text-brand-gold') : 'border-slate-200 dark:border-slate-700 text-slate-400 hover:text-brand-gold hover:border-brand-gold'}`}
                                title={file ? file.name : t('sidebar.upload_label')}
                            >
                                <UploadIcon width="18" height="18" />
                                {file && <span className={`absolute -top-0.5 -right-0.5 h-2.5 w-2.5 rounded-full border-2 border-white dark:border-slate-900 ${skuCol && startCol && endCol ? 'bg-emerald-500' : 'bg-brand-gold'}`}></span>}
                            </button>
                            {file && (
                                <button
                                    onClick={() => openSourceDialog(true)}
                                    disabled={isRunning}
                                    className="flex items-center justify-center h-11 w-11 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-400 hover:text-brand-gold hover:border-brand-gold transition-all disabled:cursor-not-allowed disabled:opacity-60"
                                    title={t('sidebar.edit_mapping')}
                                >
                                    <ColumnsIcon width="18" height="18" />
                                </button>
                            )}
                            {mappingReady && (<>
                            <div className="h-px w-8 bg-slate-200 dark:bg-slate-700 my-1"></div>
                            <button
                                onClick={handleExecute}
                                disabled={!file || isRunning || invalidFrequency || historyTooLong || validationHorizonTooShort || simpleSplitInvalid}
                                className={`flex items-center justify-center h-11 w-11 rounded-xl shadow-sm transition-all ${isRunning ? 'fc-status-active cursor-not-allowed' : !file || invalidFrequency || historyTooLong || validationHorizonTooShort || simpleSplitInvalid ? 'bg-slate-100 dark:bg-slate-800 text-slate-400 cursor-not-allowed' : 'bg-brand-gold text-white hover:bg-brand-dark'}`}
                                title={isRunning ? t('sidebar.processing') : t('sidebar.execute_btn')}
                            >
                                {isRunning ? <RunningSpinnerIcon size={16} /> : <PlayIcon />}
                            </button>
                            <button
                                onClick={handleExport}
                                disabled={!file || !batchResults || isExporting || isRunning}
                                className={`flex items-center justify-center h-11 w-11 rounded-xl shadow-sm transition-all ${!file || !batchResults || isExporting || isRunning ? 'bg-slate-100 dark:bg-slate-800 text-slate-400 cursor-not-allowed' : 'bg-emerald-500 text-white hover:bg-emerald-600'}`}
                                title={isExporting ? t('sidebar.downloading') : t('sidebar.export_btn')}
                            >
                                {isExporting ? <RunningSpinnerIcon size={16} /> : <DownloadIcon />}
                            </button>
                            <button
                                onClick={handleReset}
                                disabled={isRunning}
                                className="mt-auto flex items-center justify-center h-11 w-11 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm text-slate-400 hover:text-red-500 hover:border-red-200 dark:hover:border-red-900/30 hover:bg-red-50/50 dark:hover:bg-red-950/20 transition-all box-border disabled:cursor-not-allowed disabled:opacity-60"
                                title={t('sidebar.reset_btn')}
                            >
                                <TrashIcon />
                            </button>
                            </>)}
                        </div>
                        )}

                        {showExpandedSidebarContent && (
                        <div className="fc-sidebar-expanded flex-1 overflow-y-auto scroller px-3 pt-3 pb-0 gap-6 min-h-0 flex flex-col">
                            <ForecastSearch inputRef={sidebarSearchRef} searchQuery={overviewSearchQuery} onSearchQueryChange={handleOverviewSearchChange} t={t} />
                            {/* 1. Source Data */}
