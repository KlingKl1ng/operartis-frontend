                            </div>

                            {/* Reset Button Area - Inside Body, Pushed to Bottom */}
                            <div className="pt-4 pb-1 !mt-auto">
                                <div className="p-2">
                                    <button type="button" onClick={handleReset} disabled={isRunning} className="w-full py-3 rounded-lg text-xs font-bold uppercase tracking-wide transition-all shadow-sm flex items-center justify-center gap-2 text-slate-400 hover:text-red-500 border border-transparent hover:border-red-200 dark:hover:border-red-900/30 hover:bg-red-50/50 dark:hover:bg-red-950/20 disabled:cursor-not-allowed disabled:opacity-60"><TrashIcon width="16" height="16" /> {t('sidebar.reset_btn')}</button>
                                </div>
                            </div>
                            </>)}
                        </div>
                        )}


                        {showExpandedSidebarContent && (
                        <div className="fc-sidebar-expanded sticky bottom-0 z-20 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-t border-white/20 dark:border-white/10 shrink-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.02)]">
                            <div className="p-4 text-center">
                                <p className="text-xs font-bold text-slate-700 dark:text-slate-200 uppercase tracking-wide">Operartis Analytics</p>
                                <p className="text-[10px] text-brand-gold mt-1 font-medium italic">Optimizing Today, Growing Tomorrow</p>
                            </div>
                        </div>
                        )}
                    </aside>
                    </div>

                    {/* MAIN CONTENT */}
                    <div className="flex flex-col flex-grow min-w-0 min-h-0 transition-all relative">
                        {/* Combined Header & Metrics Bar */}
                        <div className={`flex flex-col sticky top-0 z-30 shrink-0 ${isFullScreen ? 'hidden' : ''}`}>
                            <header className="fc-module-header h-16 bg-white/60 dark:bg-slate-900/60 backdrop-blur-md border-b border-white/20 dark:border-white/10 shrink-0 shadow-sm">
                                <div className="flex items-center justify-start min-h-[2.5rem]">
                                    <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="lg:hidden text-slate-500 min-h-11 min-w-11 inline-flex items-center justify-center rounded-lg -ml-1" aria-label="Open menu"><MenuIcon /></button>
                                </div>
                                <div className="fc-module-title text-[11px] sm:text-sm md:text-lg font-black text-transparent bg-clip-text bg-gradient-to-r from-brand-gold to-brand-dark uppercase tracking-widest">{t('header.title')}</div>
                                <div className="flex items-center justify-end gap-4 shrink-0 relative z-10">
                                    <div className="hidden sm:flex items-center gap-2 text-xs font-mono text-slate-500 dark:text-slate-400">
                                        {environmentBadge && (
                                            <div className={`hidden lg:flex items-center gap-1 px-1.5 py-0.5 rounded border bg-transparent text-[10px] font-bold uppercase tracking-wide ${environmentBadge.className}`} title={environmentBadge.title} aria-label={environmentBadge.title}><span className="w-3 h-3 flex shrink-0 [&_svg]:w-full [&_svg]:h-full"><ServerIcon /></span><span>{environmentBadge.label}</span></div>
                                        )}
                                    </div>
                                    <div id="operartis-auth-topbar-slot"></div>
                                </div>
                            </header>

                            {mappingReady && (
                            <JobStatusBar
                                status={jobStatus || 'ready'}
                                completedCount={jobStatus ? jobProgress.completed : 0}
                                queuePosition={jobProgress.queuePosition}
                                totalCount={jobProgress.total > 0 ? jobProgress.total : (selectedSkus.length || mappedSkus.length)}
                                canCancel={canCancelJob}
                                isCancelling={isCancelling}
                                onCancel={handleCancelJob}
                                compact={kpiValuesCollapsed}
                                t={t}
                            />
                            )}

                            {/* KPI BAR — with Overview tab after mapping confirm */}
                            {mappingReady && (
                            <div className={`fc-kpi-shell min-h-10 sm:min-h-12 bg-white/60 dark:bg-slate-900/60 backdrop-blur-xl border-b border-white/20 dark:border-white/10 w-full shrink-0 shadow-sm overflow-visible relative ${kpiValuesCollapsed ? 'is-values-collapsed' : ''}`}>
                                <KPICards results={batchResults} skuCount={mappedSkus.length} t={t} />
                                <button
                                    type="button"
                                    className="fc-kpi-collapse"
                                    aria-expanded={!kpiValuesCollapsed}
                                    aria-controls="fc-kpi-metrics"
                                    title={kpiValuesCollapsed ? t('dashboard.kpi_expand') : t('dashboard.kpi_collapse')}
                                    aria-label={kpiValuesCollapsed ? t('dashboard.kpi_expand') : t('dashboard.kpi_collapse')}
                                    onClick={toggleKpiValuesCollapsed}
                                >
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                                        {kpiValuesCollapsed
                                            ? <><path d="M7 8l5 5 5-5" /><path d="M7 13l5 5 5-5" /></>
                                            : <><path d="M7 16l5-5 5 5" /><path d="M7 11l5-5 5 5" /></>}
                                    </svg>
                                </button>
                            </div>
                            )}
                        </div>

                        <main className={`flex-grow flex flex-col bg-slate-50 dark:bg-slate-950 relative w-full min-h-0 overflow-hidden mobile-landscape-main ${isFullScreen ? 'hidden' : 'flex'}`}>

                            {/* CONTENT AREA */}
                            <div className="flex-1 min-h-0 p-2 md:px-4 md:pb-4 md:pt-2.5 relative overflow-y-auto scroller mobile-landscape-content">
                                {!mappingReady && (
                                    isPolling ? (
                                        <ForecastingLoader t={t} validationMethod={validationMethod} testHorizon={testHorizon} />
                                    ) : (
                                        <div className="h-full min-h-0 min-w-0 flex flex-col items-center justify-center pointer-events-none select-none" aria-hidden="true">
                                            <img
                                                src="./fulllogo_transparent_nobuffer.png"
                                                alt=""
                                                width="420"
                                                height="117"
                                                className="fc-empty-watermark object-contain"
                                            />
                                        </div>
                                    )
                                )}

                                {mappingReady && (
                                    <div className="fc-workspace h-full min-h-0 flex flex-col gap-2.5">
                                        <div className="shrink-0 min-w-0 w-full">
                                            <ResultsTabBar
                                                activeTab={activeTab}
                                                itemTabs={itemTabs}
                                                onSelectOverview={() => setActiveTab('overview')}
                                                onSelectItem={(sku) => {
                                                    setCurrentSku(sku);
                                                    setActiveTab(sku);
                                                }}
                                                onCloseItem={handleCloseItemTab}
                                                onReorderItems={handleReorderItemTabs}
                                                t={t}
                                            />
                                        </div>
                                        <div className="flex-1 min-h-0">
                                            {activeTab === 'overview' && (
                                                <BatchOverview
                                                    results={filteredOverviewRows}
                                                    onSelectSku={handleSkuSelect}
                                                    selectedSkus={selectedSkus}
                                                    onToggleSku={handleToggleSkuSelection}
                                                    onToggleSelectAll={handleToggleSelectAll}
                                                    evaluationMetric={contestMetric}
                                                    t={t}
                                                />
                                            )}
                                            {isDetailTab && skuData && (
                                                <div className="fc-detail-panel h-full w-full flex flex-col overflow-hidden max-md:bg-transparent md:border md:border-slate-200 md:dark:border-slate-800 md:rounded-lg md:bg-white md:dark:bg-slate-900 md:shadow-sm p-2 md:p-3 lg:p-4 relative min-h-0" key={layoutKey} role="region" aria-label={skuData.sku}>
                                                    <div className="flex flex-col flex-1 min-h-0 gap-3">
                                                        {/* Detail views and validation metrics */}
                                                        <DetailToolbar>
                                                        <div role="tablist" aria-label={t('sidebar.detail_views')} className="fc-detail-view-tabs flex flex-wrap items-center gap-1 min-w-0">
                                                            {['summary', 'visualization', 'replay'].map(view => <button key={view} type="button" role="tab"
                                                                id={`fc-detail-tab-${view}`} aria-controls={`fc-detail-panel-${view}`}
                                                                aria-selected={detailView === view} tabIndex={0}
                                                                {...bindDetailTab(view)}
                                                                onKeyDown={event => {
                                                                    if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
                                                                    event.preventDefault();
                                                                    const views = ['summary', 'visualization', 'replay'];
                                                                    const next = event.key === 'Home' ? views[0] : event.key === 'End' ? views[views.length - 1] : views[(views.indexOf(view) + (event.key === 'ArrowRight' ? 1 : views.length - 1)) % views.length];
                                                                    setDetailView(next);
                                                                    document.getElementById(`fc-detail-tab-${next}`)?.focus();
                                                                }}
                                                                className={`px-3 py-2 rounded-lg text-xs font-semibold transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-amber-500 ${detailView === view ? 'bg-amber-50 text-amber-700 dark:bg-amber-500/10 dark:text-amber-400' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}`}
                                                            >{t(`sidebar.detail_${view}`)}</button>)}
                                                            {skuData.fallback_reason && <button type="button" onClick={() => setDetailView('summary')}
                                                                className="ml-auto text-[10px] text-amber-700 dark:text-amber-400 font-semibold underline underline-offset-2">
                                                                {t('sidebar.model_substitution')}
                                                            </button>}
                                                        </div>
                                                            <div className="fc-detail-metrics flex items-center gap-2 sm:gap-1.5 lg:gap-2.5 shrink-0 bg-slate-100/80 dark:bg-white/5 px-2 py-1 sm:px-1.5 sm:py-0.5 lg:px-2 lg:py-1 rounded-lg border border-slate-200/80 dark:border-white/10 shadow-sm">
                                                                <div className="flex flex-col items-center text-center max-w-[7.5rem] lg:max-w-none">
                                                                    <span className="text-[8px] lg:text-[9px] uppercase font-bold text-slate-400">{t('dashboard.table_validation')}</span>
                                                                    <span
                                                                        className="text-[10px] lg:text-[11px] font-bold text-slate-700 dark:text-slate-300 truncate max-w-full"
                                                                        title={formatValidationMethod(skuData.validation_method || skuValidationMethods[String(skuData.sku)], t)}
                                                                    >
                                                                        {formatValidationMethod(skuData.validation_method || skuValidationMethods[String(skuData.sku)], t)}
                                                                    </span>
                                                                </div>
                                                                <div className="flex flex-col items-center text-center">
                                                                    <span className="text-[8px] lg:text-[9px] uppercase font-bold text-slate-400">{t('dashboard.best_model')}</span>
                                                                    <span className="text-[10px] lg:text-[11px] font-bold text-slate-700 dark:text-slate-300">{skuData.best_ts_model ? formatForecastModelLabel(skuData.best_ts_model, t) : '—'}</span>
                                                                </div>
                                                                <div className="flex flex-col items-center text-center">
                                                                    <span className="text-[8px] lg:text-[9px] uppercase font-bold text-slate-400">{t('dashboard.table_mape')}</span>
                                                                    <span className="text-[10px] lg:text-[11px] font-bold text-slate-700 dark:text-slate-300">{formatEvaluationValue(evaluationMetricValue(skuData, 'mape'), 'mape', t.numberLocale)}</span>
                                                                </div>
                                                                <div className="flex flex-col items-center text-center">
                                                                    <span className="text-[8px] lg:text-[9px] uppercase font-bold text-slate-400">{t('dashboard.table_rmse')}</span>
                                                                    <span className={`text-[10px] lg:text-[11px] font-bold ${rowContestMetric(skuData, contestMetric) === 'rmse' ? 'text-amber-600 dark:text-amber-400' : 'text-slate-700 dark:text-slate-300'}`}>{formatEvaluationValue(evaluationMetricValue(skuData, 'rmse'), 'rmse', t.numberLocale)}</span>
                                                                </div>
                                                                <div className="flex flex-col items-center text-center">
                                                                    <span className="text-[8px] lg:text-[9px] uppercase font-bold text-slate-400">{t('dashboard.table_mae')}</span>
                                                                    <span className={`text-[10px] lg:text-[11px] font-bold ${rowContestMetric(skuData, contestMetric) === 'mae' ? 'text-amber-600 dark:text-amber-400' : 'text-slate-700 dark:text-slate-300'}`}>{formatEvaluationValue(evaluationMetricValue(skuData, 'mae'), 'mae', t.numberLocale)}</span>
                                                                </div>
                                                            </div>
                                                        </DetailToolbar>
                                                        {detailView === 'summary' && <div key={`summary-${skuData.sku}`} id="fc-detail-panel-summary" role="tabpanel" aria-labelledby="fc-detail-tab-summary" tabIndex={0} className="fc-detail-scroll scroller flex-1 min-h-0">
                                                            <div className="flex flex-col gap-4 pb-1 pr-1">
                                                        <ForecastRunSummary data={skuData} t={t} />
                                                        <ModelSelectionNotice data={skuData} t={t} />
                                                        <ValidationDetails data={skuData} t={t} onInformation={setValidationInformation} onReplayEvaluation={index => {
                                                            const saved = replayPositions.current.get(skuData);
                                                            replayPositions.current.set(skuData, { index, phase: 2, speed: saved?.speed ?? 1 });
                                                            setDetailView('replay');
                                                            document.getElementById('fc-detail-tab-replay')?.focus();
                                                        }} />
                                                        <ForecastValuesTable data={skuData.forecast_data} preparation={skuData.preparation} sku={skuData.sku} t={t} />
                                                            </div>
                                                        </div>}
                                                        {detailView === 'replay' && <div key={`replay-${skuData.sku}`} id="fc-detail-panel-replay" role="tabpanel" aria-labelledby="fc-detail-tab-replay" tabIndex={0} className="fc-detail-scroll scroller flex-1 min-h-0">
                                                            <ValidationReplay data={skuData} isDark={isDark} t={t} savedPositions={replayPositions} />
                                                        </div>}
                                                        {detailView === 'visualization' && <div key={`visualization-${skuData.sku}`} id="fc-detail-panel-visualization" role="tabpanel" aria-labelledby="fc-detail-tab-visualization" tabIndex={0} className="fc-visualization-panel fc-detail-scroll scroller flex-1 min-h-0">
                                                        <SynchronizedForecastCharts key={skuData.sku} validationData={alignedValidationData} forecastData={skuData.forecast_data} isDark={isDark} t={t} />
                                                        </div>}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </main>
                    </div>

                    {/* FULL SCREEN */}


                    {validationInformation && <ValidationInformationPanel mode={validationInformation} t={t} onClose={closeValidationInformation} />}
                    <SettingsModal isOpen={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} activeTab={settingsTab} setActiveTab={setSettingsTab} theme={theme} setTheme={setTheme} lang={lang} setLang={setLang} t={t} visibleModels={visibleModels} onToggleVisibleModel={toggleVisibleModel} isModelAvailable={isForecastModelAvailable} capabilitiesStatus={forecastCapabilities.status} isRunning={isRunning} />
                </div>
            );
        };
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>

</html>
