<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Operartis | Page not found</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: #e2e8f0;
            background:
                radial-gradient(60% 50% at 50% 0%, rgba(245, 158, 11, 0.12), transparent 65%),
                #020617;
            text-align: center;
        }
        main { max-width: 34rem; }
        img { width: 56px; height: 56px; }
        .code {
            margin: 1.5rem 0 0.5rem;
            font-family: 'Roboto Mono', ui-monospace, monospace;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: #f59e0b;
        }
        h1 { margin: 0 0 1rem; font-size: clamp(1.75rem, 5vw, 2.75rem); line-height: 1.15; letter-spacing: -0.02em; color: #fff; }
        p { margin: 0 0 2rem; line-height: 1.6; color: #94a3b8; }
        a.btn {
            display: inline-block;
            padding: 0.85rem 1.75rem;
            border-radius: 0.75rem;
            background: #f59e0b;
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            box-shadow: 0 10px 24px rgba(245, 158, 11, 0.25);
        }
        a.btn:hover { background: #d97706; }
    </style>
</head>

<body>
    <main>
        <img src="/icononly_transparent_nobuffer.png" alt="Operartis">
        <p class="code">Error 404</p>
        <h1>Page not found</h1>
        <p>The page you are looking for does not exist or has moved.</p>
        <a class="btn" href="/">Back to Operartis</a>
    </main>
</body>

</html>
